<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GAES — Gidroakkumulyator Stansiya</title>
  <style>
    /* =========================================================================
       MIRVO AI — STRICT ZERO-UI & PURE #FFFFFF CANVAS FOUNDATION
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .mirvo-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #ffffff;
    }

    .mirvo-stage {
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      transform-origin: 50% 50%;
      transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    #mirvo-svg {
      display: block;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: visible;
    }

    /* =========================================================================
       SEQUENTIAL SPOTLIGHT FOCUS / DIMMING TRANSITIONS
       ========================================================================= */
    .mirvo-part {
      cursor: pointer;
      transition:
        opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.48s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mirvo-part[data-part="housing"] {
      cursor: default;
    }

    .mirvo-part.is-dimmed {
      opacity: 0.22;
      filter: blur(1.2px) saturate(0.45);
    }

    .mirvo-part.is-focused {
      opacity: 1;
      filter: drop-shadow(0 6px 16px rgba(2, 132, 199, 0.24));
    }

    /* Crisp technical ink outlines across all zoom levels */
    .ink {
      stroke: #222933;
      stroke-width: 1.25;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .ink-thin {
      stroke: #222933;
      stroke-width: 0.9;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .ink-subtle {
      stroke: #334155;
      stroke-width: 0.75;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .ink-water {
      stroke: #0369A1;
      stroke-width: 0.9;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    @media (prefers-reduced-motion: reduce) {
      .mirvo-stage {
        transition: none;
      }
      .mirvo-part {
        transition: opacity 0.2s ease;
      }
    }
  </style>
</head>
<body>

        simTime: 0,
        flowVelocity: 0.0, // smooth range [-1, +1]; +1 = generate (down), -1 = pump (up)
        waterLevel: 0.45, // +1 = upper full / lower low, -1 = upper low / lower full
        flowDistance: 0,
        runnerAngle: 0,
        scrollAngle: 0,
        energyDistance: 0,
        explodeTarget: 0,
        explodeCurrent: 0,
        focusedPart: null, // null = full
        autoTourEnabled: true,
        tourIndex: 0,
        tourTimerId: null
      };

      /* =========================================================================
         5. CAMERA, HIGHLIGHT & EXPLODED VIEW CONTROLLERS
         ========================================================================= */
      function applyCamera(target) {
        try {
          let cam = CAMERA_TARGETS.full;
          if (typeof target === "string") {
            cam = CAMERA_TARGETS[target] || CAMERA_TARGETS.full;
          } else if (target && typeof target === "object") {
            const x = Number.isFinite(target.x) ? target.x : 800;
            const y = Number.isFinite(target.y) ? target.y : 450;
            const zoom = Number.isFinite(target.zoom) ? Math.max(0.5, Math.min(3.5, target.zoom)) : 1.0;
            cam = { x, y, zoom };
          }

          if (prefersReducedMotion && state.autoTourEnabled) {
            stageEl.style.transform = "scale(1) translate(0%, 0%)";
            return;
          }

          const dx = ((800 - cam.x) / 1600) * 100;
          const dy = ((450 - cam.y) / 900) * 100;
          stageEl.style.transform = `scale(${cam.zoom.toFixed(4)}) translate(${dx.toFixed(3)}%, ${dy.toFixed(3)}%)`;
        } catch (err) {
          console.error("Camera update error:", err);
        }
      }

      function applyHighlight(partId) {
        try {
          const validPart = partId && PART_MAP[partId] ? partId : null;
          state.focusedPart = validPart;

          allPartEls.forEach((el) => {
            const dp = el.getAttribute("data-part");
            if (!validPart) {
              el.classList.remove("is-dimmed", "is-focused");
            } else if (dp === validPart) {
              el.classList.remove("is-dimmed");
              el.classList.add("is-focused");
            } else {
              el.classList.remove("is-focused");
              el.classList.add("is-dimmed");
            }
          });
        } catch (err) {
          console.error("Highlight update error:", err);
        }
      }

      function applyExplodeTransforms(amount) {
        for (const [partId, wrap] of Object.entries(explodeWraps)) {
          if (!wrap) continue;
          const vec = EXPLODE_VECTORS[partId];
          const tx = (vec.x * amount).toFixed(2);
          const ty = (vec.y * amount).toFixed(2);
          wrap.setAttribute("transform", `translate(${tx}, ${ty})`);
        }
      }

      /* =========================================================================
         6. SEQUENTIAL AUTO-SPOTLIGHT TOUR ENGINE
         ========================================================================= */
      function clearTourTimer() {
        if (state.tourTimerId !== null) {
          window.clearTimeout(state.tourTimerId);
          state.tourTimerId = null;
        }
      }

      function scheduleNextTourStep() {
        clearTourTimer();
        if (!state.autoTourEnabled) return;

        const currentTarget = TOUR_SEQUENCE[state.tourIndex];
        const delay = currentTarget === "full" ? TOUR_DURATION_FULL_MS : TOUR_DURATION_PART_MS;

        state.tourTimerId = window.setTimeout(() => {
          if (!state.autoTourEnabled) return;
          state.tourIndex = (state.tourIndex + 1) % TOUR_SEQUENCE.length;
          const nextTarget = TOUR_SEQUENCE[state.tourIndex];
          if (nextTarget === "full") {
            applyCamera("full");
            applyHighlight(null);
          } else {
            applyCamera(nextTarget);
            applyHighlight(nextTarget);
          }
          scheduleNextTourStep();
        }, delay);
      }

      function startAutoTour(fromStart = false) {
        state.autoTourEnabled = true;
        if (fromStart) {
          state.tourIndex = 0;
          applyCamera("full");
          applyHighlight(null);
        }
        scheduleNextTourStep();
      }

      function stopAutoTour() {
        state.autoTourEnabled = false;
        clearTourTimer();
      }

      /* =========================================================================
         7. 60 FPS SMOOTH REVERSIBLE GAES PHYSICS ENGINE
         ========================================================================= */
      function computeTargetVelocity(simTime, mode) {
        if (mode === "generate") return 1.0;
        if (mode === "pump") return -1.0;

        // "auto" mode: 20s full cycle — 10s Generation (+1), 10s Pumping (-1)
        // Smooth cubic-sine easing through 0 over ~2s at each transition
        const cyclePeriod = 20.0;
        const phase = (simTime % cyclePeriod) / cyclePeriod; // 0..1
        // Use a flattened sine wave for steady flow plateaus and silky transitions
        const rawSin = Math.sin(phase * Math.PI * 2);
        const shaped = Math.tanh(rawSin * 3.1) / Math.tanh(3.1);
        return shaped;
      }

      function updatePhysics(dt) {
        // Smoothly interpolate explode amount even if physics is paused
        const explodeDiff = state.explodeTarget - state.explodeCurrent;
        if (Math.abs(explodeDiff) > 0.0005) {
          state.explodeCurrent += explodeDiff * Math.min(1, dt * 7.5);
          applyExplodeTransforms(state.explodeCurrent);
        } else if (state.explodeCurrent !== state.explodeTarget) {
          state.explodeCurrent = state.explodeTarget;
          applyExplodeTransforms(state.explodeCurrent);
        }

        if (!state.playing) return;

        state.simTime += dt;

        // Smooth velocity easing (zero snaps when switching modes)
        const targetVel = computeTargetVelocity(state.simTime, state.phaseMode);
        state.flowVelocity += (targetVel - state.flowVelocity) * Math.min(1, dt * 3.2);

        const v = state.flowVelocity;
        const absV = Math.abs(v);
        const t = state.simTime;

        // Water level transfer: inverse upper/lower movement
        if (state.phaseMode === "auto") {
          // Smooth integral of generation/pumping cycle
          state.waterLevel -= v * dt * 0.16;
          state.waterLevel = Math.max(-0.95, Math.min(0.95, state.waterLevel));
        } else if (state.phaseMode === "generate") {
          // Gentle continuous breathing around mid-low upper level while generating
          const drift = -0.35 + Math.sin(t * 0.45) * 0.35;
          state.waterLevel += (drift - state.waterLevel) * Math.min(1, dt * 0.6);
        } else {
          // Gentle continuous breathing around high upper level while pumping
          const drift = 0.45 + Math.sin(t * 0.45) * 0.35;
          state.waterLevel += (drift - state.waterLevel) * Math.min(1, dt * 0.6);
        }

        // Accumulate continuous distances & rotations
        state.flowDistance += v * dt * 115;
        state.runnerAngle = (state.runnerAngle + v * dt * 290) % 360;
        state.scrollAngle = (state.scrollAngle + v * dt * 175) % 360;
        state.energyDistance += v * dt * 0.72;

        // ----- A. UPPER & LOWER BASIN WATER LEVELS & RIPPLES -----
        const upperShiftY = (0.4 - state.waterLevel) * 7.5; // + = lower water, - = higher water
        const lowerShiftY = (state.waterLevel - 0.1) * 7.2; // inverse movement

        upperWaterGroup.setAttribute("transform", `translate(0, ${upperShiftY.toFixed(2)})`);
        lowerWaterGroup.setAttribute("transform", `translate(0, ${lowerShiftY.toFixed(2)})`);

        // Subtle surface wave shimmer
        const uw1 = Math.sin(t * 2.1) * 3.5;
        const uw2 = Math.cos(t * 1.7 + 1.1) * 4.0;
        upperWave1.setAttribute("transform", `translate(${uw1.toFixed(2)}, ${(uw1 * 0.35).toFixed(2)})`);
        upperWave2.setAttribute("transform", `translate(${(-uw2).toFixed(2)}, ${(uw2 * 0.3).toFixed(2)})`);
        upperWave3.setAttribute("transform", `translate(${(uw2 * 0.7).toFixed(2)}, ${(-uw1 * 0.25).toFixed(2)})`);

        const lw1 = Math.sin(t * 1.9 + 0.5) * 4.2;
        const lw2 = Math.cos(t * 1.5 + 2.0) * 3.8;
        lowerWave1.setAttribute("transform", `translate(${lw1.toFixed(2)}, ${(lw1 * 0.4).toFixed(2)})`);
        lowerWave2.setAttribute("transform", `translate(${(-lw2).toFixed(2)}, ${(lw2 * 0.35).toFixed(2)})`);

        // Upper basin intake vortex (contracts inward on generation, expands outward on pumping)
        const vortexPhase = ((t * 0.85 * (v >= 0 ? -1 : 1)) % 1 + 1) % 1;
        const vr1 = 10 + vortexPhase * 22;
        const vr2 = 10 + ((vortexPhase + 0.5) % 1) * 22;
        vortexRing1.setAttribute("rx", vr1.toFixed(1));
        vortexRing1.setAttribute("ry", (vr1 * 0.45).toFixed(1));
        vortexRing1.setAttribute("opacity", (Math.sin(vortexPhase * Math.PI) * 0.72 * (0.25 + absV * 0.75)).toFixed(2));
        vortexRing2.setAttribute("rx", vr2.toFixed(1));
        vortexRing2.setAttribute("ry", (vr2 * 0.45).toFixed(1));
        vortexRing2.setAttribute("opacity", (Math.sin(((vortexPhase + 0.5) % 1) * Math.PI) * 0.72 * (0.25 + absV * 0.75)).toFixed(2));
        vortexSwirl.setAttribute("transform", `rotate(${(state.scrollAngle * 0.9).toFixed(1)})`);

        // Lower basin draft-tube plume ripples (expands on generation, draws inward on pumping)
        const plumeDir = v >= 0 ? 1 : -1;
        const p1 = ((t * 0.75 * plumeDir) % 1 + 1) % 1;
        const p2 = (p1 + 0.333) % 1;
        const p3 = (p1 + 0.666) % 1;
        const plumeBoost = 0.25 + absV * 0.75;

        [
          [plumeRing1, p1],
          [plumeRing2, p2],
          [plumeRing3, p3]
        ].forEach(([ring, p]) => {
          const rx = 14 + p * 44;
          ring.setAttribute("rx", rx.toFixed(1));
          ring.setAttribute("ry", (rx * 0.48).toFixed(1));
          ring.setAttribute("opacity", (Math.sin(p * Math.PI) * 0.8 * plumeBoost).toFixed(2));
        });
        plumeGlow.setAttribute("opacity", (0.22 + absV * 0.36 + Math.sin(t * 5.2) * 0.06).toFixed(2));

        // ----- B. PENSTOCK PRESSURIZED WATER FLOW -----
        // Dash-offset on parallel cyan streams
        const streamLines = penstockStreams.children;
        const dashOffset = -state.flowDistance;
        streamLines[0].setAttribute("stroke-dashoffset", dashOffset.toFixed(1));
        streamLines[1].setAttribute("stroke-dashoffset", (dashOffset * 1.22).toFixed(1));
        streamLines[2].setAttribute("stroke-dashoffset", (dashOffset * 0.86).toFixed(1));

        // Directional hydro chevrons smoothly flip orientation when crossing v = 0
        const chevDirScale = v >= 0 ? 1 : -1;
        const chevOpacity = Math.min(0.92, absV * 1.35);
        penstockChevronsEl.setAttribute("opacity", chevOpacity.toFixed(2));
        const spanMin = -132;
        const spanLen = 256;
        for (let i = 0; i < chevronPool.length; i++) {
          const item = chevronPool[i];
          const prog = (((item.offset + state.flowDistance / spanLen) % 1) + 1) % 1;
          const x = spanMin + prog * spanLen;
          item.el.setAttribute("transform", `translate(${x.toFixed(1)}, -4) scale(${chevDirScale}, 1)`);
        }

        // Pressurized micro-bubbles
        for (let i = 0; i < penstockBubblePool.length; i++) {
          const b = penstockBubblePool[i];
          const prog = (((b.offset + (state.flowDistance * b.speedScale) / spanLen) % 1) + 1) % 1;
          const x = spanMin + prog * spanLen;
          const y = b.baseY + Math.sin(t * 4.5 + b.phase) * 1.6;
          b.el.setAttribute("cx", x.toFixed(1));
          b.el.setAttribute("cy", y.toFixed(1));
          b.el.setAttribute("opacity", (0.3 + absV * 0.55).toFixed(2));
        }

        // ----- C. REVERSIBLE FRANCIS RUNNER, SCROLL SWIRL & DRAFT TUBE -----
        runnerWheelEl.setAttribute("transform", `rotate(${state.runnerAngle.toFixed(2)})`);
        scrollWaterSwirlEl.setAttribute("transform", `rotate(${state.scrollAngle.toFixed(2)})`);

        const draftDash = -state.flowDistance * 0.55;
        draftLines[0].setAttribute("stroke-dashoffset", draftDash.toFixed(1));
        draftLines[1].setAttribute("stroke-dashoffset", (draftDash * 1.18).toFixed(1));
        draftLines[2].setAttribute("stroke-dashoffset", (draftDash * 0.88).toFixed(1));

        for (let i = 0; i < draftBubblePool.length; i++) {
          const b = draftBubblePool[i];
          const prog = (((b.offset + state.flowDistance / 110) % 1) + 1) % 1;
          const y = 648 + prog * 48;
          const x = b.laneX + Math.sin(t * 4.8 + b.phase) * 2.2;
          b.el.setAttribute("cx", x.toFixed(1));
          b.el.setAttribute("cy", y.toFixed(1));
          b.el.setAttribute("opacity", (Math.sin(prog * Math.PI) * (0.28 + absV * 0.62)).toFixed(2));
        }

        // ----- D. ELECTROMAGNETIC GLOW & ELECTRICAL POWER PULSES -----
        const acShimmer = 0.5 + 0.5 * Math.sin(t * 11.5);
        const powerIntensity = absV * (0.62 + 0.38 * acShimmer);

        generatorEmGlow.setAttribute("opacity", (0.12 + powerIntensity * 0.68).toFixed(2));
        transformerFluxGlow.setAttribute("opacity", (0.14 + powerIntensity * 0.72).toFixed(2));

        // Busbar pulses: Generation -> Generator (752,510) to Transformer (876,548); Pumping -> reverse
        for (let i = 0; i < busbarPulsePool.length; i++) {
          const p = busbarPulsePool[i];
          const prog = (((p.offset + state.energyDistance) % 1) + 1) % 1;
          const x = 752 + prog * (876 - 752);
          const y = 510 + prog * (548 - 510);
          p.el.setAttribute("cx", x.toFixed(1));
          p.el.setAttribute("cy", y.toFixed(1));
          const edgeFade = Math.sin(prog * Math.PI);
          p.el.setAttribute("opacity", (edgeFade * Math.min(1, absV * 1.3)).toFixed(2));
        }

        // HV Bushing rings: Generation -> rise UP to grid; Pumping -> descend DOWN from grid
        for (let i = 0; i < bushingPulsePool.length; i++) {
          const p = bushingPulsePool[i];
          const prog = (((p.offset + state.energyDistance * 1.1) % 1) + 1) % 1;
          // prog 0 -> baseY, prog 1 -> topY (moves upward when v > 0, downward when v < 0)
          const y = p.bushing.baseY - prog * (p.bushing.baseY - p.bushing.topY);
          const rx = 6.5 + Math.sin(prog * Math.PI) * 4.5;
          p.el.setAttribute("cy", y.toFixed(1));
          p.el.setAttribute("rx", rx.toFixed(1));
          p.el.setAttribute("ry", (rx * 0.44).toFixed(1));
          const edgeFade = Math.sin(prog * Math.PI);
          p.el.setAttribute("opacity", (edgeFade * Math.min(0.95, absV * 1.35)).toFixed(2));
        }
      }

      /* =========================================================================
         8. MAIN 60 FPS ANIMATION LOOP
         ========================================================================= */
      let lastTimestamp = performance.now();

      function frameLoop(now) {
        const dt = Math.min((now - lastTimestamp) / 1000, 0.05);
        lastTimestamp = now;
        updatePhysics(dt);
        window.requestAnimationFrame(frameLoop);
      }

      /* =========================================================================
         9. PUBLIC MIRVO SCENE API & POSTMESSAGE BRIDGE
         ========================================================================= */
      const MirvoScene = {
        deviceId: DEVICE_ID,
        parts: PARTS.map((p) => ({ ...p })),

        focus(target) {
          try {
            applyCamera(target);
          } catch (err) {
            console.error("MirvoScene.focus error:", err);
          }
        },

        highlight(partId) {
          try {
            applyHighlight(partId);
          } catch (err) {
            console.error("MirvoScene.highlight error:", err);
          }
        },

        setStep(index) {
          try {
            const idx = Math.max(0, Math.min(TOUR_SEQUENCE.length - 1, Math.round(Number(index) || 0)));
            stopAutoTour();
            state.tourIndex = idx;
            const target = TOUR_SEQUENCE[idx];
            if (target === "full") {
              applyCamera("full");
              applyHighlight(null);
            } else {
              applyCamera(target);
              applyHighlight(target);
            }
          } catch (err) {
            console.error("MirvoScene.setStep error:", err);
          }
        },

        setAutoTour(enabled) {
          try {
            if (Boolean(enabled)) {
              startAutoTour(false);
            } else {
              stopAutoTour();
            }
          } catch (err) {
            console.error("MirvoScene.setAutoTour error:", err);
          }
        },

        setExploded(amount) {
          try {
            const clamped = Math.max(0, Math.min(1, Number(amount) || 0));
            state.explodeTarget = clamped;
          } catch (err) {
            console.error("MirvoScene.setExploded error:", err);
          }
        },

        setPhase(mode) {
          try {
            if (mode === "auto" || mode === "generate" || mode === "pump") {
              state.phaseMode = mode;
            }
          } catch (err) {
            console.error("MirvoScene.setPhase error:", err);
          }
        },

        setPlaying(playing) {
          try {
            state.playing = Boolean(playing);
          } catch (err) {
            console.error("MirvoScene.setPlaying error:", err);
          }
        },

        reset() {
          try {
            state.explodeTarget = 0;
            state.phaseMode = "auto";
            state.playing = true;
            startAutoTour(true);
          } catch (err) {
            console.error("MirvoScene.reset error:", err);
          }
        }
      };

      window.MirvoScene = MirvoScene;

      window.addEventListener("message", (event) => {
        try {
          const msg = event && event.data;
          if (!msg || typeof msg !== "object" || typeof msg.type !== "string") return;

          switch (msg.type) {
            case "FOCUS":
              stopAutoTour();
              MirvoScene.focus(msg.target);
              break;
            case "HIGHLIGHT":
              MirvoScene.highlight(msg.partId ?? null);
              break;
            case "SET_STEP":
              MirvoScene.setStep(msg.index);
              break;
            case "SET_AUTO_TOUR":
              MirvoScene.setAutoTour(msg.enabled);
              break;
            case "EXPLODE":
              MirvoScene.setExploded(msg.amount);
              break;
            case "SET_PHASE":
              MirvoScene.setPhase(msg.mode);
              break;
            case "SET_PLAYING":
              MirvoScene.setPlaying(msg.playing);
              break;
            case "RESET":
              MirvoScene.reset();
              break;
            default:
              break;
          }
        } catch (err) {
          console.error("postMessage handler error:", err);
        }
      });

      /* =========================================================================
         10. DIRECT USER INTERACTIONS (CLICK, DOUBLE-CLICK, KEYBOARD)
         ========================================================================= */
      function emitPartClick(partId) {
        const meta = PART_MAP[partId];
        if (!meta) return;
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(
              {
                type: "PART_CLICK",
                deviceId: DEVICE_ID,
                partId: meta.id,
                nameUz: meta.nameUz
              },
              "*"
            );
          }
        } catch (err) {
          console.error("PART_CLICK postMessage error:", err);
        }
      }

      svgEl.addEventListener("click", (e) => {
        const partGroup = e.target.closest(".mirvo-part");
        const partId = partGroup ? partGroup.getAttribute("data-part") : null;

        if (partId && PART_MAP[partId]) {
          stopAutoTour();
          const stepIdx = TOUR_SEQUENCE.indexOf(partId);
          if (stepIdx !== -1) state.tourIndex = stepIdx;
          applyCamera(partId);
          applyHighlight(partId);
          emitPartClick(partId);
        } else {
          // Clicking empty white space or housing resets view & resumes auto-tour
          MirvoScene.reset();
        }
      });

      viewportEl.addEventListener("click", (e) => {
        if (e.target === viewportEl || e.target === stageEl) {
          MirvoScene.reset();
        }
      });

      // Double-click anywhere smoothly toggles Exploded View
      viewportEl.addEventListener("dblclick", (e) => {
        e.preventDefault();
        MirvoScene.setExploded(state.explodeTarget > 0.5 ? 0 : 1);
      });

      // Keyboard shortcuts: R / Escape -> Reset, E -> Toggle Exploded View
      window.addEventListener("keydown", (e) => {
        const key = e.key;
        if (key === "Escape" || key === "r" || key === "R") {
          MirvoScene.reset();
        } else if (key === "e" || key === "E") {
          MirvoScene.setExploded(state.explodeTarget > 0.5 ? 0 : 1);
        }
      });

      /* =========================================================================
         11. BOOTSTRAP ON LOAD
         ========================================================================= */
      window.addEventListener("load", () => {
        applyCamera("full");
        applyHighlight(null);
        startAutoTour(true);
        lastTimestamp = performance.now();
        window.requestAnimationFrame(frameLoop);
      });
    })();
  </script>
</body>
</html>
