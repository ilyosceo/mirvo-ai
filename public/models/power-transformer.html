        }, wHousingFront);

        // Two neat slate-blue tank tie-down mounting brackets/lugs bolted along front-left edge
        [1.25, 8.65].forEach(function (bu) {
          isoBox(wHousingFront, bu - 0.44, TV0 - 0.36, -0.02, bu + 0.44, TV0 + 0.04, 0.22, {
            top: "#86A1BC", left: "#5E7B98", right: "#3E5871"
          }, { sw: 1.35 });
          // Recessed slot & anchor bolt inside mounting lug
          isoBox(wHousingFront, bu - 0.22, TV0 - 0.36, -0.02, bu + 0.22, TV0 - 0.08, 0.14, {
            top: "#334155", left: "#1E293B", right: "#0F172A"
          }, { sw: 1.05 });
        });
      }

      /* =====================================================================
         4.9. PORCELAIN BUSHINGS: 4 Rear LV Ivory + 3 Front Tall HV Terracotta
         ===================================================================== */
      function buildBushings() {
        /**
         * Renders a realistic multi-shed ribbed glazed porcelain bushing.
         */
        function drawBushing(cu, cv, isHv, phaseShift) {
          const g = el("g", null, wBushings);
          const zBase = TZ1;

          if (isHv) {
            // Bolted square slate-blue mounting flange base
            isoBox(g, cu - 0.56, cv - 0.56, zBase, cu + 0.56, cv + 0.56, zBase + 0.22, {
              top: "#7692AE", left: "#4D6883", right: "#344A61"
            }, { sw: 1.35 });
            // 4 corner flange bolts
            [[-0.40, -0.40], [0.40, -0.40], [0.40, 0.40], [-0.40, 0.40]].forEach(function (off) {
              const bp = iso(cu + off[0], cv + off[1], zBase + 0.23);
              el("circle", { cx: bp[0].toFixed(1), cy: bp[1].toFixed(1), r: 2.3, fill: "#CBD5E1", stroke: INK, "stroke-width": 0.9 }, g);
            });

            // Cylindrical steel base collar
            isoCylZ(g, cu, cv, zBase + 0.22, zBase + 0.54, 0.38, {
              side: "#5E7B98", top: "#86A1BC"
            }, { sw: 1.3 });

            // 9 tapered ribbed warm terracotta-brown glazed porcelain sheds
            const sheds = 9;
            const zS0 = zBase + 0.52;
            const shedH = 0.24;
            for (let s = 0; s < sheds; s++) {
              const frac = s / (sheds - 1);
              const rRib = 0.46 - frac * 0.08;
              const rCore = rRib * 0.72;
              const sz = zS0 + s * shedH;

              // Undercut neck
              isoCylZ(g, cu, cv, sz, sz + shedH * 0.42, rCore, {
                side: "#592A12", top: "#8C4724"
              }, { top: false, sw: 1.15, steps: 18 });

              // Flared ribbed porcelain shed skirt
              isoCylZ(g, cu, cv, sz + shedH * 0.34, sz + shedH * 0.88, rRib, {
                side: "url(#grad-hv-porcelain)", top: "#E0986E"
              }, { sw: 1.25, steps: 20 });
            }

            // Satin brushed-copper angled HV clamp terminal crown
            const zCrown = zS0 + sheds * shedH;
            isoCylZ(g, cu, cv, zCrown - 0.04, zCrown + 0.28, 0.26, {
              side: "url(#grad-brass-cap)", top: "#FDE8D2"
            }, { sw: 1.25 });

            // Vertical clamp block + angled copper conductor lug
            isoBox(g, cu - 0.14, cv - 0.16, zCrown + 0.26, cu + 0.14, cv + 0.18, zCrown + 0.78, {
              top: "#FDE8D2", left: "#E69F68", right: "#B85F27"
            }, { sw: 1.25 });
            isoCylV(g, cu, cv + 0.08, cv + 0.48, zCrown + 0.62, 0.14, {
              side: "url(#grad-brass-cap)", cap: "#C26D32"
            }, { sw: 1.2 });

            // Subtle AC golden corona shimmer at HV copper terminal
            const cPt = iso(cu, cv + 0.28, zCrown + 0.64);
            const corona = el("circle", {
              cx: cPt[0].toFixed(1), cy: cPt[1].toFixed(1), r: 19,
              fill: "url(#grad-corona-hv)", filter: "url(#corona-blur)", opacity: 0.45
            }, g);
            animCoronaGlows.push({ el: corona, phase: phaseShift, baseOp: 0.35, amp: 0.30, kind: "hv" });
          } else {
            // LV shorter ivory-ceramic bushing: circular steel base collar
            isoCylZ(g, cu, cv, zBase, zBase + 0.26, 0.30, {
              side: "#5E7B98", top: "#9BB5CE"
            }, { sw: 1.25 });

            // 4 ribbed clean ivory-ceramic porcelain sheds
            const sheds = 4;
            const zS0 = zBase + 0.24;
            const shedH = 0.23;
            for (let s = 0; s < sheds; s++) {
              const frac = s / (sheds - 1);
              const rRib = 0.34 - frac * 0.05;
              const rCore = rRib * 0.68;
              const sz = zS0 + s * shedH;

              isoCylZ(g, cu, cv, sz, sz + shedH * 0.42, rCore, {
                side: "#A89F8F", top: "#D8D1C2"
              }, { top: false, sw: 1.1, steps: 16 });

              isoCylZ(g, cu, cv, sz + shedH * 0.32, sz + shedH * 0.86, rRib, {
                side: "url(#grad-ivory-cyl)", top: "#FFFFFF"
              }, { sw: 1.2, steps: 18 });
            }

            // Brushed-copper flat bus-lug terminal with two small bolt holes
            const zCrown = zS0 + sheds * shedH;
            isoCylZ(g, cu, cv, zCrown - 0.02, zCrown + 0.18, 0.16, {
              side: "url(#grad-brass-cap)", top: "#FDE8D2"
            }, { sw: 1.15 });

            isoBox(g, cu - 0.10, cv - 0.06, zCrown + 0.16, cu + 0.10, cv + 0.46, zCrown + 0.66, {
              top: "#FDE8D2", left: "#E69F68", right: "#B85F27"
            }, { sw: 1.2 });

            // Two crisp terminal bolt holes on the flat copper flag
            [0.14, 0.34].forEach(function (hv) {
              const hp = iso(cu - 0.105, cv + hv, zCrown + 0.42);
              el("circle", { cx: hp[0].toFixed(1), cy: hp[1].toFixed(1), r: 2.2, fill: "#334155", stroke: INK, "stroke-width": 0.8 }, g);
            });

            // Subtle AC cyan-gold corona shimmer at LV copper lug
            const cPt = iso(cu, cv + 0.24, zCrown + 0.56);
            const corona = el("circle", {
              cx: cPt[0].toFixed(1), cy: cPt[1].toFixed(1), r: 14,
              fill: "url(#grad-corona-lv)", filter: "url(#corona-blur)", opacity: 0.32
            }, g);
            animCoronaGlows.push({ el: corona, phase: phaseShift, baseOp: 0.26, amp: 0.24, kind: "lv" });
          }
        }

        // 1. Rear-right parallel row of 4 shorter LV ivory-ceramic bushings (drawn first -> further back in +v)
        const lvPositions = [
          [4.35, 3.85, 0],
          [6.35, 3.85, (2 * Math.PI) / 3],
          [8.35, 3.85, (4 * Math.PI) / 3],
          [8.05, 2.38, Math.PI] // neutral/4th LV terminal matching reference staggered quartet
        ];
        lvPositions.forEach(function (pos) {
          drawBushing(pos[0], pos[1], false, pos[2]);
        });

        // 2. Front-left parallel row of 3 tall HV terracotta-brown porcelain bushings
        const hvPositions = [
          [2.05, 1.55, 0],
          [4.85, 1.55, (2 * Math.PI) / 3],
          [7.55, 1.55, (4 * Math.PI) / 3]
        ];
        hvPositions.forEach(function (pos) {
          drawBushing(pos[0], pos[1], true, pos[2]);
        });
      }

      /* =====================================================================
         5. BUILD COMPLETE SCENE & COMPUTE EXACT BOUNDING-BOX FOCUS TARGETS
         ===================================================================== */
      buildHousingBack();
      buildConservator();
      buildRadiatorFins();
      buildLaminatedCore();
      buildLvWinding();
      buildHvWinding();
      buildHousingFront();
      buildBushings();

      const stageEl = document.getElementById("mirvo-stage");
      const viewportEl = document.getElementById("mirvo-viewport");
      const allPartEls = Array.from(document.querySelectorAll(".mirvo-part"));
      const allExplodeWraps = Array.from(document.querySelectorAll(".explode-wrap"));

      /**
       * Computes accurate spotlight center (x, y) and comfortable framing zoom (1.55..1.95)
       * directly from each part's real rendered SVG bounding box.
       */
      function computeFocusTargets() {
        const targets = {
          full: { x: 800, y: 450, zoom: 1.0 }
        };

        const partKeys = ["laminated_core", "hv_winding", "lv_winding", "bushings", "radiator_fins", "conservator"];
        partKeys.forEach(function (key) {
          const g = document.getElementById("part-" + key);
          if (!g) return;
          try {
            const b = g.getBBox();
            if (b.width > 0 && b.height > 0) {
              const cx = b.x + b.width * 0.5;
              const cy = b.y + b.height * 0.5;
              const fitZoom = Math.min((1600 * 0.68) / b.width, (900 * 0.72) / b.height);
              const zoom = Math.max(1.52, Math.min(1.96, fitZoom));
              targets[key] = {
                x: Number(cx.toFixed(1)),
                y: Number(cy.toFixed(1)),
                zoom: Number(zoom.toFixed(2))
              };
            }
          } catch (err) {
            targets[key] = { x: 800, y: 450, zoom: 1.7 };
          }
        });

        // Slight aesthetic framing bias for wide radiator_fins (spans left & right sides)
        if (targets.radiator_fins) {
          targets.radiator_fins.zoom = 1.46;
        }
        return targets;
      }

      const FOCUS_TARGETS = computeFocusTargets();

      /* =====================================================================
         6. SCENE STATE, CAMERA ENGINE, SPOTLIGHT & EXPLODED VIEW CONTROLLER
         ===================================================================== */
      const prefersReducedMotion =
        window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const state = {
        focusedPart: null,
        camera: { x: 800, y: 450, zoom: 1.0 },
        targetExploded: 0,
        currentExploded: 0,
        phase: "auto", // "auto" | "flux" | "convection" | "load" | "idle"
        playing: true,
        autoTour: !prefersReducedMotion,
        stepIndex: 0,
        tourTimer: null,
        simTime: 0
      };

      /**
       * Moves and scales the 16:9 SVG stage smoothly around the requested focal target.
       */
      function applyCamera(target) {
        let cam = FOCUS_TARGETS.full;
        if (typeof target === "string") {
          cam = FOCUS_TARGETS[target] || FOCUS_TARGETS.full;
        } else if (target && typeof target === "object") {
          cam = {
            x: typeof target.x === "number" ? target.x : 800,
            y: typeof target.y === "number" ? target.y : 450,
            zoom: typeof target.zoom === "number" ? Math.max(0.6, Math.min(3.2, target.zoom)) : 1.0
          };
        }

        state.camera = cam;

        if (prefersReducedMotion) {
          stageEl.style.transform = "scale(1) translate(0%, 0%)";
          return;
        }

        const txPct = ((800 - cam.x) / 1600) * 100;
        const tyPct = ((450 - cam.y) / 900) * 100;
        stageEl.style.transform =
          "scale(" +
          cam.zoom.toFixed(3) +
          ") translate(" +
          txPct.toFixed(2) +
          "%, " +
          tyPct.toFixed(2) +
          "%)";
      }

      /**
       * Spotlights ONLY `partId` at 100% clarity while smoothly dimming all others
       * (including both housing-back and housing-front!).
       */
      function applyHighlight(partId) {
        const cleanId =
          partId && partId !== "full" && partId !== "housing" && PART_NAMES_UZ[partId] ? partId : null;
        state.focusedPart = cleanId;

        allPartEls.forEach(function (g) {
          if (!cleanId) {
            g.classList.remove("is-dimmed");
            g.classList.remove("is-focused");
          } else if (g.dataset.part === cleanId) {
            g.classList.remove("is-dimmed");
            g.classList.add("is-focused");
          } else {
            g.classList.remove("is-focused");
            g.classList.add("is-dimmed");
          }
        });
      }

      /**
       * Writes interpolated Exploded View offsets onto inner `.explode-wrap` groups.
       */
      function writeExplodedTransforms(amount) {
        allExplodeWraps.forEach(function (wrap) {
          const key = wrap.dataset.explode;
          const vec = EXPLODE_VECTORS[key] || [0, 0];
          const dx = vec[0] * amount;
          const dy = vec[1] * amount;
          if (Math.abs(dx) < 0.05 && Math.abs(dy) < 0.05) {
            wrap.removeAttribute("transform");
          } else {
            wrap.setAttribute("transform", "translate(" + dx.toFixed(2) + " " + dy.toFixed(2) + ")");
          }
        });
      }

      /* =====================================================================
         7. SEQUENTIAL AUTO-SPOTLIGHT TOUR ENGINE
         ===================================================================== */
      function clearTourTimer() {
        if (state.tourTimer !== null) {
          clearTimeout(state.tourTimer);
          state.tourTimer = null;
        }
      }

      function scheduleNextTourTick() {
        clearTourTimer();
        if (!state.autoTour) return;
        const holdMs = state.stepIndex === 0 ? 2500 : 3500;
        state.tourTimer = setTimeout(function () {
          if (state.autoTour) {
            runTourStep(state.stepIndex + 1);
          }
        }, holdMs);
      }

      function runTourStep(index) {
        clearTourTimer();
        const safeIdx = ((index % TOUR_SEQUENCE.length) + TOUR_SEQUENCE.length) % TOUR_SEQUENCE.length;
        state.stepIndex = safeIdx;
        const key = TOUR_SEQUENCE[safeIdx];

        if (key === "full") {
          applyHighlight(null);
          applyCamera("full");
        } else {
          applyHighlight(key);
          applyCamera(key);
        }

        if (state.autoTour) {
          scheduleNextTourTick();
        }
      }

      function setAutoTour(enabled) {
        state.autoTour = Boolean(enabled);
        clearTourTimer();
        if (state.autoTour) {
          scheduleNextTourTick();
        }
      }

      /* =====================================================================
         8. 60 FPS LIVE PHYSICS SIMULATION LOOP
         ===================================================================== */
      let lastTs = 0;

      function getPhaseMultipliers() {
        switch (state.phase) {
          case "flux":
            return { flux: 1.65, current: 1.25, conv: 0.9, oil: 0.9, steady: false };
          case "convection":
            return { flux: 0.9, current: 0.9, conv: 1.75, oil: 1.65, steady: false };
          case "load":
            return { flux: 1.45, current: 1.75, conv: 1.45, oil: 1.35, steady: false };
          case "idle":
            return { flux: 0.25, current: 0.2, conv: 0.3, oil: 0.3, steady: false };
          case "dc":
          case "steady":
            return { flux: 1.2, current: 1.2, conv: 1.0, oil: 1.0, steady: true };
          case "auto":
          default:
            return { flux: 1.0, current: 1.0, conv: 1.0, oil: 1.0, steady: false };
        }
      }

      function tickPhysics(ts) {
        try {
          if (!lastTs) lastTs = ts;
          const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
          lastTs = ts;

          // Keep Exploded View interpolation buttery-smooth even when simulation is paused
          if (Math.abs(state.targetExploded - state.currentExploded) > 0.0008) {
            if (prefersReducedMotion) {
              state.currentExploded = state.targetExploded;
            } else {
              const alpha = 1 - Math.exp(-dt * 8.4);
              state.currentExploded += (state.targetExploded - state.currentExploded) * alpha;
            }
            writeExplodedTransforms(state.currentExploded);
          } else if (state.currentExploded !== state.targetExploded) {
            state.currentExploded = state.targetExploded;
            writeExplodedTransforms(state.currentExploded);
          }

          if (state.playing) {
            const mult = getPhaseMultipliers();
            const motionScale = prefersReducedMotion ? 0.16 : 1.0;
            state.simTime += dt;
            const t = state.simTime;

            // --- 1) AC MAGNETIC FLUX Φ(t) CIRCULATING IN LAMINATED CORE ---
            for (let i = 0; i < animFluxLoops.length; i++) {
              const fl = animFluxLoops[i];
              // Smooth AC sinusoidal alternation with 120-deg phase shift (or steady mode)
              const acWave = mult.steady ? 1.0 : Math.sin(t * 1.15 + fl.phaseShift);
              const signedVel = mult.steady ? 1.0 : Math.tanh(acWave * 2.4);
              const intensity = mult.steady ? 0.92 : 0.38 + 0.58 * Math.abs(acWave);

              fl.offset -= dt * 54 * signedVel * mult.flux * motionScale;
              fl.mainEl.setAttribute("stroke-dashoffset", fl.offset.toFixed(2));
              fl.innerEl.setAttribute("stroke-dashoffset", (fl.offset * 1.35).toFixed(2));
              fl.mainEl.setAttribute("opacity", intensity.toFixed(2));
              fl.glowEl.setAttribute("opacity", (intensity * 0.34).toFixed(2));
            }

            // Directional traveling magnetic flux chevrons oriented along exact core windows
            for (let i = 0; i < animFluxArrows.length; i++) {
              const fa = animFluxArrows[i];
              const acWave = mult.steady ? 1.0 : Math.sin(t * 1.15 + fa.phaseShift);
              const signedVel = mult.steady ? 1.0 : Math.tanh(acWave * 2.4);
              const intensity = mult.steady ? 0.95 : 0.25 + 0.72 * Math.abs(acWave);

              fa.t = (fa.t + dt * 0.19 * signedVel * mult.flux * motionScale) % 1;
              if (fa.t < 0) fa.t += 1;

              const dist = fa.t * fa.length;
              const p1 = fa.pathEl.getPointAtLength(dist);
              const stepDir = signedVel >= 0 ? 1 : -1;
              const dist2 = (dist + stepDir * 3.0 + fa.length) % fa.length;
              const p2 = fa.pathEl.getPointAtLength(dist2);
              const angDeg = (Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180) / Math.PI;

              fa.el.setAttribute(
                "transform",
                "translate(" + p1.x.toFixed(1) + " " + p1.y.toFixed(1) + ") rotate(" + angDeg.toFixed(1) + ")"
              );
              fa.el.setAttribute("opacity", intensity.toFixed(2));
            }

            // --- 2) ELECTRICAL CURRENT WAVES IN HV & LV COPPER WINDINGS ---
            for (let i = 0; i < animCurrentArcs.length; i++) {
              const ca = animCurrentArcs[i];
              const acWave = mult.steady ? 1.0 : Math.cos(t * 1.65 + ca.phaseShift);
              const dir = mult.steady ? ca.dir : ca.dir * (acWave >= 0 ? 1 : -1);
              ca.offset -= dt * ca.speed * dir * mult.current * motionScale;
              ca.el.setAttribute("stroke-dashoffset", ca.offset.toFixed(2));
              const op = mult.steady ? 0.85 : 0.30 + 0.62 * Math.abs(acWave);
              ca.el.setAttribute("opacity", op.toFixed(2));
            }

            for (let i = 0; i < animCurrentArrows.length; i++) {
              const arr = animCurrentArrows[i];
              const dy = Math.sin(t * 2.8 * mult.current + arr.phase) * arr.amp * arr.dir * motionScale;
              const op = 0.62 + 0.36 * (0.5 + 0.5 * Math.sin(t * 3.4 * mult.current + arr.phase));
              arr.el.setAttribute("transform", "translate(0, " + dy.toFixed(1) + ")");
              arr.el.setAttribute("opacity", op.toFixed(2));
            }

            // --- 3) THERMAL OIL CONVECTION IN RADIATOR FIN BANKS ---
            for (let i = 0; i < animConvectionItems.length; i++) {
              const ci = animConvectionItems[i];
              if (ci.isDash) {
                ci.offset -= dt * ci.speed * ci.dir * mult.conv * motionScale;
                ci.el.setAttribute("stroke-dashoffset", ci.offset.toFixed(2));
              } else {
                // Smooth cyclical glide upward (hot amber) or downward (cool cerulean)
                const cycle = ((t * 0.58 * mult.conv + ci.phase * 0.16) % 1);
                const dy = (cycle - 0.5) * -ci.dir * ci.amp * 2.2 * motionScale;
                const fade = Math.sin(cycle * Math.PI);
                ci.el.setAttribute("transform", "translate(0, " + dy.toFixed(1) + ")");
                ci.el.setAttribute("opacity", (0.52 + 0.48 * fade).toFixed(2));
              }
            }

            // --- 4) CONSERVATOR OIL THERMAL BREATHING & FEED DROPLETS ---
            const oilDeltaZ = Math.sin(t * 0.85 * mult.oil) * 0.095 * motionScale;
            updateConservatorOil(oilDeltaZ);

            for (let i = 0; i < animConservator.droplets.length; i++) {
              const d = animConservator.droplets[i];
              d.t = (d.t + dt * d.speed * mult.oil * motionScale) % 1;
              const p = d.pathEl.getPointAtLength(d.t * d.length);
              const edge = Math.min(1, d.t * 8, (1 - d.t) * 8);
              d.el.setAttribute("cx", p.x.toFixed(1));
              d.el.setAttribute("cy", p.y.toFixed(1));
              d.el.setAttribute("opacity", (0.92 * edge).toFixed(2));
            }

            // --- 5) SUBTLE AC ELECTRIC CORONA SHIMMER ON BUSHING TERMINALS ---
            for (let i = 0; i < animCoronaGlows.length; i++) {
              const cg = animCoronaGlows[i];
              const pulse = Math.abs(Math.sin(t * 2.4 * mult.current + cg.phase));
              const op = cg.baseOp + cg.amp * pulse;
              cg.el.setAttribute("opacity", Math.min(0.92, op).toFixed(2));
            }
          }
        } catch (err) {
          // Keep 60 FPS animation loop resilient
        }
        requestAnimationFrame(tickPhysics);
      }

      /* =====================================================================
         9. USER INTERACTIONS (CLICK-TO-ASK, RESET, EXPLODED VIEW, KEYBOARD)
         ===================================================================== */
      allPartEls.forEach(function (g) {
        const partId = g.dataset.part;
        if (!partId || partId === "housing") return;

        g.addEventListener("click", function (ev) {
          ev.stopPropagation();
          setAutoTour(false);
          const idx = TOUR_SEQUENCE.indexOf(partId);
          if (idx >= 0) state.stepIndex = idx;
          applyHighlight(partId);
          applyCamera(partId);

          // Emit Click-to-Ask event to parent Mirvo AI lesson platform
          try {
            window.parent.postMessage(
              {
                type: "PART_CLICK",
                deviceId: DEVICE_ID,
                partId: partId,
                nameUz: PART_NAMES_UZ[partId] || partId
              },
              "*"
            );
          } catch (e) {
            // Safe standalone fallback
          }
        });
      });

      // Click on blank white canvas or housing resets view and resumes Auto-Spotlight Tour
      viewportEl.addEventListener("click", function (ev) {
        const partEl = ev.target && ev.target.closest ? ev.target.closest(".mirvo-part") : null;
        if (!partEl || partEl.dataset.part === "housing") {
          window.MirvoScene.reset();
        }
      });

      // Double-click anywhere smoothly toggles Exploded View (0 <-> 1)
      viewportEl.addEventListener("dblclick", function (ev) {
        ev.preventDefault();
        window.MirvoScene.setExploded(state.targetExploded > 0.5 ? 0 : 1);
      });

      // Keyboard controls: R / Esc -> Reset, E -> Exploded View, Space -> Play/Pause
      window.addEventListener("keydown", function (ev) {
        const key = ev.key;
        if (key === "r" || key === "R" || key === "Escape") {
          window.MirvoScene.reset();
        } else if (key === "e" || key === "E") {
          window.MirvoScene.setExploded(state.targetExploded > 0.5 ? 0 : 1);
        } else if (key === " ") {
          ev.preventDefault();
          window.MirvoScene.setPlaying(!state.playing);
        }
      });

      /* =====================================================================
         10. MANDATORY MIRVO AI INTEGRATION API (`window.MirvoScene` & `postMessage`)
         ===================================================================== */
      window.MirvoScene = {
        deviceId: DEVICE_ID,
        parts: PART_NAMES_UZ,

        focus: function (target) {
          if (target === null || target === "full") {
            state.stepIndex = 0;
            applyCamera("full");
            return;
          }
          setAutoTour(false);
          if (typeof target === "string") {
            const idx = TOUR_SEQUENCE.indexOf(target);
            if (idx >= 0) state.stepIndex = idx;
          }
          applyCamera(target);
        },

        highlight: function (partId) {
          applyHighlight(partId);
        },

        setStep: function (index) {
          setAutoTour(false);
          const safeIdx = Math.max(0, Math.min(TOUR_SEQUENCE.length - 1, Math.floor(Number(index) || 0)));
          state.stepIndex = safeIdx;
          const key = TOUR_SEQUENCE[safeIdx];

          const phaseMap = {
            full: "auto",
            laminated_core: "flux",
            hv_winding: "load",
            lv_winding: "load",
            bushings: "load",
            radiator_fins: "convection",
            conservator: "convection"
          };

          state.phase = phaseMap[key] || "auto";
          if (key === "full") {
            applyHighlight(null);
            applyCamera("full");
          } else {
            applyHighlight(key);
            applyCamera(key);
          }
        },

        setAutoTour: function (enabled) {
          setAutoTour(enabled);
        },

        setExploded: function (amount) {
          state.targetExploded = Math.max(0, Math.min(1, Number(amount) || 0));
        },

        setPhase: function (mode) {
          const valid = ["auto", "flux", "convection", "load", "idle", "dc", "steady"];
          if (valid.indexOf(mode) !== -1) {
            state.phase = mode;
          }
        },

        setPlaying: function (playing) {
          state.playing = Boolean(playing);
        },

        reset: function () {
          state.targetExploded = 0;
          state.phase = "auto";
          state.playing = true;
          state.stepIndex = 0;
          applyHighlight(null);
          applyCamera("full");
          setAutoTour(!prefersReducedMotion);
        },

        getState: function () {
          return {
            deviceId: DEVICE_ID,
            parts: Object.assign({}, PART_NAMES_UZ),
            tourSequence: TOUR_SEQUENCE.slice(),
            stepIndex: state.stepIndex,
            focusedPart: state.focusedPart,
            exploded: Number(state.targetExploded.toFixed(2)),
            phase: state.phase,
            playing: state.playing,
            autoTour: state.autoTour,
            camera: Object.assign({}, state.camera)
          };
        }
      };

      // Listen for parent Mirvo AI lesson controller commands via postMessage
      window.addEventListener("message", function (ev) {
        try {
          const msg = ev.data;
          if (!msg || typeof msg !== "object" || typeof msg.type !== "string") return;

          switch (msg.type) {
            case "FOCUS":
              window.MirvoScene.focus(msg.target);
              break;
            case "HIGHLIGHT":
              window.MirvoScene.highlight(msg.partId);
              break;
            case "SET_STEP":
              window.MirvoScene.setStep(msg.index);
              break;
            case "SET_AUTO_TOUR":
              window.MirvoScene.setAutoTour(msg.enabled);
              break;
            case "EXPLODE":
              window.MirvoScene.setExploded(msg.amount);
              break;
            case "SET_PHASE":
              window.MirvoScene.setPhase(msg.mode);
              break;
            case "SET_PLAYING":
              window.MirvoScene.setPlaying(msg.playing);
              break;
            case "RESET":
              window.MirvoScene.reset();
              break;
            default:
              break;
          }
        } catch (err) {
          // Safely ignore malformed cross-window payloads
        }
      });

      /* =====================================================================
         11. BOOTSTRAP ON WINDOW LOAD
         ===================================================================== */
      window.onload = function () {
        applyCamera("full");
        applyHighlight(null);
        requestAnimationFrame(tickPhysics);
        if (!prefersReducedMotion) {
          runTourStep(0);
        }
      };
    })();
  </script>
</body>
</html>
