<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atom elektr stansiyasi (VVER reaktori)</title>
  <style>
    /* =========================================================================
       MIRVO AI — STRICT ZERO-UI & PURE #FFFFFF CANVAS FOUNDATION
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body, .mirvo-viewport {
      background: #ffffff;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .mirvo-stage {
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      transform-origin: 50% 50%;
      transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    #mirvo-svg {
      display: block;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: visible;
    }

    /* =========================================================================
       SEQUENTIAL SPOTLIGHT FOCUS / DIMMING TRANSITIONS
       ========================================================================= */
    .mirvo-part {
      cursor: pointer;
      transition:
        opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.48s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mirvo-part.is-dimmed {
      opacity: 0.22;
      filter: blur(1.2px) saturate(0.45);
    }

    .mirvo-part.is-focused {
      opacity: 1;
      filter: drop-shadow(0 6px 16px rgba(2, 132, 199, 0.22));
    }

    /* Crisp dark-slate technical engineering outlines */
    .ink {
      stroke: #222933;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .ink-bold {
      stroke: #222933;
      stroke-width: 2.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .ink-thin {
      stroke: #222933;
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .ink-micro {
      stroke: #222933;
      stroke-width: 1.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    @media (prefers-reduced-motion: reduce) {
      .mirvo-stage {
        transition: none;
      }
      .mirvo-part {
        transition: opacity 0.2s ease;
      }
    }
  </style>
</head>
<body>
  <div class="mirvo-viewport" id="mirvo-viewport">
    <div class="mirvo-stage" id="mirvo-stage">
      <svg
        id="mirvo-svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 1600 900"
        width="100%"
        height="100%"
        preserveAspectRatio="xMidYMid meet"
      >
        <defs>
          <!-- ================= SOFT SHADOWS & THERMAL GLOW FILTERS ================= -->
          <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" />
          </filter>

          <filter id="tight-shadow" x="-15%" y="-15%" width="130%" height="130%">
            <feGaussianBlur stdDeviation="4" />
          </filter>

          <filter id="amber-glow-filter" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="7" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <filter id="cyan-glow-filter" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4.5" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <filter id="steam-soft" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="6.5" />
          </filter>

          <!-- ================= 4-TONE MATTE ENGINEERING GRADIENTS ================= -->
          <!-- Base Plinth -->
          <linearGradient id="plinth-top" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="58%" stop-color="#F8FAFC" />
            <stop offset="100%" stop-color="#EDF2F7" />
          </linearGradient>

          <linearGradient id="plinth-side-l" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E2E8F0" />
            <stop offset="100%" stop-color="#CBD5E1" />
          </linearGradient>

          <linearGradient id="plinth-side-r" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#B8C4D4" />
            <stop offset="100%" stop-color="#94A3B8" />
          </linearGradient>

          <!-- Satin Anodized Steel (Reactor Pressure Vessel & Piping) -->
          <linearGradient id="steel-horiz" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#94A3B8" />
            <stop offset="18%" stop-color="#E2E8F0" />
            <stop offset="34%" stop-color="#F8FAFC" />
            <stop offset="68%" stop-color="#CBD5E1" />
            <stop offset="88%" stop-color="#94A3B8" />
            <stop offset="100%" stop-color="#64748B" />
          </linearGradient>

          <linearGradient id="steel-inner-cavity" x1="0%" y1="0%" x2="100%" y2="0%">

            <stop offset="35%" stop-color="#64748B" />
            <stop offset="62%" stop-color="#94A3B8" />
            <stop offset="100%" stop-color="#475569" />
          </linearGradient>

          <linearGradient id="steel-barrel-inner" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="32%" stop-color="#64748B" />
            <stop offset="65%" stop-color="#8797AC" />
            <stop offset="100%" stop-color="#334155" />
          </linearGradient>

          <linearGradient id="steel-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC" />
            <stop offset="55%" stop-color="#CBD5E1" />
            <stop offset="100%" stop-color="#94A3B8" />
          </linearGradient>

          <linearGradient id="steel-dome" x1="25%" y1="10%" x2="80%" y2="95%">

            <stop offset="42%" stop-color="#CBD5E1" />
            <stop offset="82%" stop-color="#94A3B8" />
            <stop offset="100%" stop-color="#64748B" />
          </linearGradient>

          <linearGradient id="steel-pipe-v" x1="0%" y1="0%" x2="100%" y2="0%">

            <stop offset="28%" stop-color="#CBD5E1" />
            <stop offset="50%" stop-color="#F8FAFC" />
            <stop offset="78%" stop-color="#94A3B8" />

            <stop offset="34%" stop-color="#CBD5E1" />
            <stop offset="72%" stop-color="#94A3B8" />
            <stop offset="100%" stop-color="#475569" />

          <linearGradient id="steel-shaft" x1="0%" y1="0%" x2="100%" y2="0%">

            <stop offset="75%" stop-color="#CBD5E1" />
            <stop offset="100%" stop-color="#475569" />

          <!-- Warm Amber-Orange Primary Coolant & Nuclear Core Glow -->

            <stop offset="48%" stop-color="#D97706" stop-opacity="0.92" />

          </linearGradient>

          <radialGradient id="core-thermal-glow" cx="50%" cy="62%" r="55%">

            <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />

          <linearGradient id="hot-leg-flow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FDE68A" />
            <stop offset="40%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#EA580C" />
          </linearGradient>

          <!-- Warm Brushed Copper & Gold (Fuel Rods & Motor Stator Windings) -->
          <linearGradient id="copper-left" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FDE2C4" />
            <stop offset="40%" stop-color="#E69F68" />
            <stop offset="100%" stop-color="#C26D32" />
          </linearGradient>

          <linearGradient id="copper-right" x1="0%" y1="0%" x2="0%" y2="100%">

            <stop offset="55%" stop-color="#B85F24" />
            <stop offset="100%" stop-color="#7C3F17" />
          </linearGradient>

          <linearGradient id="copper-stator" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE2C4" />
            <stop offset="35%" stop-color="#E69F68" />
            <stop offset="72%" stop-color="#C26D32" />
            <stop offset="100%" stop-color="#7C3F17" />
          </linearGradient>

          <!-- Cobalt-Blue Control Rod Caps & Motor Housing -->
          <linearGradient id="cobalt-cap" x1="0%" y1="0%" x2="100%" y2="0%">

          <linearGradient id="cobalt-motor" x1="0%" y1="0%" x2="0%" y2="100%">

            <stop offset="32%" stop-color="#2563EB" />
            <stop offset="72%" stop-color="#1D4ED8" />
            <stop offset="100%" stop-color="#1E3A8A" />

          <!-- Dark-Slate Graphite Absorber Blades & Pump Pedestal -->
          <linearGradient id="graphite-left" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#64748B" />
            <stop offset="48%" stop-color="#475569" />
            <stop offset="100%" stop-color="#334155" />
          </linearGradient>

          <linearGradient id="graphite-right" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#475569" />
            <stop offset="55%" stop-color="#334155" />
            <stop offset="100%" stop-color="#1E293B" />
          </linearGradient>

          <!-- Ceramic-Ivory Steam Generator Shell -->
          <linearGradient id="ivory-shell" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#E5E1D5" />
            <stop offset="26%" stop-color="#FFFDF8" />
            <stop offset="55%" stop-color="#F7F4EC" />
            <stop offset="84%" stop-color="#E4DFD1" />
            <stop offset="100%" stop-color="#CBC5B6" />
          </linearGradient>

          <linearGradient id="ivory-dome" x1="20%" y1="10%" x2="85%" y2="90%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="45%" stop-color="#FAF7F0" />
            <stop offset="85%" stop-color="#E6E0D2" />
            <stop offset="100%" stop-color="#CBC4B4" />
          </linearGradient>

          <!-- Steam Generator Dual-Zone Thermal Interior -->
          <linearGradient id="sg-chamber-bg" x1="15%" y1="88%" x2="88%" y2="18%">
            <stop offset="0%" stop-color="#EA580C" />
            <stop offset="28%" stop-color="#F59E0B" />

          </linearGradient>

          <linearGradient id="sg-secondary-water" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#0284C7" />
            <stop offset="45%" stop-color="#0EA5E9" />
            <stop offset="78%" stop-color="#38BDF8" />
            <stop offset="100%" stop-color="#E0F2FE" />
          </linearGradient>

          <!-- Vibrant Cyan-Blue Pressurized Coolant -->
          <linearGradient id="cyan-coolant" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E0F2FE" />
            <stop offset="35%" stop-color="#38BDF8" />
            <stop offset="75%" stop-color="#0284C7" />
            <stop offset="100%" stop-color="#0369A1" />
          </linearGradient>

          <linearGradient id="cyan-to-amber" x1="100%" y1="50%" x2="0%" y2="50%">

            <stop offset="48%" stop-color="#7DD3FC" />
            <stop offset="75%" stop-color="#FBBF24" />
            <stop offset="100%" stop-color="#EA580C" />
          </linearGradient>

          <linearGradient id="rotor-steel" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#94A3B8" />
            <stop offset="26%" stop-color="#F8FAFC" />
            <stop offset="52%" stop-color="#CBD5E1" />
            <stop offset="82%" stop-color="#64748B" />
            <stop offset="100%" stop-color="#334155" />
          </linearGradient>

          <!-- ================= PRECISION CLIP PATHS ================= -->
          <!-- Steam generator cutaway cavity clip -->
          <clipPath id="clip-sg-chamber">
            <path d="M 845 216 C 845 170 872 152 900 152 C 928 152 955 170 955 216 L 955 554 C 955 574 934 588 914 584 C 902 582 896 575 884 582 C 864 592 845 578 845 558 Z" />
          </clipPath>

          <!-- Fuel core interior cavity clip -->
          <clipPath id="clip-core-cavity">
            <path d="M 526 420 L 690 420 L 690 662 C 690 688 652 702 608 702 C 564 702 526 688 526 662 Z" />
          </clipPath>

          <!-- Motor rotor sheen clip -->
          <clipPath id="clip-motor-rotor">
            <polygon points="1104,548 1172,509 1190,540 1122,579" />
          </clipPath>
        </defs>

        <!-- Pure #FFFFFF backdrop hit target for click-to-reset -->
        <rect id="bg-reset-target" x="0" y="0" width="1600" height="900" fill="#FFFFFF" />

        <!-- =======================================================================
             LAYER 1 — HOUSING BACK (BASE PLINTH + REAR REACTOR PRESSURE VESSEL)
             ======================================================================= -->
        <g id="part-housing-back" class="mirvo-part" data-part="pressure_vessel">
          <!-- Soft grounded plinth cast shadow -->
          <path
            d="M 830 356 L 1318 600 Q 1344 613 1318 626 L 818 876 Q 795 888 772 876 L 284 632 Q 258 619 284 606 L 784 356 Q 807 344 830 356 Z"
            fill="#94A3B8"
            opacity="0.28"
            filter="url(#soft-shadow)"
            transform="translate(10, 18)"
            pointer-events="none"
          />

          <!-- Clean 30° Isometric Rounded Base Plinth -->
          <!-- Plinth side extrusion (left-front & right-front thickness) -->
          <path
            class="ink"
            d="M 274 608 L 274 628 Q 274 639 288 646 L 774 888 Q 796 899 818 888 L 1306 644 Q 1320 637 1320 626 L 1320 606 Q 1320 617 1306 624 L 818 868 Q 796 879 774 868 L 288 626 Q 274 619 274 608 Z"
            fill="url(#plinth-side-l)"
          />
          <!-- Right-side darker bevel shading on plinth edge -->
          <path
            class="ink-thin"
            d="M 796 873 L 796 893 Q 807 893 818 888 L 1306 644 Q 1320 637 1320 626 L 1320 606 Q 1320 617 1306 624 L 818 868 Q 807 873 796 873 Z"
            fill="url(#plinth-side-r)"
          />
          <!-- Plinth Top Surface -->
          <path
            class="ink"
            d="M 830 342 L 1306 580 Q 1332 593 1306 606 L 818 850 Q 796 861 774 850 L 288 608 Q 262 595 288 582 L 784 342 Q 807 331 830 342 Z"
            fill="url(#plinth-top)"
          />

          <!-- Grounded Contact Shadows on Plinth beneath Equipment -->
          <g pointer-events="none" opacity="0.34" filter="url(#tight-shadow)">
            <!-- Under Reactor Vessel -->
            <ellipse cx="622" cy="744" rx="162" ry="68" fill="#64748B" />
            <!-- Under Steam Generator -->
            <ellipse cx="914" cy="590" rx="84" ry="38" fill="#64748B" />
            <!-- Under Pump & Motor -->
            <polygon points="975,674 1140,702 1264,616 1185,556 1020,618" fill="#64748B" />
            <!-- Under Return Pipe -->
            <path d="M 790 668 Q 852 742 968 688" fill="none" stroke="#64748B" stroke-width="26" stroke-linecap="round" />
          </g>

          <!-- ===== REACTOR PRESSURE VESSEL — REAR SHELL ===== -->
          <!-- Back-right tall vertical standpipe instrumentation nozzle -->
          <g id="vessel-rear-standpipe">
            <rect class="ink" x="712" y="102" width="24" height="82" rx="4" fill="url(#steel-pipe-v)" />
            <ellipse class="ink" cx="724" cy="102" rx="12" ry="6" fill="#E2E8F0" />
            <ellipse class="ink-thin" cx="724" cy="102" rx="6" ry="3" fill="#64748B" />

            d="M 446 254 L 446 694 C 446 756 518 796 608 796 C 698 796 770 756 770 694 L 770 254 Z"

            class="ink"
            d="M 458 232 C 458 158 525 130 608 130 C 691 130 758 158 758 232 Z"
            fill="url(#steel-dome)"
          />

          <!-- Upper Bolted Flange Collar — Rear Half -->
          <path
            class="ink"
            d="M 424 232 C 424 180 506 140 608 140 C 710 140 792 180 792 232 L 792 260 C 792 208 710 168 608 168 C 506 168 424 208 424 260 Z"
            fill="url(#steel-horiz)"
          />
          <!-- Top flat ring of flange (full ellipse back layer) -->
          <ellipse class="ink" cx="608" cy="232" rx="184" ry="90" fill="url(#steel-bevel)" />
          <!-- Inner flange bore edge -->
          <ellipse class="ink" cx="608" cy="232" rx="142" ry="68" fill="#64748B" />

          <!-- Dome Rear Interior Shadowed Wall -->
          <path
            class="ink"
            d="M 474 232 C 474 176 534 150 608 150 C 682 150 742 176 742 232 L 742 365 L 474 365 Z"
            fill="url(#steel-inner-cavity)"
          />

          <!-- Procedural Rear Flange Hex Bolts -->

          <!-- Inner Core Barrel Interior Cavity Wall -->

          <!-- Upper Barrel Guide Rim Ring (Rear) -->
          <path
            class="ink-thin"
            d="M 508 320 C 508 286 552 268 608 268 C 664 268 708 286 708 320 L 694 324 C 694 296 656 280 608 280 C 560 280 522 296 522 324 Z"
            fill="#E2E8F0"
          />

          <!-- Lower Curved Core Support Bowl inside Barrel -->
          <ellipse class="ink" cx="608" cy="662" rx="84" ry="38" fill="#CBD5E1" />
          <ellipse class="ink-thin" cx="608" cy="656" rx="72" ry="31" fill="#94A3B8" />

          <!-- Left-Side Flanged Reactor Outlet Nozzle -->
          <g id="vessel-left-nozzle">
            <path
              class="ink"
              d="M 454 374 L 418 386 C 408 390 408 422 422 430 L 456 418 Z"

            />
            <ellipse
              class="ink"
              cx="419"
              cy="408"
              rx="18"
              ry="31"

            <ellipse

              cy="410"

            <ellipse

        <!-- =======================================================================
             LAYER 2 — PART 2: NUCLEAR FUEL RODS (YOQILG'I STERJENLARI — TVEL)
             ======================================================================= -->
        <g id="part-fuel_rods" class="mirvo-part" data-part="fuel_rods">
          <!-- Glowing Warm Amber-Orange Primary Coolant Bath around Lower Core -->
          <g clip-path="url(#clip-core-cavity)">

            <path

              ry="34"
              fill="#F59E0B"

            />
            <!-- Lower radiant thermal halo under fuel rods -->
            <ellipse
              id="anim-core-glow-back"
              cx="608"
              cy="615"
              rx="82"
              ry="66"
              fill="url(#core-thermal-glow)"

            />

          <!-- Lower Perforated Core Support Grid Plate -->
          <ellipse class="ink" cx="608" cy="648" rx="74" ry="33" fill="#FDE68A" />
          <ellipse class="ink-thin" cx="608" cy="645" rx="68" ry="29" fill="#F59E0B" opacity="0.55" />

          <!-- Isometric Prismatic Hexagonal/Diamond Fuel Rod Bundle (Populated cleanly by JS) -->
          <g id="fuel-bundle-rods"></g>

          <!-- Foreground Radiant Thermal Core Glow Overlay & Micro-Convection Shimmer -->
          <g pointer-events="none" clip-path="url(#clip-core-cavity)">
            <ellipse
              id="anim-core-glow"

      /* =========================================================================
         3. PROCEDURAL PRECISION GEOMETRY BUILDERS
            (Flange Bolts, 37-Rod TVEL Copper Bundle, 7 Control Rod Clusters)
         ========================================================================= */
      function buildVesselFlangeBolts() {
        const backContainer = document.getElementById("vessel-bolts-back");
        const frontContainer = document.getElementById("vessel-bolts-front");
        const cx = 608;
        const cy = 232;
        const rx = 164;
        const ry = 79;
        const count = 22;

        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2;
          const sinA = Math.sin(angle);
          const cosA = Math.cos(angle);

          // Leave cutaway front arc open (approx 52° to 128°)
          if (sinA > 0.72 && Math.abs(cosA) < 0.68) continue;

          const bx = cx + cosA * rx;
          const by = cy + sinA * ry;
          const target = sinA < 0.08 ? backContainer : frontContainer;

          const g = svgEl("g", { transform: `translate(${bx.toFixed(1)}, ${by.toFixed(1)})` });
          g.appendChild(svgEl("ellipse", { cx: 0, cy: 3.5, rx: 7.2, ry: 4.0, fill: "#64748B", class: "ink-micro" }));
          g.appendChild(svgEl("ellipse", { cx: 0, cy: 0, rx: 6.4, ry: 3.5, fill: "#F1F5F9", class: "ink-micro" }));
          g.appendChild(svgEl("circle", { cx: 0, cy: 0, r: 1.8, fill: "#94A3B8" }));
          target.appendChild(g);
        }
      }

      function buildFuelRodBundle() {
        const container = document.getElementById("fuel-bundle-rods");
        const centerX = 608;
        const centerTopY = 474;
        const stepX = 13.4;
        const stepY = 6.8;
        const rodH = 152;
        const halfW = 6.2;
        const halfD = 3.2;

        const coords = [];
        for (let i = -3; i <= 3; i++) {
          for (let j = -3; j <= 3; j++) {
            // Crisp hexagonal/octagonal isometric TVEL core footprint (37 assemblies)
            if (Math.abs(i) + Math.abs(j) <= 4) {
              coords.push({ i, j, depth: i + j });
            }
          }
        }

        // Strict painter's order (back to front)
        coords.sort((a, b) => a.depth - b.depth || a.i - b.i);

        for (const c of coords) {
          const x = centerX + (c.i - c.j) * stepX;
          const y = centerTopY + (c.i + c.j) * stepY;

          const rodG = svgEl("g");

          // Left vertical copper-gold facet
          rodG.appendChild(
            svgEl("polygon", {
              points: `${(x - halfW).toFixed(1)},${y.toFixed(1)} ${x.toFixed(1)},${(y + halfD).toFixed(1)} ${x.toFixed(1)},${(y + halfD + rodH).toFixed(1)} ${(x - halfW).toFixed(1)},${(y + rodH).toFixed(1)}`,
              fill: "url(#copper-left)",
              class: "ink-micro"
            })

          // Right vertical darker copper facet
          rodG.appendChild(
            svgEl("polygon", {
              points: `${x.toFixed(1)},${(y + halfD).toFixed(1)} ${(x + halfW).toFixed(1)},${y.toFixed(1)} ${(x + halfW).toFixed(1)},${(y + rodH).toFixed(1)} ${x.toFixed(1)},${(y + halfD + rodH).toFixed(1)}`,

            })

          // Bright brushed-copper/gold isometric diamond top cap

              points: `${x.toFixed(1)},${(y - halfD).toFixed(1)} ${(x + halfW).toFixed(1)},${y.toFixed(1)} ${x.toFixed(1)},${(y + halfD).toFixed(1)} ${(x - halfW).toFixed(1)},${y.toFixed(1)}`,

              ry: "1.1",

              opacity: "0.7"

          container.appendChild(rodG);
        }

      function buildControlRodCluster() {
        const bladesContainer = document.getElementById("control-rod-blades");

        // 7-rod isometric hexagonal cluster (sorted strictly back-to-front)

          { dx: 25, dy: -11 },
          { dx: 0, dy: 0 },
          { dx: -25, dy: 11 },

          const capY = capBaseY + item.dy;

          const bladeG = svgEl("g");

              points: `${rx.toFixed(1)},${(absorberTopY + 3.8).toFixed(1)} ${(rx + 7.5).toFixed(1)},${absorberTopY.toFixed(1)} ${(rx + 7.5).toFixed(1)},${absorberBotY.toFixed(1)} ${rx.toFixed(1)},${(absorberBotY + 3.8).toFixed(1)}`,

              x: (rx - 5.2).toFixed(1),

              fill: "#94A3B8",

          // --- B. Stationary Cobalt-Blue Top Drive Housing Cap ---

        playing: true,
        phaseMode: "auto", // "auto" | "nominal" | "high_power" | "scram"
        simTime: 0,
        rodInsertion: 0.35, // 0 = fully withdrawn (high power), 1 = fully inserted (scram)
        power: 0.7, // coupled thermal reactivity [0.12 .. 1.0]
        flowPhase: 0,

      /* =========================================================================

      function applyCamera(target) {
        try {

          if (typeof target === "string") {
            cam = CAMERA_TARGETS[target] || CAMERA_TARGETS.full;

            const x = Number.isFinite(target.x) ? target.x : 800;
            const y = Number.isFinite(target.y) ? target.y : 450;
            const zoom = Number.isFinite(target.zoom) ? Math.max(0.5, Math.min(3.5, target.zoom)) : 1.0;
            cam = { x, y, zoom };
          }

          if (prefersReducedMotion && state.autoTourEnabled) {
            stageEl.style.transform = "scale(1) translate(0%, 0%)";
            return;
          }

          const dxPct = ((800 - cam.x) / 1600) * 100;
          const dyPct = ((450 - cam.y) / 900) * 100;
          stageEl.style.transform = `scale(${cam.zoom.toFixed(4)}) translate(${dxPct.toFixed(3)}%, ${dyPct.toFixed(3)}%)`;
        } catch (err) {
          console.error("applyCamera error:", err);
        }
      }

      function applyHighlight(partId) {
        try {
          const validPart = partId && PART_NAMES_UZ[partId] ? partId : null;
          state.focusedPart = validPart;

          for (const el of allPartEls) {
            const dp = el.getAttribute("data-part");
            if (!validPart) {
              el.classList.remove("is-dimmed", "is-focused");
            } else if (dp === validPart) {
              el.classList.remove("is-dimmed");
              el.classList.add("is-focused");
            } else {
              el.classList.remove("is-focused");
              el.classList.add("is-dimmed");
            }
          }
        } catch (err) {
          console.error("applyHighlight error:", err);
        }
      }

      function applyExplodeOffsets(amount) {
        for (const item of explodeTargets) {
          if (!item.el) continue;
          const tx = (item.vec.x * amount).toFixed(2);
          const ty = (item.vec.y * amount).toFixed(2);
          if (amount < 0.0005) {
            item.el.removeAttribute("transform");
          } else {
            item.el.setAttribute("transform", `translate(${tx}, ${ty})`);
          }
        }
      }

      /* =========================================================================
         7. SEQUENTIAL AUTO-SPOTLIGHT TOUR ENGINE
         ========================================================================= */
      function clearTourTimer() {
        if (state.tourTimerId !== null) {
          window.clearTimeout(state.tourTimerId);
          state.tourTimerId = null;
        }
      }

      function scheduleTourTick() {
        clearTourTimer();
        if (!state.autoTourEnabled || prefersReducedMotion) return;

        const currentTarget = TOUR_SEQUENCE[state.tourIndex];
        const waitMs = currentTarget === "full" ? TOUR_DURATION_FULL_MS : TOUR_DURATION_PART_MS;

        state.tourTimerId = window.setTimeout(() => {
          if (!state.autoTourEnabled) return;
          state.tourIndex = (state.tourIndex + 1) % TOUR_SEQUENCE.length;
          const next = TOUR_SEQUENCE[state.tourIndex];
          if (next === "full") {
            applyCamera("full");
            applyHighlight(null);
          } else {
            applyCamera(next);
            applyHighlight(next);
          }
          scheduleTourTick();
        }, waitMs);
      }

      function startAutoTour(fromStart = false) {
        if (prefersReducedMotion) {
          state.autoTourEnabled = false;
          clearTourTimer();
          if (fromStart) {
            applyCamera("full");
            applyHighlight(null);
          }
          return;
        }
        state.autoTourEnabled = true;
        if (fromStart) {
          state.tourIndex = 0;
          applyCamera("full");
          applyHighlight(null);
        }
        scheduleTourTick();
      }

      function stopAutoTour() {
        state.autoTourEnabled = false;
        clearTourTimer();
      }

      /* =========================================================================
         8. 60 FPS COUPLED VVER NUCLEAR THERMAL-HYDRAULIC PHYSICS ENGINE
         ========================================================================= */
      function getTargetRodInsertion(simTime, mode) {
        if (mode === "high_power") return 0.06;
        if (mode === "nominal") return 0.42;
        if (mode === "scram") return 1.0;
        // "auto": smooth 12-second sinusoidal modulation between 0.08 (high) and 0.82 (inserted)
        const wave = 0.5 - 0.5 * Math.cos((simTime / 12.0) * Math.PI * 2);
        return 0.08 + wave * 0.74;
      }

      function updatePhysics(dt) {
        // Always smoothly interpolate Exploded View even when simulation is paused
        const expDiff = state.explodeTarget - state.explodeCurrent;
        if (Math.abs(expDiff) > 0.0005) {
          state.explodeCurrent += expDiff * Math.min(1, dt * 7.2);
          applyExplodeOffsets(state.explodeCurrent);
        } else if (state.explodeCurrent !== state.explodeTarget) {
          state.explodeCurrent = state.explodeTarget;
          applyExplodeOffsets(state.explodeCurrent);
        }

        if (!state.playing) return;

        state.simTime += dt;
        const t = state.simTime;

        // 1. Control Rod Position & Coupled Thermal Power
        const targetInsertion = getTargetRodInsertion(t, state.phaseMode);
        state.rodInsertion += (targetInsertion - state.rodInsertion) * Math.min(1, dt * 3.4);

        // Higher rods (lower insertion) = higher core reactivity/power
        const targetPower = 0.16 + (1.0 - state.rodInsertion) * 0.84;
        state.power += (targetPower - state.power) * Math.min(1, dt * 2.8);
        const p = state.power;

        // Move nested #anim-control-rods cleanly (0..54px downward insertion into fuel rods)
        const rodOffsetY = state.rodInsertion * 54;
        animControlRodsEl.setAttribute("transform", `translate(0, ${rodOffsetY.toFixed(2)})`);

        // 2. Fuel Core Thermal Pulsation & Rising Convection Sparks
        const pulse = 0.5 + 0.5 * Math.sin(t * (3.6 + p * 2.4));
        const glowOpacity = 0.18 + p * 0.56 + pulse * 0.14 * p;
        animCoreGlowEl.setAttribute("opacity", glowOpacity.toFixed(3));
        animCoreGlowBackEl.setAttribute("opacity", (0.35 + p * 0.55).toFixed(3));
        animSgAmberZoneEl.setAttribute("opacity", (0.58 + p * 0.38).toFixed(3));

        const sparkSpeed = 0.24 + p * 0.36;
        for (let i = 0; i < coreSparkPool.length; i++) {
          const sp = coreSparkPool[i];
          const prog = (sp.offset + t * sparkSpeed) % 1;
          const sy = 648 - prog * 195;
          const sx = sp.baseX + Math.sin(t * 3.2 + sp.phase) * sp.swayAmp;
          const alpha = Math.sin(prog * Math.PI) * (0.25 + p * 0.72);
          sp.el.setAttribute("cx", sx.toFixed(1));
          sp.el.setAttribute("cy", sy.toFixed(1));
          sp.el.setAttribute("opacity", alpha.toFixed(2));
        }

        // 3. Coupled Circulation Speed, Impeller & Motor Rotor Spin
        const flowSpeed = 0.24 + p * 0.26;
        state.flowPhase = (state.flowPhase + dt * flowSpeed) % 1000;
        state.steamPhase = (state.steamPhase + dt * (0.22 + p * 0.34)) % 1000;

        // Smooth 60 FPS impeller rotation & volute swirl
        const rpmDegPerSec = 175 + p * 185;
        state.impellerAngle = (state.impellerAngle + dt * rpmDegPerSec) % 360;
        animImpellerEl.setAttribute("transform", `rotate(${state.impellerAngle.toFixed(2)})`);
        animVoluteSwirlEl.setAttribute("transform", `rotate(${(state.impellerAngle * 0.72).toFixed(2)})`);

        // Coaxial motor rotor brushed sheen cycling
        state.rotorShift = (state.rotorShift + dt * (26 + p * 28)) % 18;
        const rDx = state.rotorShift * 0.5;
        const rDy = state.rotorShift * 0.866;
        animRotorEl.setAttribute("transform", `translate(${rDx.toFixed(2)}, ${rDy.toFixed(2)})`);

        // 4. Primary Hot-Leg Flow Particles (Reactor -> Steam Generator Bottom-Left)
        for (let i = 0; i < hotLegPool.length; i++) {
          const item = hotLegPool[i];
          const prog = (item.offset + state.flowPhase * 1.45) % 1;
          const pt = pathHotLeg.getPointAtLength(prog * pathLengths.hotLeg);
          item.el.setAttribute("cx", pt.x.toFixed(1));
          item.el.setAttribute("cy", pt.y.toFixed(1));
          item.el.setAttribute("opacity", (Math.sin(prog * Math.PI) * (0.45 + p * 0.55)).toFixed(2));
        }

        // 5. Steam Generator U-Tube Heat-Transfer Flow Particles (Amber -> Cool Cyan)
        for (let i = 0; i < utubePool.length; i++) {
          const item = utubePool[i];
          const prog = (item.offset + state.flowPhase * 0.82) % 1;
          const len = item.path === pathUtube1 ? pathLengths.utube1 : pathLengths.utube2;
          const pt = item.path.getPointAtLength(prog * len);
          item.el.setAttribute("cx", pt.x.toFixed(1));
          item.el.setAttribute("cy", pt.y.toFixed(1));
          // Transition color smoothly from warm amber on hot side to cyan on cooled side
          item.el.setAttribute("fill", prog < 0.52 ? "#FDE68A" : "#BAE6FD");
          item.el.setAttribute("opacity", (Math.sin(prog * Math.PI) * (0.4 + p * 0.55)).toFixed(2));
        }

        // 6. Steam Generator Secondary Boiling Bubbles & Rising Steam Plumes
        for (let i = 0; i < sgBubblePool.length; i++) {
          const b = sgBubblePool[i];
          const prog = (b.offset + state.steamPhase * b.speed) % 1;
          const by = 556 - prog * 305;
          const bx = b.baseX + Math.sin(t * 4.2 + b.phase) * 4.5;
          const alpha = Math.sin(prog * Math.PI) * (0.35 + p * 0.65);
          b.el.setAttribute("cx", bx.toFixed(1));
          b.el.setAttribute("cy", by.toFixed(1));
          b.el.setAttribute("opacity", alpha.toFixed(2));
        }

        for (let i = 0; i < sgSteamPool.length; i++) {
          const s = sgSteamPool[i];
          const prog = (s.offset + state.steamPhase * 0.62) % 1;
          const sy = 276 - prog * 114;
          const sx = s.baseX + Math.sin(t * 2.1 + s.phase) * 8.5;
          const alpha = Math.sin(prog * Math.PI) * (0.24 + p * 0.44);
          s.el.setAttribute("cx", sx.toFixed(1));
          s.el.setAttribute("cy", sy.toFixed(1));
          s.el.setAttribute("opacity", alpha.toFixed(2));
        }

        // 7. Cold-Leg Suction Flow Particles (Steam Generator Right -> Pump Top)
        for (let i = 0; i < suctionPool.length; i++) {
          const item = suctionPool[i];
          const prog = (item.offset + state.flowPhase * 1.25) % 1;
          const pt = pathSuction.getPointAtLength(prog * pathLengths.suction);
          item.el.setAttribute("cx", pt.x.toFixed(1));
          item.el.setAttribute("cy", pt.y.toFixed(1));
          // Show clearly in the cutaway upper elbow & nozzle section
          const vis = prog < 0.72 ? Math.sin(Math.min(1, prog / 0.72) * Math.PI) : 0;
          item.el.setAttribute("opacity", (vis * 0.92).toFixed(2));
        }

        // 8. Cold-Leg Return Flow Particles (Pump Front Volute -> Reactor Inlet)
        for (let i = 0; i < returnPool.length; i++) {
          const item = returnPool[i];
          const prog = (item.offset + state.flowPhase * 0.92) % 1;
          const pt = pathReturn.getPointAtLength(prog * pathLengths.returnPipe);
          item.el.setAttribute("cx", pt.x.toFixed(1));
          item.el.setAttribute("cy", pt.y.toFixed(1));
          // Visible in cutaway discharge window (0..0.18) and cutaway reactor inlet window (0.87..1.0)
          let vis = 0;
          if (prog < 0.18) {
            vis = Math.sin((prog / 0.18) * Math.PI) * 0.95;
            item.el.setAttribute("fill", "#E0F2FE");
            item.el.setAttribute("stroke", "#0284C7");
          } else if (prog > 0.87) {
            vis = Math.sin(((prog - 0.87) / 0.13) * Math.PI) * 0.95;
            item.el.setAttribute("fill", prog > 0.94 ? "#FEF3C7" : "#BAE6FD");
            item.el.setAttribute("stroke", prog > 0.94 ? "#EA580C" : "#0284C7");
          }
          item.el.setAttribute("opacity", vis.toFixed(2));
        }
      }

      /* =========================================================================
         9. 60 FPS ANIMATION LOOP
         ========================================================================= */
      let lastTime = performance.now();

      function tick(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        updatePhysics(dt);
        window.requestAnimationFrame(tick);
      }

      /* =========================================================================
         10. MIRVO AI PUBLIC API (window.MirvoScene & postMessage BRIDGE)
         ========================================================================= */
      const MirvoScene = {
        deviceId: DEVICE_ID,
        parts: Object.entries(PART_NAMES_UZ).map(([id, nameUz]) => ({ id, nameUz })),

        focus(target) {
          try {
            applyCamera(target === null || target === undefined ? "full" : target);
          } catch (err) {
            console.error("MirvoScene.focus error:", err);
          }
        },

        highlight(partId) {
          try {
            applyHighlight(partId ?? null);
          } catch (err) {
            console.error("MirvoScene.highlight error:", err);
          }
        },

        setStep(index) {
          try {
            const idx = Math.max(0, Math.min(TOUR_SEQUENCE.length - 1, Math.round(Number(index) || 0)));
            stopAutoTour();
            state.tourIndex = idx;
            const target = TOUR_SEQUENCE[idx];
            if (target === "full") {
              applyCamera("full");
              applyHighlight(null);
            } else {
              applyCamera(target);
              applyHighlight(target);
            }
          } catch (err) {
            console.error("MirvoScene.setStep error:", err);
          }
        },

        setAutoTour(enabled) {
          try {
            if (Boolean(enabled)) {
              startAutoTour(false);
            } else {
              stopAutoTour();
            }
          } catch (err) {
            console.error("MirvoScene.setAutoTour error:", err);
          }
        },

        setExploded(amount) {
          try {
            const clamped = Math.max(0, Math.min(1, Number(amount) || 0));
            state.explodeTarget = clamped;
          } catch (err) {
            console.error("MirvoScene.setExploded error:", err);
          }
        },

        setPhase(mode) {
          try {
            if (mode === "auto" || mode === "nominal" || mode === "high_power" || mode === "scram") {
              state.phaseMode = mode;
            }
          } catch (err) {
            console.error("MirvoScene.setPhase error:", err);
          }
        },

        setPlaying(playing) {
          try {
            state.playing = Boolean(playing);
          } catch (err) {
            console.error("MirvoScene.setPlaying error:", err);
          }
        },

        reset() {
          try {
            state.explodeTarget = 0;
            state.phaseMode = "auto";
            state.playing = true;
            startAutoTour(true);
          } catch (err) {
            console.error("MirvoScene.reset error:", err);
          }
        }
      };

      window.MirvoScene = MirvoScene;

      window.addEventListener("message", (event) => {
        try {
          const msg = event && event.data;
          if (!msg || typeof msg !== "object" || typeof msg.type !== "string") return;

          switch (msg.type) {
            case "FOCUS":
              stopAutoTour();
              MirvoScene.focus(msg.target);
              break;
            case "HIGHLIGHT":
              MirvoScene.highlight(msg.partId ?? null);
              break;
            case "SET_STEP":
              MirvoScene.setStep(msg.index);
              break;
            case "SET_AUTO_TOUR":
              MirvoScene.setAutoTour(msg.enabled);
              break;
            case "EXPLODE":
              MirvoScene.setExploded(msg.amount);
              break;
            case "SET_PHASE":
              MirvoScene.setPhase(msg.mode);
              break;
            case "SET_PLAYING":
              MirvoScene.setPlaying(msg.playing);
              break;
            case "RESET":
              MirvoScene.reset();
              break;
            default:
              break;
          }
        } catch (err) {
          console.error("postMessage handler error:", err);
        }
      });

      /* =========================================================================
         11. INTERACTIVE CLICK, DOUBLE-CLICK & KEYBOARD HANDLERS
         ========================================================================= */
      function emitPartClick(partId) {
        const nameUz = PART_NAMES_UZ[partId];
        if (!nameUz) return;
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(
              {
                type: "PART_CLICK",
                deviceId: DEVICE_ID,
                partId,
                nameUz
              },
              "*"
            );
          }
        } catch (err) {
          console.error("PART_CLICK postMessage error:", err);
        }
      }

      svgRoot.addEventListener("click", (e) => {
        const partGroup = e.target.closest(".mirvo-part");
        const partId = partGroup ? partGroup.getAttribute("data-part") : null;

        if (partId && PART_NAMES_UZ[partId]) {
          stopAutoTour();
          const idx = TOUR_SEQUENCE.indexOf(partId);
          if (idx !== -1) state.tourIndex = idx;
          applyCamera(partId);
          applyHighlight(partId);
          emitPartClick(partId);
        } else {
          MirvoScene.reset();
        }
      });

      viewportEl.addEventListener("click", (e) => {
        if (e.target === viewportEl || e.target === stageEl) {
          MirvoScene.reset();
        }
      });

      // Double-click anywhere smoothly toggles Exploded View
      viewportEl.addEventListener("dblclick", (e) => {
        e.preventDefault();
        MirvoScene.setExploded(state.explodeTarget > 0.5 ? 0 : 1);
      });

      // Keyboard shortcuts: R / Escape -> Reset, E -> Exploded View toggle
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" || e.key === "r" || e.key === "R") {
          MirvoScene.reset();
        } else if (e.key === "e" || e.key === "E") {
          MirvoScene.setExploded(state.explodeTarget > 0.5 ? 0 : 1);
        }
      });

      /* =========================================================================
         12. INITIALIZE PROCEDURAL GEOMETRY & START ENGINE ON LOAD
         ========================================================================= */
      window.addEventListener("load", () => {
        try {
          buildVesselFlangeBolts();
          buildFuelRodBundle();
          buildControlRodCluster();
          applyCamera("full");
          applyHighlight(null);
          startAutoTour(true);
          lastTime = performance.now();
          window.requestAnimationFrame(tick);
        } catch (err) {
          console.error("Initialization error:", err);
        }
      });
    })();
  </script>
</body>
