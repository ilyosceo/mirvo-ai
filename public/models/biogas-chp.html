<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Biogaz kogeneratsiya qurilmasi (CHP)</title>
  <style>
    /* =========================================================================
       MIRVO AI — ZERO-UI PURE #FFFFFF VIEWPORT & SEQUENTIAL SPOTLIGHT STYLES
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body, .mirvo-viewport {
      background: #ffffff;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    .mirvo-stage {
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      transform-origin: 50% 50%;
      transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      display: block;
    }

    #biogas-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* Interactive modular anatomy parts */
    .mirvo-part {
      cursor: pointer;
      transition:
        opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, filter, transform;
    }

    .mirvo-housing {
      cursor: default;
    }

    /* Dimmed non-focused assemblies during Spotlight Tour */
    .mirvo-part.is-dimmed {
      opacity: 0.22;
      filter: blur(1.2px) saturate(0.45);
    }

    /* Focused assembly crisp spotlight lift */
    .mirvo-part.is-focused {
      opacity: 1;
      filter: drop-shadow(0 6px 16px rgba(2, 132, 199, 0.22));
    }

    /* Technical outline baseline */
    .ink {
      stroke: #222933;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    /* Respect accessibility reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      .mirvo-stage,
      .mirvo-part {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- Pure #FFFFFF canvas container with strictly ZERO UI chrome -->
  <div id="mirvo-viewport" class="mirvo-viewport">
    <div id="mirvo-stage" class="mirvo-stage">
      <svg
        id="biogas-svg"
        viewBox="0 0 1600 900"
        width="100%"
        height="100%"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="Anaerobic Biogas Digester and CHP Cogeneration Unit Cutaway"
      >
        <defs>
          <!-- ===============================================================
               SOFT SHADOWS & LUMINOUS ENERGY FILTERS
               =============================================================== -->
          <filter id="plinth-shadow" x="-18%" y="-25%" width="136%" height="160%">
            <feGaussianBlur stdDeviation="16" />
          </filter>

          <filter id="thermal-aura" x="-45%" y="-45%" width="190%" height="190%">
            <feGaussianBlur stdDeviation="24" />
          </filter>

          <filter id="combustion-blur" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="8.5" />
          </filter>

          <filter id="energy-glow" x="-45%" y="-45%" width="190%" height="190%">
            <feGaussianBlur stdDeviation="3.6" result="blur" />
            <feMerge>
              <feMergeNode in="blur" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <!-- ===============================================================
               HARMONIC 4-TONE ENGINEERING GRADIENTS
               =============================================================== -->
          <!-- Sleek light-ivory / cool-slate base plinth -->
          <linearGradient id="grad-plinth-top" x1="5%" y1="0%" x2="95%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="55%" stop-color="#F1F5F9" />
            <stop offset="100%" stop-color="#E2E8F0" />
          </linearGradient>

          <!-- Digester satin ivory-white 4-tone cylindrical shell -->
          <linearGradient id="grad-digester-shell" x1="0%" y1="15%" x2="100%" y2="35%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="32%" stop-color="#F8FAFC" />
            <stop offset="72%" stop-color="#DCE4EE" />
            <stop offset="100%" stop-color="#B0BECE" />
          </linearGradient>

          <!-- Digester steel reinforcing band -->
          <linearGradient id="grad-steel-band" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F8FAFC" />
            <stop offset="38%" stop-color="#CBD5E1" />
            <stop offset="78%" stop-color="#94A3B8" />
            <stop offset="100%" stop-color="#64748B" />
          </linearGradient>

          <!-- Digester warm amber-gold top cap -->
          <linearGradient id="grad-gold-cap" x1="15%" y1="10%" x2="85%" y2="90%">
            <stop offset="0%" stop-color="#FEF3C7" />
            <stop offset="40%" stop-color="#FBBF24" />
            <stop offset="80%" stop-color="#E59836" />
            <stop offset="100%" stop-color="#B46214" />
          </linearGradient>

          <!-- Digester warm interior headspace dome -->
          <radialGradient id="grad-dome-interior" cx="50%" cy="22%" r="72%">
            <stop offset="0%" stop-color="#FDE8B4" />
            <stop offset="48%" stop-color="#E1B87D" />
            <stop offset="82%" stop-color="#B0814E" />
            <stop offset="100%" stop-color="#7B5530" />
          </radialGradient>

          <!-- Organic biomass slurry depth shading -->
          <linearGradient id="grad-biomass-body" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#6B4C35" />
            <stop offset="38%" stop-color="#523A28" />
            <stop offset="78%" stop-color="#3E2B1E" />
            <stop offset="100%" stop-color="#2D1F15" />
          </linearGradient>

          <radialGradient id="grad-biomass-top" cx="48%" cy="45%" r="58%">
            <stop offset="0%" stop-color="#7B5C43" />
            <stop offset="60%" stop-color="#5E4431" />
            <stop offset="100%" stop-color="#443022" />
          </radialGradient>

          <!-- Methane glossy amber bubble gradient -->
          <radialGradient id="grad-methane-bubble" cx="34%" cy="30%" r="68%">
            <stop offset="0%" stop-color="#FFFBEB" />
            <stop offset="32%" stop-color="#FDE08D" />
            <stop offset="72%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#B45309" />
          </radialGradient>

          <!-- Gas scrubber cerulean/cobalt-blue cylinder -->
          <linearGradient id="grad-scrubber-blue" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6EC6F5" />
            <stop offset="28%" stop-color="#2E96D8" />
            <stop offset="70%" stop-color="#176FA8" />
            <stop offset="100%" stop-color="#0E4A75" />
          </linearGradient>

          <!-- Scrubber ice-blue viewing cavity -->
          <linearGradient id="grad-scrubber-cavity" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0D4B78" />
            <stop offset="26%" stop-color="#7DD3FC" />
            <stop offset="65%" stop-color="#BAE6FD" />
            <stop offset="100%" stop-color="#38BDF8" />
          </linearGradient>

          <!-- Overhead pipe cyan-to-warm-copper thermal gradient -->
          <linearGradient id="grad-top-conduit" x1="0%" y1="0%" x2="100%" y2="30%">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="36%" stop-color="#2FA6D6" />
            <stop offset="68%" stop-color="#A89A82" />
            <stop offset="100%" stop-color="#E69F68" />
          </linearGradient>

          <!-- Brushed copper 4-tone shading (heat exchanger, coils, rotor windings) -->
          <linearGradient id="grad-copper-fin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE2C4" />
            <stop offset="38%" stop-color="#E8A26B" />
            <stop offset="75%" stop-color="#C26D32" />
            <stop offset="100%" stop-color="#87451A" />
          </linearGradient>

          <linearGradient id="grad-copper-tube" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FDE8D2" />
            <stop offset="42%" stop-color="#E69F68" />
            <stop offset="78%" stop-color="#B85F27" />
            <stop offset="100%" stop-color="#7C3F17" />
          </linearGradient>

          <!-- Warm orange thermal halo behind heat exchanger -->
          <radialGradient id="grad-heat-aura" cx="50%" cy="50%" r="54%">
            <stop offset="0%" stop-color="#FB923C" stop-opacity="0.62" />
            <stop offset="48%" stop-color="#F59E0B" stop-opacity="0.32" />
            <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
          </radialGradient>

          <!-- Engine satin steel 4-tone block -->
          <linearGradient id="grad-engine-block" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F8FAFC" />
            <stop offset="45%" stop-color="#CBD5E1" />
            <stop offset="82%" stop-color="#94A3B8" />
            <stop offset="100%" stop-color="#64748B" />
          </linearGradient>

          <linearGradient id="grad-engine-sump" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#E2E8F0" />
            <stop offset="55%" stop-color="#B8C4D4" />
            <stop offset="100%" stop-color="#8494A7" />
          </linearGradient>

          <!-- Warm bronze-tinted cylinder bore liner -->
          <linearGradient id="grad-bore-liner" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8C522B" />
            <stop offset="32%" stop-color="#D99862" />
            <stop offset="68%" stop-color="#C47C46" />
            <stop offset="100%" stop-color="#6B3B1B" />
          </linearGradient>

          <!-- Machined metallic piston body -->
          <linearGradient id="grad-piston-body" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#94A3B8" />
            <stop offset="30%" stop-color="#F8FAFC" />
            <stop offset="62%" stop-color="#CBD5E1" />
            <stop offset="100%" stop-color="#64748B" />
          </linearGradient>

          <!-- Radiant combustion chamber flame -->
          <radialGradient id="grad-combustion-flame" cx="50%" cy="62%" r="58%">
            <stop offset="0%" stop-color="#FFFBEB" stop-opacity="1" />
            <stop offset="35%" stop-color="#FDE047" stop-opacity="0.96" />
            <stop offset="68%" stop-color="#F97316" stop-opacity="0.82" />
            <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
          </radialGradient>

          <!-- Alternator cobalt/cerulean ribbed housing -->
          <linearGradient id="grad-alt-blue" x1="15%" y1="0%" x2="85%" y2="100%">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="38%" stop-color="#0284C7" />
            <stop offset="76%" stop-color="#0369A1" />
            <stop offset="100%" stop-color="#0C4A6E" />
          </linearGradient>

          <!-- Alternator rotating copper rotor cylinder -->
          <linearGradient id="grad-rotor-copper" x1="25%" y1="0%" x2="75%" y2="100%">
            <stop offset="0%" stop-color="#FDE2C4" />
            <stop offset="34%" stop-color="#E69F68" />
            <stop offset="72%" stop-color="#C26D32" />
            <stop offset="100%" stop-color="#7C3F17" />
          </linearGradient>

          <!-- Emerald-green electrical energy aura -->
          <radialGradient id="grad-elec-aura" cx="50%" cy="50%" r="52%">
            <stop offset="0%" stop-color="#34D399" stop-opacity="0.72" />
            <stop offset="55%" stop-color="#10B981" stop-opacity="0.28" />
            <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
          </radialGradient>

          <!-- Cross-hatch pattern for desulfurization mesh filter beds -->
          <pattern id="pat-scrubber-mesh" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="8" height="8" fill="#CBD5E1" />
            <path d="M 0 0 L 0 8 M 0 0 L 8 0" stroke="#475569" stroke-width="1.35" />
          </pattern>

          <!-- Clip paths for digester interior and scrubber chambers -->
          <clipPath id="clip-digester-window">
            <path d="M 264 510 L 264 316 C 264 218 326 154 402 154 C 478 154 540 218 540 316 L 540 510 Q 402 554 264 510 Z" />
          </clipPath>

          <clipPath id="clip-scrubber-upper">
            <path d="M 672 204 C 672 190 732 190 732 204 L 732 288 Q 702 304 672 288 Z" />
          </clipPath>

          <clipPath id="clip-scrubber-lower">
            <path d="M 672 342 C 672 328 732 328 732 342 L 732 430 Q 702 446 672 430 Z" />
          </clipPath>
        </defs>

        <!-- =================================================================
             EXACT PAINTER'S-ORDER MODULAR LAYER STACK (BACK -> FRONT)
             Each `.mirvo-part` wraps an inner `.explode-wrap` so CSS spotlight
             opacity/filter transitions never conflict with Exploded View offsets.
             ================================================================= -->

        <!-- 1. HOUSING BACK: Grounded shadow, sleek contoured plinth & mounting pads -->
        <g id="part-housing-back" class="mirvo-part mirvo-housing" data-part="housing">
          <g class="explode-wrap" data-explode="housing_back"></g>
        </g>

        <!-- 2. DIGESTER DOME: Anaerobic fermenter, biomass slurry & rising methane bubbles -->
        <g id="part-digester_dome" class="mirvo-part" data-part="digester_dome">
          <g class="explode-wrap" data-explode="digester_dome"></g>
        </g>

        <!-- 3. HEAT RECOVERY: Back-right elevated copper fin stack, coiled tubes & top conduit -->
        <g id="part-heat_recovery" class="mirvo-part" data-part="heat_recovery">
          <g class="explode-wrap" data-explode="heat_recovery"></g>
        </g>

        <!-- 4. GAS SCRUBBER: Cerulean desulfurization tower, mesh beds, droplets & gas pipe -->
        <g id="part-gas_scrubber" class="mirvo-part" data-part="gas_scrubber">
          <g class="explode-wrap" data-explode="gas_scrubber"></g>
        </g>

        <!-- 5. PISTON ENGINE: 4-cylinder inline CHP gas engine with true crank-slider kinematics -->
        <g id="part-piston_engine" class="mirvo-part" data-part="piston_engine">
          <g class="explode-wrap" data-explode="piston_engine"></g>
        </g>

        <!-- 6. ALTERNATOR: Ribbed cobalt synchronous generator, copper rotor & emerald output -->
        <g id="part-alternator" class="mirvo-part" data-part="alternator">
          <g class="explode-wrap" data-explode="alternator"></g>
        </g>

        <!-- 7. HOUSING FRONT: Foreground beveled plinth highlight & anchor bolts -->
        <g id="part-housing-front" class="mirvo-part mirvo-housing" data-part="housing">
          <g class="explode-wrap" data-explode="housing_front"></g>
        </g>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      /* =====================================================================
         1. DEVICE METADATA, PART NAMES & CONFIGURATION
         ===================================================================== */
      const DEVICE_ID = "biogas_cogen_unit";
      const SVG_NS = "http://www.w3.org/2000/svg";
      const INK = "#222933";

      const PART_NAMES_UZ = {
        digester_dome: "Anaerob biogaz fermentatori (gumbazli reaktor)",
        gas_scrubber: "Gaz tozalash (skrubber) va oltingugurtdan ajratish filtri",
        piston_engine: "Porshenli gaz-ichki yonuv dvigateli",
        heat_recovery: "Issiqlikni utilizatsiya qilish (kogeneratsiya) almashinuvchisi",
        alternator: "Sinxron elektr generatori (alternator)"
      };

      const TOUR_SEQUENCE = [
        "full",
        "digester_dome",
        "gas_scrubber",
        "piston_engine",
        "heat_recovery",
        "alternator"
      ];

      // Clean isometric displacement vectors for Exploded View (scaled by 0..1)
      const EXPLODE_VECTORS = {
        housing_back: [0, 34],
        housing_front: [0, 34],
        digester_dome: [-86, -24],
        gas_scrubber: [-12, -74],
        piston_engine: [12, 46],
        heat_recovery: [62, -78],
        alternator: [88, 34]
      };

      // Calibrated hero focus targets inside the 1600x900 viewBox (never clips off-screen)
      const FOCUS_TARGETS = {
        full: { x: 800, y: 450, zoom: 1.0 },
        digester_dome: { x: 405, y: 342, zoom: 1.56 },
        gas_scrubber: { x: 726, y: 342, zoom: 1.54 },
        piston_engine: { x: 982, y: 486, zoom: 1.72 },
        heat_recovery: { x: 1128, y: 266, zoom: 1.88 },
        alternator: { x: 1284, y: 634, zoom: 2.02 }
      };

      /* =====================================================================
         2. SVG DOM HELPER UTILITIES
         ===================================================================== */
      function el(tag, attrs, parent) {
        const node = document.createElementNS(SVG_NS, tag);
        if (attrs) {
          for (const k in attrs) {
            if (Object.prototype.hasOwnProperty.call(attrs, k) && attrs[k] !== undefined && attrs[k] !== null) {
              node.setAttribute(k, String(attrs[k]));
            }
          }
        }
        if (parent) parent.appendChild(node);
        return node;
      }

      /**
       * Renders a clean multi-tone shaded cylindrical pipe along any SVG path string `d`.
       */
      function drawShadedPipe(parent, d, width, colors) {
        const g = el("g", null, parent);
        // Dark-slate outline
        el("path", {
          d: d,
          fill: "none",
          stroke: INK,
          "stroke-width": width + 3.6,
          "stroke-linecap": "round",
          "stroke-linejoin": "round"
        }, g);
        // Outer shadow body
        el("path", {
          d: d,
          fill: "none",
          stroke: colors.dark,
          "stroke-width": width,
          "stroke-linecap": "round",
          "stroke-linejoin": "round"
        }, g);
        // Mid primary tone shifted subtly toward top-left light source
        el("path", {
          d: d,
          fill: "none",
          stroke: colors.mid,
          "stroke-width": width * 0.72,
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
          transform: "translate(-1.2, -1.2)"
        }, g);
        // Crisp specular highlight streak
        el("path", {
          d: d,
          fill: "none",
          stroke: colors.light,
          "stroke-width": width * 0.24,
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
          opacity: 0.85,
          transform: "translate(-2.2, -2.2)"
        }, g);
        return g;
      }

      /**
       * Draws a circular isometric bolted flange collar centered at (cx, cy).
       */
      function drawHorizontalFlange(parent, cx, cy, rx, ry, thickness, boltCount) {
        const g = el("g", null, parent);
        // Bottom cylindrical rim of flange
        el("path", {
          d:
            "M " + (cx - rx) + " " + cy +
            " L " + (cx - rx) + " " + (cy + thickness) +
            " A " + rx + " " + ry + " 0 0 0 " + (cx + rx) + " " + (cy + thickness) +
            " L " + (cx + rx) + " " + cy + " Z",
          fill: "url(#grad-steel-band)",
          stroke: INK,
          "stroke-width": 1.9,
          "stroke-linejoin": "round"
        }, g);
        // Top beveled face of flange
        el("ellipse", {
          cx: cx,
          cy: cy,
          rx: rx,
          ry: ry,
          fill: "#E2E8F0",
          stroke: INK,
          "stroke-width": 1.9
        }, g);
        // Subtle inner machined recess ring
        el("ellipse", {
          cx: cx,
          cy: cy,
          rx: rx * 0.82,
          ry: ry * 0.80,
          fill: "none",
          stroke: "#94A3B8",
          "stroke-width": 1.2
        }, g);
        // Flange bolts around perimeter
        const n = boltCount || 8;
        for (let i = 0; i < n; i++) {
          const a = (i / n) * Math.PI * 2 + 0.15;
          const bx = cx + Math.cos(a) * rx * 0.89;
          const by = cy + Math.sin(a) * ry * 0.86;
          el("circle", {
            cx: bx.toFixed(1),
            cy: by.toFixed(1),
            r: 2.3,
            fill: "#475569",
            stroke: INK,
            "stroke-width": 0.9
          }, g);
        }
        return g;
      }

      /* =====================================================================
         3. LIVE 60 FPS PHYSICS ANIMATION REGISTRIES
         ===================================================================== */
      const animBubbles = [];        // Rising golden methane bubbles + wavy tails
      const animDroplets = [];       // Falling cyan scrubber water droplets
      const animFlowStreams = [];    // Animated glowing flow dashes along pipes
      const animChevrons = [];       // Oriented directional chevrons along pipes
      const animThermalAuras = [];   // Pulsing warm thermal aura & fin heat glows
      const animRotorBands = [];     // Rotating copper winding stripes on alternator rotor
      const animElecPulses = [];     // Emerald electrical energy streaks on alternator terminals
      const engineCylinders = [];    // 4-cylinder crank-slider SVG node references
      let animEndRingSpokes = null;  // Rotating emerald end-ring on alternator shaft
      let animOutputShaftMarks = null; // Rotating shaft groove lines between engine & alternator

      /**
       * Registers an animated fluid streamline + directional chevrons along `pathD`.
       */
      function registerPipeFlow(parent, pathD, opts) {
        const o = opts || {};
        const dash = el("path", {
          d: pathD,
          fill: "none",
          stroke: o.dashColor || "#A7F3D0",
          "stroke-width": o.dashWidth || 3.4,
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
          "stroke-dasharray": o.dashArray || "12 24",
          opacity: o.opacity !== undefined ? o.opacity : 0.9,
          filter: "url(#energy-glow)"
        }, parent);

        animFlowStreams.push({
          el: dash,
          speed: o.speed || 46,
          dir: o.dir || 1,
          offset: Math.random() * 36,
          channel: o.channel || "gas"
        });

        const arrowCount = o.arrows || 0;
        if (arrowCount > 0) {
          const totalLen = dash.getTotalLength();
          const sz = o.arrowSize || 6.2;
          for (let i = 0; i < arrowCount; i++) {
            const chev = el("path", {
              d:
                "M " + (-sz * 0.9).toFixed(1) + " " + (-sz * 0.72).toFixed(1) +
                " L " + (sz * 0.6).toFixed(1) + " 0 L " +
                (-sz * 0.9).toFixed(1) + " " + (sz * 0.72).toFixed(1),
              fill: "none",
              stroke: o.arrowColor || "#5EEAD4",
              "stroke-width": o.arrowStroke || 2.5,
              "stroke-linecap": "round",
              "stroke-linejoin": "round",
              filter: "url(#energy-glow)"
            }, parent);
            animChevrons.push({
              el: chev,
              pathEl: dash,
              length: totalLen,
              t: (i + 0.35) / arrowCount,
              speed: (o.arrowSpeed || 0.28) * (o.dir || 1),
              channel: o.channel || "gas"
            });
          }
        }
      }

      /* =====================================================================
         4. LAYER WRAPPER REFERENCES
         ===================================================================== */
      const wHousingBack = document.querySelector('[data-explode="housing_back"]');
      const wDigester = document.querySelector('[data-explode="digester_dome"]');
      const wHeatRec = document.querySelector('[data-explode="heat_recovery"]');
      const wScrubber = document.querySelector('[data-explode="gas_scrubber"]');
      const wEngine = document.querySelector('[data-explode="piston_engine"]');
      const wAlternator = document.querySelector('[data-explode="alternator"]');
      const wHousingFront = document.querySelector('[data-explode="housing_front"]');

      /* =====================================================================
         5.1. HOUSING BACK: Soft Grounded Shadow, Elongated Contoured Plinth
         ===================================================================== */

            "M 1118 648 L 1252 698 Q 1278 706 1296 694 L 1344 654 L 1344 690 " +
            "L 1276 742 Q 1256 756 1228 746 L 1134 712 Q 1118 704 1118 684 Z",
          fill: "url(#grad-alt-blue)",
          stroke: INK,
          "stroke-width": 2.2,
          "stroke-linejoin": "round"
        }, wAlternator);
        // Clean beveled cutaway rim along front blue shell
        el("path", {
          d: "M 1118 648 L 1252 698 Q 1278 706 1296 694",
          fill: "none", stroke: "#BAE6FD", "stroke-width": 2.2, opacity: 0.78
        }, wAlternator);

        // --- G) RIGHT END-BELL SHAFT HUB & ROTATING EMERALD-GREEN COLLAR RING ---
        // Rear cobalt ribbed end-bell flange visible around shaft
        el("ellipse", {
          cx: 1342, cy: 644, rx: 22, ry: 38,
          transform: "rotate(-16 1342 644)",
          fill: "#0369A1", stroke: INK, "stroke-width": 2.0
        }, wAlternator);

        // Steel shaft protruding out through right end-bell
        el("path", {
          d: "M 1284 646 L 1352 670 L 1344 692 L 1276 668 Z",
          fill: "url(#grad-piston-body)", stroke: INK, "stroke-width": 2.0, "stroke-linejoin": "round"
        }, wAlternator);

        // Prominent emerald-green rotating end-bell collar ring (matching reference!)
        el("ellipse", {
          cx: 1358, cy: 682, rx: 16, ry: 26,
          transform: "rotate(-16 1358 682)",
          fill: "#059669", stroke: INK, "stroke-width": 2.1
        }, wAlternator);
        el("ellipse", {
          cx: 1364, cy: 684, rx: 14, ry: 23,
          transform: "rotate(-16 1364 684)",
          fill: "#34D399", stroke: INK, "stroke-width": 1.9
        }, wAlternator);

        // Animated rotating spokes inside emerald shaft end hub
        animEndRingSpokes = el("g", { transform: "translate(1364, 684)" }, wAlternator);
        for (let k = 0; k < 3; k++) {
          const a = (k * 120 * Math.PI) / 180;
          el("line", {
            x1: 0, y1: 0,
            x2: (Math.cos(a) * 9).toFixed(1),
            y2: (Math.sin(a) * 14).toFixed(1),
            stroke: "#064E3B", "stroke-width": 2.2, "stroke-linecap": "round"
          }, animEndRingSpokes);
        }
        el("ellipse", {
          cx: 0, cy: 0, rx: 5.5, ry: 8.5,
          transform: "rotate(-16)",
          fill: "#A7F3D0", stroke: INK, "stroke-width": 1.5
        }, animEndRingSpokes);
      }

      /* =====================================================================
         5.7. HOUSING FRONT: Subtle Foreground Plinth Highlight & Anchor Bolts
         ===================================================================== */
      function buildHousingFront() {
        // Crisp specular bevel edge highlight running along foreground rim of plinth
        el("path", {
          d:
            "M 76 524 L 388 618 Q 412 624 428 612 Q 446 598 476 608 " +
            "L 1204 818 Q 1236 826 1262 810 L 1460 677",
          fill: "none",
          stroke: "#FFFFFF",
          "stroke-width": 1.8,
          opacity: 0.85,
          "stroke-linecap": "round"
        }, wHousingFront);

        // Foreground corner anchor fasteners on base plinth
        const plinthBolts = [
          [94, 514], [1226, 804], [1442, 666]
        ];
        plinthBolts.forEach(function (pt) {
          el("ellipse", {
            cx: pt[0], cy: pt[1], rx: 5.2, ry: 2.6,
            fill: "#CBD5E1", stroke: INK, "stroke-width": 1.2
          }, wHousingFront);
        });
      }

      /* =====================================================================
         6. ENGINE CRANK-SLIDER & ROTOR KINEMATICS UPDATER (60 FPS)
         ===================================================================== */
      /**
       * Updates all 4 pistons, connecting rods, crank webs, combustion flashes,
       * output shaft, and synchronized alternator copper rotor bands for angle `theta`.
       */
      function updateEngineAndAlternator(theta, combBoost) {
        const R = 18.5; // crank throw radius
        const L = 68.0; // connecting rod length

        for (let i = 0; i < engineCylinders.length; i++) {
          const c = engineCylinders[i];
          const a = theta + c.crankPhase;

          // Isometric crank journal coordinates rotating around main crankshaft centerline
          const jx = c.cx + Math.sin(a) * R * 0.56;
          const jy = c.crankY - Math.cos(a) * R;

          // Exact crank-slider wrist-pin vertical coordinate along cylinder axis
          const dx = jx - c.cx;
          const rodVert = Math.sqrt(Math.max(100, L * L - dx * dx));
          const wristY = jy - rodVert;
          const crownY = wristY - 29;

          // Position piston assembly
          c.pistonG.setAttribute(
            "transform",
            "translate(" + c.cx.toFixed(1) + ", " + crownY.toFixed(1) + ")"
          );

          // Position articulated connecting rod from wrist pin to crank journal
          const wx = c.cx.toFixed(1);
          const wy = wristY.toFixed(1);
          const jxS = jx.toFixed(1);
          const jyS = jy.toFixed(1);

          c.rodOuter.setAttribute("x1", wx);
          c.rodOuter.setAttribute("y1", wy);
          c.rodOuter.setAttribute("x2", jxS);
          c.rodOuter.setAttribute("y2", jyS);

          c.rodInner.setAttribute("x1", wx);
          c.rodInner.setAttribute("y1", wy);
          c.rodInner.setAttribute("x2", jxS);
          c.rodInner.setAttribute("y2", jyS);

          c.rodFlute.setAttribute("x1", wx);
          c.rodFlute.setAttribute("y1", wy);
          c.rodFlute.setAttribute("x2", jxS);
          c.rodFlute.setAttribute("y2", jyS);

          // Position crank journal pin
          c.journal.setAttribute("cx", jxS);
          c.journal.setAttribute("cy", jyS);

          // Sculpted rotating crank counterweight web opposite the crank journal
          const ox = c.cx - Math.sin(a) * R * 0.68;
          const oy = c.crankY + Math.cos(a) * R * 1.12;
          const perpX = Math.cos(a) * 10.5;
          const perpY = Math.sin(a) * 6.5;
          c.web.setAttribute(
            "d",
            "M " + (jx - perpX * 0.7).toFixed(1) + " " + (jy - perpY * 0.7).toFixed(1) +
            " L " + (ox - perpX * 1.15).toFixed(1) + " " + (oy - perpY * 1.15).toFixed(1) +
            " Q " + ox.toFixed(1) + " " + (oy + 5).toFixed(1) + " " +
            (ox + perpX * 1.15).toFixed(1) + " " + (oy + perpY * 1.15).toFixed(1) +
            " L " + (jx + perpX * 0.7).toFixed(1) + " " + (jy + perpY * 0.7).toFixed(1) + " Z"
          );

          // 4-stroke combustion flash (720 deg = 4*PI full cycle, firing order 1-3-4-2)
          let cyc = (theta + c.cycleOffset) % (Math.PI * 4);
          if (cyc < 0) cyc += Math.PI * 4;

          let flashIntensity = 0;
          if (cyc >= 0 && cyc < 1.35) {
            // Sharp ignition peak just past TDC followed by smooth expansion decay
            const u = cyc / 1.35;
            flashIntensity = Math.pow(Math.sin(u * Math.PI), 0.75) * Math.exp(-u * 1.15);
            flashIntensity = Math.min(1, flashIntensity * 1.45 * combBoost);
          }

          const chamberMidY = (c.topY + crownY) * 0.5;
          const chamberH = Math.max(14, (crownY - c.topY) * 0.55);

          c.combGlow.setAttribute("cy", chamberMidY.toFixed(1));
          c.combGlow.setAttribute("ry", (chamberH + 14).toFixed(1));
          c.combGlow.setAttribute("opacity", flashIntensity.toFixed(3));

          c.combCore.setAttribute("cy", (c.topY + chamberH * 0.72).toFixed(1));
          c.combCore.setAttribute("ry", Math.max(8, chamberH * 0.62).toFixed(1));
          c.combCore.setAttribute("opacity", (flashIntensity * 0.92).toFixed(3));
        }

        // Synchronize output shaft groove oscillation
        if (animOutputShaftMarks) {
          const shift = Math.sin(theta) * 6.5;
          animOutputShaftMarks.setAttribute("y1", (616 + shift).toFixed(1));
          animOutputShaftMarks.setAttribute("y2", (630 + shift).toFixed(1));
        }

        // Synchronize alternator copper rotor winding bands (rotating across front cylinder arc)
        for (let b = 0; b < animRotorBands.length; b++) {
          const rb = animRotorBands[b];
          const phase = (theta * 0.85 + (rb.index / rb.total) * Math.PI * 2) % (Math.PI * 2);
          const norm = Math.sin(phase); // -1..+1 across visible cylindrical face
          const frontVis = Math.cos(phase); // > -0.15 means visible on front side

          if (frontVis > -0.18) {
            const dy = norm * 25.5;
            const dx = -norm * 5.2;
            rb.el.setAttribute("x1", (1176 + dx).toFixed(1));
            rb.el.setAttribute("y1", (617 + dy).toFixed(1));
            rb.el.setAttribute("x2", (1280 + dx).toFixed(1));
            rb.el.setAttribute("y2", (655 + dy).toFixed(1));
            rb.el.setAttribute("opacity", Math.max(0, Math.min(0.88, (frontVis + 0.18) * 0.85)).toFixed(2));
          } else {
            rb.el.setAttribute("opacity", "0");
          }
        }

        // Synchronize emerald end-bell ring rotation on far-right alternator shaft
        if (animEndRingSpokes) {
          const deg = ((theta * 180) / Math.PI) % 360;
          animEndRingSpokes.setAttribute("transform", "translate(1364, 684) rotate(" + deg.toFixed(1) + ")");
        }
      }

      /* =====================================================================
         7. BUILD ALL SVG LAYERS & INITIALIZE POSE (CYLINDER #3 FIRING!)
         ===================================================================== */
      buildHousingBack();
      buildDigesterDome();
      buildHeatRecovery();
      buildGasScrubber();
      buildPistonEngine();
      buildAlternator();
      buildHousingFront();

      // Render crisp initial frame immediately so Cylinder #3 glows brightly at startup
      updateEngineAndAlternator(0.0, 1.0);

      /* =====================================================================
         8. CAMERA, SPOTLIGHT TOUR, EXPLODED VIEW & INTERACTION ENGINE
         ===================================================================== */
      const stageEl = document.getElementById("mirvo-stage");
      const viewportEl = document.getElementById("mirvo-viewport");
      const allPartEls = Array.from(document.querySelectorAll(".mirvo-part"));
      const allExplodeWraps = Array.from(document.querySelectorAll(".explode-wrap"));

      const prefersReducedMotion =
        window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const state = {
        focusedPart: null,
        camera: { x: 800, y: 450, zoom: 1.0 },
        targetExploded: 0,
        currentExploded: 0,
        phase: "auto", // "auto" | "fermentation" | "scrubbing" | "combustion" | "recovery" | "generation"
        playing: true,
        autoTour: !prefersReducedMotion,
        stepIndex: 0,
        tourTimer: null,
        simTime: 0,
        crankTheta: 0
      };

      /**
       * Smoothly pans and zooms the 16:9 SVG stage around target `(x, y, zoom)`.
       */
      function applyCamera(target) {
        let cam = FOCUS_TARGETS.full;
        if (typeof target === "string") {
          cam = FOCUS_TARGETS[target] || FOCUS_TARGETS.full;
        } else if (target && typeof target === "object") {
          cam = {
            x: typeof target.x === "number" ? target.x : 800,
            y: typeof target.y === "number" ? target.y : 450,
            zoom: typeof target.zoom === "number" ? Math.max(0.6, Math.min(3.2, target.zoom)) : 1.0
          };
        }

        state.camera = cam;

        if (prefersReducedMotion) {
          stageEl.style.transform = "scale(1) translate(0%, 0%)";
          return;
        }

        const txPct = ((800 - cam.x) / 1600) * 100;
        const tyPct = ((450 - cam.y) / 900) * 100;
        stageEl.style.transform =
          "scale(" +
          cam.zoom.toFixed(3) +
          ") translate(" +
          txPct.toFixed(2) +
          "%, " +
          tyPct.toFixed(2) +
          "%)";
      }

      /**
       * Spotlights ONLY `partId` at 100% clarity while smoothly dimming all others.
       */
      function applyHighlight(partId) {
        const cleanId =
          partId && partId !== "full" && partId !== "housing" && PART_NAMES_UZ[partId] ? partId : null;
        state.focusedPart = cleanId;

        allPartEls.forEach(function (g) {
          if (!cleanId) {
            g.classList.remove("is-dimmed");
            g.classList.remove("is-focused");
          } else if (g.dataset.part === cleanId) {
            g.classList.remove("is-dimmed");
            g.classList.add("is-focused");
          } else {
            g.classList.remove("is-focused");
            g.classList.add("is-dimmed");
          }
        });
      }

      /**
       * Applies smooth exploded separation onto inner `.explode-wrap` groups.
       */
      function writeExplodedTransforms(amount) {
        allExplodeWraps.forEach(function (wrap) {
          const key = wrap.dataset.explode;
          const vec = EXPLODE_VECTORS[key] || [0, 0];
          const dx = vec[0] * amount;
          const dy = vec[1] * amount;
          if (Math.abs(dx) < 0.05 && Math.abs(dy) < 0.05) {
            wrap.removeAttribute("transform");
          } else {
            wrap.setAttribute("transform", "translate(" + dx.toFixed(2) + " " + dy.toFixed(2) + ")");
          }
        });
      }

      /* =====================================================================
         9. SEQUENTIAL AUTO-SPOTLIGHT TOUR ENGINE
         ===================================================================== */
      function clearTourTimer() {
        if (state.tourTimer !== null) {
          clearTimeout(state.tourTimer);
          state.tourTimer = null;
        }
      }

      function scheduleNextTourStep() {
        clearTourTimer();
        if (!state.autoTour) return;
        const holdMs = state.stepIndex === 0 ? 2500 : 3500;
        state.tourTimer = setTimeout(function () {
          if (state.autoTour) {
            runTourStep(state.stepIndex + 1);
          }
        }, holdMs);
      }

      function runTourStep(index) {
        clearTourTimer();
        const safeIdx = ((index % TOUR_SEQUENCE.length) + TOUR_SEQUENCE.length) % TOUR_SEQUENCE.length;
        state.stepIndex = safeIdx;
        const key = TOUR_SEQUENCE[safeIdx];

        if (key === "full") {
          applyHighlight(null);
          applyCamera("full");
        } else {
          applyHighlight(key);
          applyCamera(key);
        }

        if (state.autoTour) {
          scheduleNextTourStep();
        }
      }

      function setAutoTour(enabled) {
        state.autoTour = Boolean(enabled);
        clearTourTimer();
        if (state.autoTour) {
          scheduleNextTourStep();
        }
      }

      /* =====================================================================
         10. 60 FPS LIVE PHYSICS SIMULATION LOOP
         ===================================================================== */
      let lastTs = 0;

      function getPhaseMultipliers() {
        switch (state.phase) {
          case "fermentation":
            return { ferm: 1.65, scrub: 1.0, engine: 0.9, recovery: 0.95, gen: 0.9 };
          case "scrubbing":
            return { ferm: 1.05, scrub: 1.75, engine: 1.0, recovery: 1.0, gen: 1.0 };
          case "combustion":
            return { ferm: 1.0, scrub: 1.15, engine: 1.55, recovery: 1.25, gen: 1.35 };
          case "recovery":
            return { ferm: 1.0, scrub: 1.05, engine: 1.15, recovery: 1.75, gen: 1.15 };
          case "generation":
            return { ferm: 1.0, scrub: 1.05, engine: 1.45, recovery: 1.2, gen: 1.8 };
          case "auto":
          default:
            return { ferm: 1.0, scrub: 1.0, engine: 1.0, recovery: 1.0, gen: 1.0 };
        }
      }

      function tickPhysics(ts) {
        try {
          if (!lastTs) lastTs = ts;
          const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
          lastTs = ts;

          // Keep Exploded View interpolation smooth even while physics is paused
          if (Math.abs(state.targetExploded - state.currentExploded) > 0.0008) {
            if (prefersReducedMotion) {
              state.currentExploded = state.targetExploded;
            } else {
              const alpha = 1 - Math.exp(-dt * 8.2);
              state.currentExploded += (state.targetExploded - state.currentExploded) * alpha;
            }
            writeExplodedTransforms(state.currentExploded);
          } else if (state.currentExploded !== state.targetExploded) {
            state.currentExploded = state.targetExploded;
            writeExplodedTransforms(state.currentExploded);
          }

          if (state.playing) {
            const mult = getPhaseMultipliers();
            const motionScale = prefersReducedMotion ? 0.16 : 1.0;
            state.simTime += dt;
            const t = state.simTime;

            // 1) Rising golden-amber methane bubbles with wavy tails in digester dome
            for (let i = 0; i < animBubbles.length; i++) {
              const b = animBubbles[i];
              b.t = (b.t + dt * b.speed * mult.ferm * motionScale) % 1;
              const y = b.yStart + (b.yEnd - b.yStart) * b.t;
              const sway = Math.sin(t * 2.8 + b.phase + b.t * 4.5) * b.amp;
              const x = b.baseX + sway;

              // Smooth grow-in at biomass surface & fade near dome roof
              const edgeFade = Math.min(1, b.t * 5.5, (1 - b.t) * 5.0);
              const sc = 0.65 + 0.35 * Math.min(1, b.t * 3.5);
              b.group.setAttribute(
                "transform",
                "translate(" + x.toFixed(1) + ", " + y.toFixed(1) + ") scale(" + sc.toFixed(2) + ")"
              );
              b.group.setAttribute("opacity", Math.max(0, edgeFade).toFixed(2));

              // Undulating tail curve beneath bubble
              const w1 = Math.sin(t * 5.5 + b.phase) * 4.2;
              const w2 = Math.cos(t * 5.0 + b.phase) * 3.8;
              const tailLen = Math.min(34, 14 + b.r * 1.4);
              b.tail.setAttribute(
                "d",
                "M 0 " + (b.r * 0.85).toFixed(1) +
                " Q " + w1.toFixed(1) + " " + (b.r + tailLen * 0.48).toFixed(1) +
                " " + w2.toFixed(1) + " " + (b.r + tailLen).toFixed(1)
              );
            }

            // 2) Falling cyan water droplets inside gas scrubber viewing windows
            for (let i = 0; i < animDroplets.length; i++) {
              const d = animDroplets[i];
              d.t = (d.t + dt * d.speed * mult.scrub * motionScale) % 1;
              const y = d.yStart + (d.yEnd - d.yStart) * (d.t * d.t * 0.45 + d.t * 0.55);
              const op = Math.min(1, d.t * 6.0, (1 - d.t) * 6.5);
              d.el.setAttribute("transform", "translate(" + d.x + ", " + y.toFixed(1) + ")");
              d.el.setAttribute("opacity", op.toFixed(2));
            }

            // 3) Pipe gas / thermal streamlines & oriented chevrons
            for (let i = 0; i < animFlowStreams.length; i++) {
              const s = animFlowStreams[i];
              const m = s.channel === "recovery" ? mult.recovery : mult.scrub;
              s.offset -= dt * s.speed * s.dir * m * motionScale;
              s.el.setAttribute("stroke-dashoffset", s.offset.toFixed(2));
            }

            for (let i = 0; i < animChevrons.length; i++) {
              const ch = animChevrons[i];
              const m = ch.channel === "recovery" ? mult.recovery : mult.scrub;
              ch.t = (ch.t + dt * ch.speed * m * motionScale) % 1;
              if (ch.t < 0) ch.t += 1;

              const dist = ch.t * ch.length;
              const p = ch.pathEl.getPointAtLength(dist);
              const stepDir = ch.speed >= 0 ? 1 : -1;
              const dist2 = Math.max(0, Math.min(ch.length, dist + stepDir * 2.5));
              const p2 = ch.pathEl.getPointAtLength(dist2);
              const angDeg = (Math.atan2(p2.y - p.y, p2.x - p.x) * 180) / Math.PI;
              const edgeFade = Math.min(1, ch.t * 8, (1 - ch.t) * 8);

              ch.el.setAttribute(
                "transform",
                "translate(" + p.x.toFixed(1) + " " + p.y.toFixed(1) + ") rotate(" + angDeg.toFixed(1) + ")"
              );
              ch.el.setAttribute("opacity", (0.95 * edgeFade).toFixed(2));
            }

            // 4) 4-Cylinder Engine Crank-Slider Kinematics & Alternator Rotor Sync
            state.crankTheta = (state.crankTheta + dt * 5.2 * mult.engine * motionScale) % (Math.PI * 4);
            updateEngineAndAlternator(state.crankTheta, mult.engine);

            // 5) Warm thermal aura behind heat exchanger & emerald electrical output aura
            for (let i = 0; i < animThermalAuras.length; i++) {
              const au = animThermalAuras[i];
              const m = i < 2 ? mult.recovery : mult.gen;
              const op = au.baseOp + au.amp * Math.sin(t * 2.6 * m + au.phase);
              au.el.setAttribute("opacity", Math.max(0.08, Math.min(1, op)).toFixed(2));
            }

            // 6) Vibrant emerald electrical energy streaks from alternator terminals
            for (let i = 0; i < animElecPulses.length; i++) {
              const ep = animElecPulses[i];
              ep.offset -= dt * ep.speed * mult.gen * motionScale;
              ep.el.setAttribute("stroke-dashoffset", ep.offset.toFixed(2));
            }
          }
        } catch (err) {
          // Keep 60 FPS loop resilient against unexpected browser errors
        }
        requestAnimationFrame(tickPhysics);
      }

      /* =====================================================================
         11. USER INTERACTIONS (CLICK-TO-ASK, RESET, EXPLODED VIEW, KEYBOARD)
         ===================================================================== */
      allPartEls.forEach(function (g) {
        const partId = g.dataset.part;
        if (!partId || partId === "housing") return;

        g.addEventListener("click", function (ev) {
          ev.stopPropagation();
          setAutoTour(false);
          const idx = TOUR_SEQUENCE.indexOf(partId);
          if (idx >= 0) state.stepIndex = idx;
          applyHighlight(partId);
          applyCamera(partId);

          // Notify host / Mirvo AI lesson controller via Click-to-Ask event
          try {
            window.parent.postMessage(
              {
                type: "PART_CLICK",
                deviceId: DEVICE_ID,
                partId: partId,
                nameUz: PART_NAMES_UZ[partId] || partId
              },
              "*"
            );
          } catch (e) {
            // Safe fallback if standalone
          }
        });
      });

      // Clicking blank white canvas or housing resets view & resumes Auto-Spotlight Tour
      viewportEl.addEventListener("click", function (ev) {
        const clickedPart = ev.target && ev.target.closest ? ev.target.closest(".mirvo-part") : null;
        if (!clickedPart || clickedPart.dataset.part === "housing") {
          window.MirvoScene.reset();
        }
      });

      // Double-clicking anywhere smoothly toggles Exploded View (0 <-> 1)
      viewportEl.addEventListener("dblclick", function (ev) {
        ev.preventDefault();
        window.MirvoScene.setExploded(state.targetExploded > 0.5 ? 0 : 1);
      });

      // Keyboard controls: R / Esc -> Reset, E -> Exploded View, Space -> Play/Pause
      window.addEventListener("keydown", function (ev) {
        const key = ev.key;
        if (key === "r" || key === "R" || key === "Escape") {
          window.MirvoScene.reset();
        } else if (key === "e" || key === "E") {
          window.MirvoScene.setExploded(state.targetExploded > 0.5 ? 0 : 1);
        } else if (key === " ") {
          ev.preventDefault();
          window.MirvoScene.setPlaying(!state.playing);
        }
      });

      /* =====================================================================
         12. MANDATORY MIRVO AI INTEGRATION API (`window.MirvoScene` & `postMessage`)
         ===================================================================== */
      window.MirvoScene = {
        deviceId: DEVICE_ID,
        parts: PART_NAMES_UZ,

        focus: function (target) {
          if (target === null || target === "full") {
            state.stepIndex = 0;
            applyCamera("full");
            return;
          }
          setAutoTour(false);
          if (typeof target === "string") {
            const idx = TOUR_SEQUENCE.indexOf(target);
            if (idx >= 0) state.stepIndex = idx;
          }
          applyCamera(target);
        },

        highlight: function (partId) {
          applyHighlight(partId);
        },

        setStep: function (index) {
          setAutoTour(false);
          const safeIdx = Math.max(0, Math.min(TOUR_SEQUENCE.length - 1, Math.floor(Number(index) || 0)));
          state.stepIndex = safeIdx;
          const key = TOUR_SEQUENCE[safeIdx];

          const phaseMap = {
            full: "auto",
            digester_dome: "fermentation",
            gas_scrubber: "scrubbing",
            piston_engine: "combustion",
            heat_recovery: "recovery",
            alternator: "generation"
          };

          state.phase = phaseMap[key] || "auto";
          if (key === "full") {
            applyHighlight(null);
            applyCamera("full");
          } else {
            applyHighlight(key);
            applyCamera(key);
          }
        },

        setAutoTour: function (enabled) {
          setAutoTour(enabled);
        },

        setExploded: function (amount) {
          state.targetExploded = Math.max(0, Math.min(1, Number(amount) || 0));
        },

        setPhase: function (mode) {
          const valid = ["auto", "fermentation", "scrubbing", "combustion", "recovery", "generation"];
          if (valid.indexOf(mode) !== -1) {
            state.phase = mode;
          }
        },

        setPlaying: function (playing) {
          state.playing = Boolean(playing);
        },

        reset: function () {
          state.targetExploded = 0;
          state.phase = "auto";
          state.playing = true;
          state.stepIndex = 0;
          applyHighlight(null);
          applyCamera("full");
          setAutoTour(!prefersReducedMotion);
        }
      };

      // Listen for parent Mirvo AI lesson controller commands via postMessage
      window.addEventListener("message", function (ev) {
        try {
          const msg = ev.data;
          if (!msg || typeof msg !== "object" || typeof msg.type !== "string") return;

          switch (msg.type) {
            case "FOCUS":
              window.MirvoScene.focus(msg.target);
              break;
            case "HIGHLIGHT":
              window.MirvoScene.highlight(msg.partId);
              break;
            case "SET_STEP":
              window.MirvoScene.setStep(msg.index);
              break;
            case "SET_AUTO_TOUR":
              window.MirvoScene.setAutoTour(msg.enabled);
              break;
            case "EXPLODE":
              window.MirvoScene.setExploded(msg.amount);
              break;
            case "SET_PHASE":
              window.MirvoScene.setPhase(msg.mode);
              break;
            case "SET_PLAYING":
              window.MirvoScene.setPlaying(msg.playing);
              break;
            case "RESET":
              window.MirvoScene.reset();
              break;
            default:
              break;
          }
        } catch (err) {
          // Safely ignore malformed cross-origin messages
        }
      });

      /* =====================================================================
         13. BOOTSTRAP ON WINDOW LOAD
         ===================================================================== */
      window.onload = function () {
        applyCamera("full");
        applyHighlight(null);
        requestAnimationFrame(tickPhysics);
        if (!prefersReducedMotion) {
          runTourStep(0);
        }
      };
    })();
  </script>
</body>
</html>
