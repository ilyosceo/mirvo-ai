<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* =========================================================================
       MIRVO AI — STRICT ZERO-UI & PURE #FFFFFF CANVAS FOUNDATION
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body, .mirvo-viewport {
      background: #ffffff;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .mirvo-stage {
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      transform-origin: 50% 50%;
      transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    #mirvo-svg {
      display: block;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: visible;
    }

    /* =========================================================================
       SEQUENTIAL SPOTLIGHT FOCUS / DIMMING TRANSITIONS
       ========================================================================= */
    .mirvo-part {
      cursor: pointer;
      transition:
        opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.48s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mirvo-part.mirvo-housing {
      cursor: default;
    }

    .mirvo-part.is-dimmed {
      opacity: 0.22;
      filter: blur(1.2px) saturate(0.45);
    }

    .mirvo-part.is-focused {
      opacity: 1;
      filter: drop-shadow(0 6px 16px rgba(2, 132, 199, 0.22));
    }

    /* Crisp dark-slate technical engineering outlines */
    .ink {
      stroke: #222933;
      stroke-width: 1.25;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .ink-bold {
      stroke: #222933;
      stroke-width: 1.5;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .ink-thin {
      stroke: #222933;
      stroke-width: 0.95;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .ink-micro {
      stroke: #222933;
      stroke-width: 0.7;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    @media (prefers-reduced-motion: reduce) {
      .mirvo-stage {
        transition: none;
      }
      .mirvo-part {
        transition: opacity 0.2s ease;
      }
    }
  </style>
</head>
<body>

  <script>
    (() => {
      "use strict";

      /* =========================================================================
         1. DEVICE METADATA, UZBEK LABELS & CAMERA FOCUS PRESETS
         ========================================================================= */
      const DEVICE_ID = "fes_solar_inverter";

      const PARTS = [
        {
          id: "pv_cells",
          nameUz: "Fotovoltaik quyosh elementlari",
          focusTarget: { x: 610, y: 295, zoom: 1.56 }
        },
        {
          id: "junction_box",
          nameUz: "Ulanish qutisi (Junction box)",
          focusTarget: { x: 545, y: 542, zoom: 2.38 }
        },
        {
          id: "dc_bus",
          nameUz: "O‘zgarmas tok shinalari (DC zveno)",
          focusTarget: { x: 775, y: 585, zoom: 2.15 }
        },
        {
          id: "igbt_inverter",
          nameUz: "IGBT invertor moduli",
          focusTarget: { x: 938, y: 542, zoom: 2.28 }
        },
        {
          id: "ac_filter",
          nameUz: "O‘zgaruvchan tok filtri (AC filtr)",
          focusTarget: { x: 1108, y: 452, zoom: 2.26 }
        }
      ];

      const PART_MAP = Object.fromEntries(PARTS.map((p) => [p.id, p]));

      const CAMERA_TARGETS = {
        full: { x: 800, y: 450, zoom: 1.0 },
        ...Object.fromEntries(PARTS.map((p) => [p.id, p.focusTarget]))
      };

      const TOUR_SEQUENCE = [
        "full",
        "pv_cells",
        "junction_box",
        "dc_bus",
        "igbt_inverter",
        "ac_filter"
      ];

      // Isometric Exploded View translation vectors (calibrated so nothing clips)
      const EXPLODE_VECTORS = {
        "part-housing-back": { x: 0, y: 0 },
        "part-pv_cells": { x: -46, y: -56 },
        "part-junction_box": { x: -64, y: 36 },
        "part-dc_bus": { x: -24, y: -44 },
        "part-igbt_inverter": { x: 16, y: -60 },
        "part-ac_filter": { x: 58, y: -48 },
        "part-housing-front": { x: 44, y: 42 }
      };

      const TOUR_DURATION_FULL_MS = 2500;
      const TOUR_DURATION_PART_MS = 3600;

      const prefersReducedMotion =
        typeof window.matchMedia === "function" &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* =========================================================================
         2. TRUE 30-DEGREE ISOMETRIC PROJECTION ENGINE & SVG PRIMITIVE FACTORY
         ========================================================================= */
      const SVG_NS = "http://www.w3.org/2000/svg";
      const COS30 = Math.sqrt(3) / 2;
      const SIN30 = 0.5;
      const ISO_OX = 208;
      const ISO_OY = 516;
      const ISO_S = 0.90;

      /**
       * Projects 3D right-handed isometric coordinates (x, y, z) to 2D viewBox space.
       *  +x -> down-right (front of array / toward inverter)
       *  +y -> up-right   (along solar array & inverter length)
       *  +z -> straight up (elevation)
       */
      function iso(x, y, z = 0) {
        return {
          x: ISO_OX + (x + y) * ISO_S * COS30,
          y: ISO_OY + (x - y) * ISO_S * SIN30 - z * ISO_S
        };
      }

      function pts(coords) {
        return coords
          .map(([x, y, z]) => {
            const p = iso(x, y, z || 0);
            return `${p.x.toFixed(1)},${p.y.toFixed(1)}`;
          })
          .join(" ");
      }

      function pathFrom3D(coords, closed = false) {
        if (!coords.length) return "";
        const d = coords
          .map(([x, y, z], i) => {
            const p = iso(x, y, z || 0);
            return `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;
          })
          .join(" ");
        return closed ? `${d} Z` : d;
      }

      function svgEl(tag, attrs = {}, parent = null) {
        const el = document.createElementNS(SVG_NS, tag);
        for (const [k, v] of Object.entries(attrs)) {
          el.setAttribute(k, String(v));
        }
        if (parent) parent.appendChild(el);
        return el;
      }

      /**
       * Draws a crisp 3-face isometric prism (top +z, front-left -y, front-right +x).
       */
      function drawIsoBox(parent, x0, y0, z0, dx, dy, dz, fills, cls = "ink") {
        const g = svgEl("g", {}, parent);
        const x1 = x0 + dx;
        const y1 = y0 + dy;
        const z1 = z0 + dz;

        if (fills.left !== null) {
          svgEl(
            "polygon",
            {
              class: cls,
              points: pts([
                [x0, y0, z0],
                [x1, y0, z0],
                [x1, y0, z1],
                [x0, y0, z1]
              ]),
              fill: fills.left || "url(#alu-left)"
            },
            g
          );
        }
        if (fills.right !== null) {
          svgEl(
            "polygon",
            {
              class: cls,
              points: pts([
                [x1, y0, z0],
                [x1, y1, z0],
                [x1, y1, z1],
                [x1, y0, z1]
              ]),
              fill: fills.right || "url(#alu-right)"
            },
            g
          );
        }
        if (fills.top !== null) {
          svgEl(
            "polygon",
            {
              class: cls,
              points: pts([
                [x0, y0, z1],
                [x1, y0, z1],
                [x1, y1, z1],
                [x0, y1, z1]
              ]),
              fill: fills.top || "url(#alu-top)"
            },
            g
          );
        }
        return g;
      }

      /**
       * Draws a crisp isometric vertical cylinder (used for electrolytic capacitors,
       * hex standoffs, and cable entry collars).
       */
      function drawIsoCylinder(parent, cx, cy, z0, h, r, opts = {}) {
        const g = svgEl("g", {}, parent);
        const rx = r * ISO_S * 1.224;
        const ry = r * ISO_S * 0.707;
        const bot = iso(cx, cy, z0);
        const top = iso(cx, cy, z0 + h);
        const cls = opts.cls || "ink-thin";

        // Cylinder side body
        svgEl(
          "path",
          {
            class: cls,
            d: `M ${(top.x - rx).toFixed(1)} ${top.y.toFixed(1)} L ${(bot.x - rx).toFixed(1)} ${bot.y.toFixed(1)} A ${rx.toFixed(1)} ${ry.toFixed(1)} 0 0 0 ${(bot.x + rx).toFixed(1)} ${bot.y.toFixed(1)} L ${(top.x + rx).toFixed(1)} ${top.y.toFixed(1)} Z`,
            fill: opts.bodyFill || "url(#cap-blue-cyl)"
          },
          g
        );

        // Top bevel ring & cap
        svgEl(
          "ellipse",
          {
            class: cls,
            cx: top.x.toFixed(1),
            cy: top.y.toFixed(1),
            rx: rx.toFixed(1),
            ry: ry.toFixed(1),
            fill: opts.rimFill || "#0284C7"
          },
          g
        );

        if (opts.capFill) {
          svgEl(
            "ellipse",
            {
              class: "ink-micro",
              cx: top.x.toFixed(1),
              cy: top.y.toFixed(1),
              rx: (rx * 0.8).toFixed(1),
              ry: (ry * 0.8).toFixed(1),
              fill: opts.capFill
            },
            g
          );
        }

        // Optional stamped electrolytic pressure-relief score
        if (opts.score) {
          const sx = rx * 0.48;
          const sy = ry * 0.48;
          svgEl(
            "path",
            {
              d: `M ${(top.x - sx).toFixed(1)} ${(top.y - sy * 0.6).toFixed(1)} L ${(top.x + sx).toFixed(1)} ${(top.y + sy * 0.6).toFixed(1)} M ${(top.x - sx * 0.7).toFixed(1)} ${(top.y + sy * 0.8).toFixed(1)} L ${(top.x + sx * 0.7).toFixed(1)} ${(top.y - sy * 0.8).toFixed(1)}`,
              stroke: "#64748B",
              "stroke-width": "0.85",
              "stroke-linecap": "round",

            },

        }

        return { g, top, bot, rx, ry };
      }

      /**
       * Draws an isometric rounded-rectangle box (for ivory polypropylene film capacitors
       * and sleek rounded enclosures).
       */
      function drawIsoRoundedBox(parent, x0, y0, z0, dx, dy, dz, r, fills, cls = "ink-thin") {
        const steps = 4;
        const corners = [
          { cx: x0 + r, cy: y0 + r, a0: Math.PI, a1: Math.PI * 1.5 },
          { cx: x0 + dx - r, cy: y0 + r, a0: Math.PI * 1.5, a1: Math.PI * 2 },
          { cx: x0 + dx - r, cy: y0 + dy - r, a0: 0, a1: Math.PI * 0.5 },
          { cx: x0 + r, cy: y0 + dy - r, a0: Math.PI * 0.5, a1: Math.PI }
        ];
        const loop = [];
        for (const c of corners) {
          for (let i = 0; i <= steps; i++) {
            const a = c.a0 + (c.a1 - c.a0) * (i / steps);
            loop.push([c.cx + Math.cos(a) * r, c.cy + Math.sin(a) * r]);
          }
        }

        const g = svgEl("g", {}, parent);

        // Front-left skirt (-y side, indices from corner 0 mid to corner 1 mid)
        const leftPtsTop = [];
        const leftPtsBot = [];
        for (let i = 0; i <= steps * 2 + 1; i++) {
          const [px, py] = loop[i];
          leftPtsTop.push([px, py, z0 + dz]);
          leftPtsBot.unshift([px, py, z0]);
        }
        svgEl(
          "path",
          {
            class: cls,
            d: pathFrom3D([...leftPtsTop, ...leftPtsBot], true),
            fill: fills.left
          },
          g
        );

        // Front-right skirt (+x side, corner 1 mid to corner 2 mid)
        const rightPtsTop = [];
        const rightPtsBot = [];
        for (let i = steps + 1; i <= steps * 3 + 2; i++) {
          const [px, py] = loop[i % loop.length];
          rightPtsTop.push([px, py, z0 + dz]);
          rightPtsBot.unshift([px, py, z0]);
        }
        svgEl(
          "path",
          {
            class: cls,
            d: pathFrom3D([...rightPtsTop, ...rightPtsBot], true),
            fill: fills.right
          },
          g
        );

        // Top rounded face
        svgEl(
          "path",
          {
            class: cls,
            d: pathFrom3D(
              loop.map(([px, py]) => [px, py, z0 + dz]),
              true
            ),
            fill: fills.top
          },
          g
        );

        return g;
      }

      /* =========================================================================
         5. BUILD LAYER 2 — PART 1: PHOTOVOLTAIC SOLAR ARRAY (PV CELLS + CUTAWAY)
         ========================================================================= */
      function buildPvCells() {
        // Panel plane basis:
        // u ∈ [0, 1]: back-top (x=48, z=196) -> front-bottom (x=312, z=66)
        // v: y coordinate along the 3 panels
        // n: outward normal offset (perp to panel slope: nx=+0.4472, nz=+0.8944)
        const X0 = 48;
        const Z0 = 196;
        const DX = 264;
        const DZ = -130;
        const NX = 0.4472;
        const NZ = 0.8944;

        function pPt(u, v, n = 0) {
          return [X0 + u * DX + n * NX, v, Z0 + u * DZ + n * NZ];
        }

        function drawPanelPolygon(parent, uvCoords, n, fill, cls = "ink-micro", extra = {}) {
          return svgEl(
            "polygon",
            {
              class: cls,
              points: pts(uvCoords.map(([u, v]) => pPt(u, v, n))),
              fill,
              ...extra
            },
            parent
          );
        }

        // Draw 3 panels in strict back-to-front order (Panel 3 -> Panel 2 -> Panel 1)
        const panelSpans = [
          { idx: 2, y0: 478, y1: 682, cut: null },
          { idx: 1, y0: 264, y1: 468, cut: { uStart: 0.56, yCutStart: 264, yCutEnd: 372 } },
          { idx: 0, y0: 50, y1: 254, cut: { uStart: 0.56, yCutStart: 126, yCutEnd: 254 } }
        ];

        const cellsContainer = svgEl("g", { id: "pv-panels-assembly" }, gPvCells);

        for (const panel of panelSpans) {
          const pg = svgEl("g", {}, cellsContainer);
          const { y0, y1, cut } = panel;
          const frameThick = 11;
          const borderU = 0.036;
          const borderV = 8.5;

          // Anodized Aluminum Perimeter Frame — Front-Right (+u) & Front-Left (-v) outer thickness
          // Front-bottom edge (+u = 1)
          svgEl(
            "polygon",
            {
              class: "ink",
              points: pts([
                pPt(1, y0, 0),
                pPt(1, y1, 0),
                pPt(1, y1, frameThick),
                pPt(1, y0, frameThick)
              ]),
              fill: "url(#alu-right)"
            },
            pg
          );
          // Front-left edge (-v = y0)
          svgEl(
            "polygon",
            {
              class: "ink",
              points: pts([
                pPt(0, y0, 0),
                pPt(1, y0, 0),
                pPt(1, y0, frameThick),
                pPt(0, y0, frameThick)
              ]),
              fill: "url(#alu-left)"
            },
            pg
          );

          // Top satin-aluminum frame surface
          drawPanelPolygon(
            pg,
            [
              [0, y0],
              [1, y0],
              [1, y1],
              [0, y1]
            ],
            frameThick,
            "url(#alu-top)",
            "ink"
          );

          // Dark recessed interior backing substrate inside frame
          drawPanelPolygon(
            pg,
            [
              [borderU, y0 + borderV],
              [1 - borderU, y0 + borderV],
              [1 - borderU, y1 - borderV],
              [borderU, y1 - borderV]
            ],
            frameThick - 1.2,
            "#E2E8F0",
            "ink-thin"
          );

          // 6 rows (along u) × 4 columns (along v) of Monocrystalline Silicon PV Cells
          const rows = 6;
          const cols = 4;
          const uMin = borderU + 0.01;
          const uMax = 1 - borderU - 0.01;
          const vMin = y0 + borderV + 2.5;
          const vMax = y1 - borderV - 2.5;
          const du = (uMax - uMin) / rows;
          const dv = (vMax - vMin) / cols;
          const gapU = du * 0.055;
          const gapV = dv * 0.055;
          const chU = du * 0.14; // Octagonal monocrystalline corner chamfer
          const chV = dv * 0.14;

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const ua = uMin + r * du + gapU;
              const ub = uMin + (r + 1) * du - gapU;
              const va = vMin + c * dv + gapV;
              const vb = vMin + (c + 1) * dv - gapV;
              const uMid = (ua + ub) * 0.5;
              const vMid = (va + vb) * 0.5;

              // Skip cells removed by the stepped cutaway window in Panels 1 & 2
              if (
                cut &&
                uMid > cut.uStart + 0.14 &&
                vMid > cut.yCutStart + 4 &&
                vMid < cut.yCutEnd - 4
              ) {
                continue;
              }

              // Chamfered octagonal monocrystalline silicon cell polygon
              const oct = [
                [ua + chU, va],
                [ub - chU, va],
                [ub, va + chV],
                [ub, vb - chV],
                [ub - chU, vb],
                [ua + chU, vb],
                [ua, vb - chV],
                [ua, va + chV]
              ];

              drawPanelPolygon(pg, oct, frameThick - 0.6, "url(#pv-cell-grad)", "ink-micro", {
                stroke: "#1E3A8A",
                "stroke-width": "0.65"
              });

              // Fine silver-white vertical micro-busbar lines across each cell
              const b1 = va + (vb - va) * 0.34;
              const b2 = va + (vb - va) * 0.66;
              [b1, b2].forEach((bv) => {
                const p1 = iso(...pPt(ua + chU * 0.2, bv, frameThick - 0.4));
                const p2 = iso(...pPt(ub - chU * 0.2, bv, frameThick - 0.4));
                svgEl(
                  "line",
                  {
                    x1: p1.x.toFixed(1),
                    y1: p1.y.toFixed(1),
                    x2: p2.x.toFixed(1),
                    y2: p2.y.toFixed(1),
                    stroke: "#E0F2FE",
                    "stroke-width": "0.65",
                    opacity: "0.78"
                  },
                  pg
                );
              });
            }
          }

          // Subtle diagonal glass specular reflection strip
          drawPanelPolygon(
            pg,
            [
              [borderU, y0 + (y1 - y0) * 0.15],
              [0.64, y0 + (y1 - y0) * 0.15],
              [0.24, y1 - borderV],
              [borderU, y1 - borderV]
            ],
            frameThick + 0.3,
            "url(#pv-glass-sheen)",
            ""
          );

          // Stepped Multi-Layer Cutaway across lower-front of Panel 1 & Panel 2
          if (cut) {
            const cU0 = cut.uStart;
            const cU1 = 1 - borderU;
            const cV0 = cut.yCutStart + (panel.idx === 0 ? 0 : borderV);
            const cV1 = cut.yCutEnd - (panel.idx === 0 ? borderV : 0);

            // Layer 1: Clean Ivory-White Tedlar Backsheet exposed at bottom step
            drawPanelPolygon(
              pg,
              [
                [cU0 + 0.14, cV0],
                [cU1, cV0],
                [cU1, cV1],
                [cU0 + 0.14, cV1]
              ],
              frameThick - 4.2,
              "#F8FAFC",
              "ink-thin"
            );

            // Layer 2: Translucent Pale-Cyan EVA Encapsulant Layer (middle step)
            drawPanelPolygon(
              pg,
              [
                [cU0 + 0.08, cV0],
                [cU0 + 0.25, cV0],
                [cU0 + 0.25, cV1],
                [cU0 + 0.08, cV1]
              ],
              frameThick - 2.2,
              "#BAE6FD",
              "ink-micro",
              { opacity: "0.85" }
            );

            // Layer 3: Tempered Glass Cover Sheet Beveled Edge (upper step)
            drawPanelPolygon(
              pg,
              [
                [cU0, cV0],
                [cU0 + 0.14, cV0],
                [cU0 + 0.14, cV1],
                [cU0, cV1]
              ],
              frameThick + 1.6,
              "url(#glass-cut-grad)",
              "ink-thin"
            );
            // Crisp cyan glass edge thickness
            svgEl(
              "polygon",
              {
                class: "ink-micro",
                points: pts([
                  pPt(cU0 + 0.14, cV0, frameThick - 0.8),
                  pPt(cU0 + 0.14, cV1, frameThick - 0.8),
                  pPt(cU0 + 0.14, cV1, frameThick + 1.6),
                  pPt(cU0 + 0.14, cV0, frameThick + 1.6)
                ]),
                fill: "#7DD3FC"
              },
              pg
            );

            // Internal silver-slate collector ribbon bus conductor running across cutaway
            const rStart = iso(...pPt(cU0 + 0.04, cV0 + 8, frameThick + 0.4));
            const rMid = iso(...pPt(cU0 + 0.22, (cV0 + cV1) * 0.5, frameThick - 2.0));

        // 5E. Two Large Richly Detailed Copper-Wound Toroidal Choke Inductors
        /**
         * Renders a precision 3D isometric vertical copper-wound toroidal choke inductor
         * centered at (cx, cy, cz) with major radius R and minor tube radius r.
         */
        function drawIsoToroid(parent, cx, cy, cz, R, r) {
          const tg = svgEl("g", {}, parent);

          // Soft ambient emerald-cyan electromagnetic field glow behind toroid
          const center2d = iso(cx, cy, cz);
          const glow = svgEl(
            "ellipse",
            {
              cx: center2d.x.toFixed(1),
              cy: center2d.y.toFixed(1),
              rx: "44",
              ry: "38",
              fill: "url(#emerald-flash-grad)",
              opacity: "0.24",
              "pointer-events": "none"
            },
            tg
          );
          anim.toroidGlows.push(glow);

          // Dark slate mounting cradle base on PCB
          drawIsoBox(
            tg,
            cx - 20,
            cy - 12,
            11,
            40,
            24,
            10,
            {
              top: "#475569",
              left: "#334155",
              right: "#1E293B"
            },
            "ink-micro"
          );

          // Torus stands upright in the (x, z) plane, thickness along y
          // Helper to project torus surface point (theta around ring, phi around cross-section)
          function torPt(theta, phi) {
            const rad = R + r * Math.cos(phi);
            const x = cx + rad * Math.cos(theta);
            const z = cz + rad * Math.sin(theta);
            const y = cy + r * Math.sin(phi);
            return iso(x, y, z);
          }

          // Base dark-slate toroidal core silhouette (outer & inner ring)
          const outerPts = [];
          const innerPts = [];
          const segs = 36;
          for (let i = 0; i < segs; i++) {
            const a = (i / segs) * Math.PI * 2;
            const po = torPt(a, 0);
            const pi = torPt(a, Math.PI);
            outerPts.push(`${po.x.toFixed(1)},${po.y.toFixed(1)}`);
            innerPts.push(`${pi.x.toFixed(1)},${pi.y.toFixed(1)}`);
          }

          // Rear core thickness rim (shifted slightly in +y)
          const rearCorePts = [];
          for (let i = 0; i < segs; i++) {
            const a = (i / segs) * Math.PI * 2;
            const p = iso(cx + (R + r) * Math.cos(a), cy + r * 0.85, cz + (R + r) * Math.sin(a));
            rearCorePts.push(`${p.x.toFixed(1)},${p.y.toFixed(1)}`);
          }
          svgEl("polygon", { class: "ink-thin", points: rearCorePts.join(" "), fill: "#334155" }, tg);

          // Main dark ferrite core ring (evenodd cutout for center hole)
          svgEl(
            "path",
            {
              class: "ink-thin",
              d: `M ${outerPts.join(" L ")} Z M ${innerPts.join(" L ")} Z`,
              "fill-rule": "evenodd",
              fill: "#475569"
            },
            tg
          );

          // 28 Dense Radial Brushed-Copper Wire Windings wrapping cleanly around the torus
          const turns = 28;
          const turnList = [];
          for (let i = 0; i < turns; i++) {
            const theta = (i / turns) * Math.PI * 2;
            // Painter's depth order: lower y & higher x & higher z come last
            const depth = Math.cos(theta) * 0.65 + Math.sin(theta) * 0.35;
            turnList.push({ theta, depth });
          }
          turnList.sort((a, b) => a.depth - b.depth);

          for (const item of turnList) {
            const th = item.theta;
            const pInner = torPt(th, Math.PI * 0.92);
            const pTop = torPt(th, -Math.PI * 0.45);
            const pOuter = torPt(th, 0.08);
            const pBack = torPt(th, Math.PI * 0.48);

            // Copper wire turn path wrapping from hole over front face to outer rim
            const wireD = `M ${pInner.x.toFixed(1)} ${pInner.y.toFixed(1)} Q ${pTop.x.toFixed(1)} ${pTop.y.toFixed(1)} ${pOuter.x.toFixed(1)} ${pOuter.y.toFixed(1)} Q ${pBack.x.toFixed(1)} ${pBack.y.toFixed(1)} ${pInner.x.toFixed(1)} ${pInner.y.toFixed(1)}`;
            // Darker outline stroke
            svgEl(
              "path",
              {
                d: wireD,
                fill: "none",
                stroke: "#5E2E10",
                "stroke-width": "4.6",
                "stroke-linecap": "round"
              },
              tg
            );
            // Warm brushed-copper wire body (shading shifts smoothly around circumference)
            const lit = 0.5 + 0.5 * Math.sin(th + 0.7);
            const wireColor = lit > 0.68 ? "#F4BC8A" : lit > 0.35 ? "#D98344" : "#B55D24";
            svgEl(
              "path",
              {
                d: wireD,
                fill: "none",
                stroke: wireColor,
                "stroke-width": "2.6",
                "stroke-linecap": "round"
              },
              tg
            );
          }

      /* =========================================================================
         11. RUNTIME SIMULATION, SPOTLIGHT TOUR & INTERACTION STATE
         ========================================================================= */
      const state = {
        playing: true,
        phaseMode: "auto", // "auto" | "peak_sun" | "low_sun" | "standby"
        simTime: 0,
        irradiance: 0.88, // smoothed power/irradiance factor [0.08..1.0]
        flowDist: 0,
        acPhase: 0,
        explodeTarget: 0,
        explodeCurrent: 0,
        focusedPart: null,
        autoTourEnabled: !prefersReducedMotion,
        tourIndex: 0,
        tourTimerId: null
      };

      const guideLengths = {};

      function cacheGuidePathLengths() {
        for (const [key, el] of Object.entries(anim.guidePaths)) {
          if (el && typeof el.getTotalLength === "function") {
            guideLengths[key] = el.getTotalLength();
          }
        }
        for (const item of anim.igbtLeadPulses) {
          item.len = item.pathEl.getTotalLength();
        }
      }

      /* =========================================================================
         12. CAMERA, HIGHLIGHT & EXPLODED VIEW CONTROLLERS
         ========================================================================= */
      function applyCamera(target) {
        try {
          let cam = CAMERA_TARGETS.full;
          if (typeof target === "string") {
            cam = CAMERA_TARGETS[target] || CAMERA_TARGETS.full;
          } else if (target && typeof target === "object") {
            const x = Number.isFinite(target.x) ? target.x : 800;
            const y = Number.isFinite(target.y) ? target.y : 450;
            const zoom = Number.isFinite(target.zoom) ? Math.max(0.5, Math.min(3.5, target.zoom)) : 1.0;
            cam = { x, y, zoom };
          }

          if (prefersReducedMotion && state.autoTourEnabled) {
            stageEl.style.transform = "scale(1) translate(0%, 0%)";
            return;
          }

          const dxPct = ((800 - cam.x) / 1600) * 100;
          const dyPct = ((450 - cam.y) / 900) * 100;
          stageEl.style.transform = `scale(${cam.zoom.toFixed(4)}) translate(${dxPct.toFixed(3)}%, ${dyPct.toFixed(3)}%)`;
        } catch (err) {
          console.error("Camera update error:", err);
        }
      }

      function applyHighlight(partId) {
        try {
          const valid = partId && PART_MAP[partId] ? partId : null;
          state.focusedPart = valid;

          for (const el of allPartEls) {
            const dp = el.getAttribute("data-part");
            if (!valid) {
              el.classList.remove("is-dimmed", "is-focused");
            } else if (dp === valid) {
              el.classList.remove("is-dimmed");
              el.classList.add("is-focused");
            } else {
              el.classList.remove("is-focused");
              el.classList.add("is-dimmed");
            }
          }
        } catch (err) {
          console.error("Highlight update error:", err);
        }
      }

      function applyExplodeTransforms(amount) {
        for (const item of explodeNodes) {
          if (!item.el) continue;
          if (amount < 0.0005) {
            item.el.removeAttribute("transform");
          } else {
            const tx = (item.vec.x * amount).toFixed(2);
            const ty = (item.vec.y * amount).toFixed(2);
            item.el.setAttribute("transform", `translate(${tx}, ${ty})`);
          }
        }
      }

      /* =========================================================================
         13. SEQUENTIAL AUTO-SPOTLIGHT TOUR ENGINE
         ========================================================================= */
      function clearTourTimer() {
        if (state.tourTimerId !== null) {
          window.clearTimeout(state.tourTimerId);
          state.tourTimerId = null;
        }
      }

      function scheduleNextTourStep() {
        clearTourTimer();
        if (!state.autoTourEnabled || prefersReducedMotion) return;

        const current = TOUR_SEQUENCE[state.tourIndex];
        const delay = current === "full" ? TOUR_DURATION_FULL_MS : TOUR_DURATION_PART_MS;

        state.tourTimerId = window.setTimeout(() => {
          if (!state.autoTourEnabled) return;
          state.tourIndex = (state.tourIndex + 1) % TOUR_SEQUENCE.length;
          const next = TOUR_SEQUENCE[state.tourIndex];
          if (next === "full") {
            applyCamera("full");
            applyHighlight(null);
          } else {
            applyCamera(next);
            applyHighlight(next);
          }
          scheduleNextTourStep();
        }, delay);
      }

      function startAutoTour(fromStart = false) {
        if (prefersReducedMotion) {
          state.autoTourEnabled = false;
          clearTourTimer();
          if (fromStart) {
            applyCamera("full");
            applyHighlight(null);
          }
          return;
        }
        state.autoTourEnabled = true;
        if (fromStart) {
          state.tourIndex = 0;
          applyCamera("full");
          applyHighlight(null);
        }
        scheduleNextTourStep();
      }

      function stopAutoTour() {
        state.autoTourEnabled = false;
        clearTourTimer();
      }

      /* =========================================================================
         14. 60 FPS COUPLED PHOTOVOLTAIC -> DC -> IGBT PWM -> AC SINE PHYSICS
         ========================================================================= */
      function targetIrradiance(simTime, mode) {
        if (mode === "peak_sun") return 1.0;
        if (mode === "low_sun") return 0.45;
        if (mode === "standby") return 0.08;
        // "auto": smooth gentle natural daylight cloud/irradiance modulation [0.68 .. 1.0]
        return 0.84 + Math.sin((simTime / 14.0) * Math.PI * 2) * 0.16;
      }

      function updatePhysics(dt) {
        // Always smoothly interpolate Exploded View even when physics is paused
        const expDiff = state.explodeTarget - state.explodeCurrent;
        if (Math.abs(expDiff) > 0.0005) {
          state.explodeCurrent += expDiff * Math.min(1, dt * 7.4);
          applyExplodeTransforms(state.explodeCurrent);
        } else if (state.explodeCurrent !== state.explodeTarget) {
          state.explodeCurrent = state.explodeTarget;
          applyExplodeTransforms(state.explodeCurrent);
        }

        if (!state.playing) return;

        state.simTime += dt;
        const t = state.simTime;

        const targetIrr = targetIrradiance(t, state.phaseMode);
        state.irradiance += (targetIrr - state.irradiance) * Math.min(1, dt * 3.0);
        const irr = state.irradiance;

        const speedScale = 0.25 + irr * 0.75;
        state.flowDist = (state.flowDist + dt * 0.48 * speedScale) % 1000;
        state.acPhase = (state.acPhase + dt * (5.2 + irr * 4.5)) % (Math.PI * 200);

        // ----- A. FALLING SUNLIGHT PHOTONS & PV EXCITATION -----
        if (anim.pvSheenOverlay) {
          const shimmer = 0.03 + irr * (0.09 + 0.04 * Math.sin(t * 2.8));
          anim.pvSheenOverlay.setAttribute("opacity", shimmer.toFixed(3));
        }

        const photonSpeed = 0.52 * speedScale;
        for (let i = 0; i < anim.photons.length; i++) {
          const ph = anim.photons[i];
          const prog = (ph.offset + t * photonSpeed) % 1;
          const tailProg = Math.max(0, prog - 0.24);
          const x1 = ph.start.x + (ph.end.x - ph.start.x) * tailProg;
          const y1 = ph.start.y + (ph.end.y - ph.start.y) * tailProg;
          const x2 = ph.start.x + (ph.end.x - ph.start.x) * prog;
          const y2 = ph.start.y + (ph.end.y - ph.start.y) * prog;
          const fade = Math.sin(prog * Math.PI) * irr;

          ph.streak.setAttribute("x1", x1.toFixed(1));
          ph.streak.setAttribute("y1", y1.toFixed(1));
          ph.streak.setAttribute("x2", x2.toFixed(1));
          ph.streak.setAttribute("y2", y2.toFixed(1));
          ph.streak.setAttribute("opacity", (fade * 0.85).toFixed(2));

          ph.head.setAttribute("cx", x2.toFixed(1));
          ph.head.setAttribute("cy", y2.toFixed(1));
          ph.head.setAttribute("opacity", (fade * 0.95).toFixed(2));
        }

        // Expanding photovoltaic charge ripples on silicon wafers
        for (let i = 0; i < anim.pvRipples.length; i++) {
          const rp = anim.pvRipples[i];
          const prog = (rp.offset + t * 0.44 * speedScale) % 1;
          const rx = 8 + prog * 34;
          const ry = 4.5 + prog * 19;
          const alpha = (1 - prog) * Math.min(1, prog * 5) * irr * 0.72;
          rp.el.setAttribute("rx", rx.toFixed(1));
          rp.el.setAttribute("ry", ry.toFixed(1));
          rp.el.setAttribute("opacity", alpha.toFixed(2));
        }

        // ----- B. JUNCTION BOX AMBER DC PULSES -----
        for (let i = 0; i < anim.jboxPulses.length; i++) {
          const jp = anim.jboxPulses[i];
          const pathEl = anim.guidePaths[jp.pathKey];
          const len = guideLengths[jp.pathKey] || 1;
          const prog = (jp.offset + state.flowDist * 1.1) % 1;
          const pt = pathEl.getPointAtLength(prog * len);
          jp.el.setAttribute("cx", pt.x.toFixed(1));
          jp.el.setAttribute("cy", pt.y.toFixed(1));
          jp.el.setAttribute("opacity", (Math.sin(prog * Math.PI) * irr * 0.96).toFixed(2));
        }

        // ----- C. DC BUS COPPER BAR PULSES & CAPACITOR RIPPLE GLOW -----
        for (let i = 0; i < anim.dcBusPulses.length; i++) {
          const dp = anim.dcBusPulses[i];
          const pathEl = anim.guidePaths[dp.pathKey];
          const len = guideLengths[dp.pathKey] || 1;
          const prog = (dp.offset + state.flowDist * 0.95) % 1;
          const pt = pathEl.getPointAtLength(prog * len);
          dp.el.setAttribute("cx", pt.x.toFixed(1));
          dp.el.setAttribute("cy", pt.y.toFixed(1));
          dp.el.setAttribute("opacity", (Math.sin(prog * Math.PI) * irr * 0.98).toFixed(2));
        }

        for (let i = 0; i < anim.dcCapRings.length; i++) {
          const cr = anim.dcCapRings[i];
          const pulse = 0.5 + 0.5 * Math.sin(t * 4.2 - cr.phase);
          cr.el.setAttribute("opacity", (pulse * irr * 0.58).toFixed(2));
        }

        // ----- D. IGBT HIGH-FREQUENCY PWM SWITCHING & HEATSINK CONVECTIVE SHIMMER -----
        const pwmFreq = 11.5 * speedScale;
        for (let i = 0; i < anim.igbtFlashes.length; i++) {
          const fl = anim.igbtFlashes[i];
          // Alternating PWM carrier pulses across the 4 modules
          const wave = Math.sin(t * pwmFreq + fl.index * (Math.PI * 0.5));
          const duty = Math.pow(Math.max(0, wave), 2.2);
          fl.el.setAttribute("opacity", ((0.12 + duty * 0.86) * irr).toFixed(2));
        }

        for (let i = 0; i < anim.igbtLeadPulses.length; i++) {
          const lp = anim.igbtLeadPulses[i];
          const prog = (lp.offset + state.flowDist * 1.65) % 1;
          const pt = lp.pathEl.getPointAtLength(prog * lp.len);
          lp.el.setAttribute("cx", pt.x.toFixed(1));
          lp.el.setAttribute("cy", pt.y.toFixed(1));
          lp.el.setAttribute("opacity", (Math.sin(prog * Math.PI) * irr * 0.95).toFixed(2));
        }

        // Rising wavy heat shimmer above aluminum heatsink fins
        for (let i = 0; i < anim.heatWaves.length; i++) {
          const hw = anim.heatWaves[i];
          const prog = (hw.offset + t * 0.38 * speedScale) % 1;
          const yBot = hw.by - prog * 30;
          const yTop = yBot - 22;
          const sway1 = Math.sin(t * 5.2 + i * 1.4) * 4.5;
          const sway2 = Math.cos(t * 4.6 + i * 1.7) * 4.5;
          hw.el.setAttribute(
            "d",
            `M ${hw.bx.toFixed(1)} ${yBot.toFixed(1)} C ${(hw.bx + sway1).toFixed(1)} ${(yBot - 7).toFixed(1)} ${(hw.bx - sway2).toFixed(1)} ${(yBot - 15).toFixed(1)} ${hw.bx.toFixed(1)} ${yTop.toFixed(1)}`
          );
          hw.el.setAttribute("opacity", (Math.sin(prog * Math.PI) * irr * 0.34).toFixed(2));
        }

        // ----- E. AC FILTER SINUSOIDAL WAVE & EMERALD-CYAN OUTPUT PULSES -----
        // Build smooth traveling 3D-projected sine wave above the AC filter traces
        const samples = 28;
        const pts1 = [];
        const pts2 = [];
        for (let s = 0; s <= samples; s++) {
          const frac = s / samples;
          const wy = 508 + frac * 156;
          const wx = 532 + frac * 42;
          const amp = (9.5 * irr + 1.5) * Math.sin(frac * Math.PI);
          const wz1 = 30 + Math.sin(frac * Math.PI * 4.5 - state.acPhase) * amp;
          const wz2 = 30 + Math.sin(frac * Math.PI * 4.5 - state.acPhase + 2.09) * amp * 0.72;
          const p1 = iso(wx, wy, wz1);
          const p2 = iso(wx - 10, wy, wz2);
          pts1.push(`${s === 0 ? "M" : "L"} ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`);
          pts2.push(`${s === 0 ? "M" : "L"} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`);
        }
        anim.acWavePaths[0].setAttribute("d", pts1.join(" "));
        anim.acWavePaths[0].setAttribute("opacity", (0.2 + irr * 0.75).toFixed(2));
        anim.acWavePaths[1].setAttribute("d", pts2.join(" "));
        anim.acWavePaths[1].setAttribute("opacity", (0.14 + irr * 0.55).toFixed(2));

        // Toroidal choke subtle magnetic breathing
        anim.toroidGlows.forEach((g, idx) => {
          const breathe = 0.5 + 0.5 * Math.sin(state.acPhase * 0.8 + idx * 1.57);
          g.setAttribute("opacity", ((0.1 + breathe * 0.28) * irr).toFixed(2));
        });

        // Emerald-cyan AC pulses traveling cleanly into the 3-pole AC grid terminal block
        for (let i = 0; i < anim.acPulses.length; i++) {
          const ap = anim.acPulses[i];
          const pathEl = anim.guidePaths[ap.pathKey];
          const len = guideLengths[ap.pathKey] || 1;
          const prog = (ap.offset + state.flowDist * 1.15) % 1;
          const pt = pathEl.getPointAtLength(prog * len);
          ap.el.setAttribute("cx", pt.x.toFixed(1));
          ap.el.setAttribute("cy", pt.y.toFixed(1));
          ap.el.setAttribute("opacity", (Math.sin(prog * Math.PI) * irr * 0.96).toFixed(2));
        }
      }

      /* =========================================================================
         15. 60 FPS ANIMATION LOOP (CLAMPED DELTA-TIME)
         ========================================================================= */
      let lastTs = performance.now();

      function animateLoop(now) {
        const dt = Math.min((now - lastTs) / 1000, 0.05);
        lastTs = now;
        updatePhysics(dt);
        window.requestAnimationFrame(animateLoop);
      }

      /* =========================================================================
         16. FULL window.MirvoScene API & postMessage INTEGRATION BRIDGE
         ========================================================================= */
      const MirvoScene = {
        deviceId: DEVICE_ID,
        parts: PARTS.map((p) => ({
          id: p.id,
          nameUz: p.nameUz,
          focusTarget: { ...p.focusTarget }
        })),

        focus(target) {
          try {
            applyCamera(target === null || target === undefined ? "full" : target);
          } catch (err) {
            console.error("MirvoScene.focus error:", err);
          }
        },

        highlight(partId) {
          try {
            applyHighlight(partId ?? null);
          } catch (err) {
            console.error("MirvoScene.highlight error:", err);
          }
        },

        setStep(index) {
          try {
            const idx = Math.max(0, Math.min(TOUR_SEQUENCE.length - 1, Math.round(Number(index) || 0)));
            stopAutoTour();
            state.tourIndex = idx;
            const target = TOUR_SEQUENCE[idx];
            if (target === "full") {
              applyCamera("full");
              applyHighlight(null);
            } else {
              applyCamera(target);
              applyHighlight(target);
            }
          } catch (err) {
            console.error("MirvoScene.setStep error:", err);
          }
        },

        setAutoTour(enabled) {
          try {
            if (Boolean(enabled)) {
              startAutoTour(false);
            } else {
              stopAutoTour();
            }
          } catch (err) {
            console.error("MirvoScene.setAutoTour error:", err);
          }
        },

        setExploded(amount) {
          try {
            const clamped = Math.max(0, Math.min(1, Number(amount) || 0));
            state.explodeTarget = clamped;
          } catch (err) {
            console.error("MirvoScene.setExploded error:", err);
          }
        },

        setPhase(mode) {
          try {
            if (mode === "auto" || mode === "peak_sun" || mode === "low_sun" || mode === "standby") {
              state.phaseMode = mode;
            }
          } catch (err) {
            console.error("MirvoScene.setPhase error:", err);
          }
        },

        setPlaying(playing) {
          try {
            state.playing = Boolean(playing);
          } catch (err) {
            console.error("MirvoScene.setPlaying error:", err);
          }
        },

        reset() {
          try {
            state.explodeTarget = 0;
            state.phaseMode = "auto";
            state.playing = true;
            startAutoTour(true);
          } catch (err) {
            console.error("MirvoScene.reset error:", err);
          }
        }
      };

      window.MirvoScene = MirvoScene;

      window.addEventListener("message", (event) => {
        try {
          const msg = event && event.data;
          if (!msg || typeof msg !== "object" || typeof msg.type !== "string") return;

          switch (msg.type) {
            case "FOCUS":
              stopAutoTour();
              MirvoScene.focus(msg.target);
              break;
            case "HIGHLIGHT":
              MirvoScene.highlight(msg.partId ?? null);
              break;
            case "SET_STEP":
              MirvoScene.setStep(msg.index);
              break;
            case "SET_AUTO_TOUR":
              MirvoScene.setAutoTour(msg.enabled);
              break;
            case "EXPLODE":
              MirvoScene.setExploded(msg.amount);
              break;
            case "SET_PHASE":
              MirvoScene.setPhase(msg.mode);
              break;
            case "SET_PLAYING":
              MirvoScene.setPlaying(msg.playing);
              break;
            case "RESET":
              MirvoScene.reset();
              break;
            default:
              break;
          }
        } catch (err) {
          console.error("postMessage handler error:", err);
        }
      });

      /* =========================================================================
         17. USER INTERACTIONS (CLICK-TO-ASK, RESET, EXPLODED VIEW, KEYBOARD)
         ========================================================================= */
      function emitPartClick(partId) {
        const meta = PART_MAP[partId];
        if (!meta) return;
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage(
              {
                type: "PART_CLICK",
                deviceId: DEVICE_ID,
                partId: meta.id,
                nameUz: meta.nameUz
              },
              "*"
            );
          }
        } catch (err) {
          console.error("PART_CLICK postMessage error:", err);
        }
      }

      svgRoot.addEventListener("click", (e) => {
        const partGroup = e.target.closest(".mirvo-part");
        const partId = partGroup ? partGroup.getAttribute("data-part") : null;

        if (partId && PART_MAP[partId]) {
          stopAutoTour();
          const idx = TOUR_SEQUENCE.indexOf(partId);
          if (idx !== -1) state.tourIndex = idx;
          applyCamera(partId);
          applyHighlight(partId);
          emitPartClick(partId);
        } else {
          MirvoScene.reset();
        }
      });

      viewportEl.addEventListener("click", (e) => {
        if (e.target === viewportEl || e.target === stageEl) {
          MirvoScene.reset();
        }
      });

      // Double-click anywhere smoothly toggles Exploded View
      viewportEl.addEventListener("dblclick", (e) => {
        e.preventDefault();
        MirvoScene.setExploded(state.explodeTarget > 0.5 ? 0 : 1);
      });

      // Keyboard shortcuts: R / Escape -> Reset, E -> Toggle Exploded View
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape" || e.key === "r" || e.key === "R") {
          MirvoScene.reset();
        } else if (e.key === "e" || e.key === "E") {
          MirvoScene.setExploded(state.explodeTarget > 0.5 ? 0 : 1);
        }
      });

      /* =========================================================================
         18. INITIALIZE GEOMETRY & START 60 FPS ENGINE ON LOAD
         ========================================================================= */
      window.addEventListener("load", () => {
        try {
          buildHousingBack();
          buildPvCells();
          buildJunctionBox();
          buildAcFilter();
          buildDcBus();
          buildIgbtInverter();
          buildHousingFront();
          cacheGuidePathLengths();

          applyCamera("full");
          applyHighlight(null);
          startAutoTour(true);

          lastTs = performance.now();
          window.requestAnimationFrame(animateLoop);
        } catch (err) {
          console.error("Scene bootstrap error:", err);
        }
      });
    })();
  </script>
</body>
</html>
