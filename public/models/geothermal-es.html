<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Geotermal elektr stansiya — Binary-Cycle Cutaway</title>
  <style>
    /* =========================================================================
       MIRVO AI — ZERO-UI PURE WHITE CANVAS & SEQUENTIAL SPOTLIGHT ARCHITECTURE
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
    }

    .mirvo-viewport {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      display: grid;
      place-items: center;
      cursor: default;
    }

    .mirvo-stage {
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      transform-origin: 50% 50%;
      transition: transform 0.95s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      display: block;
    }

    #geothermal-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* Interactive anatomy groups & geological housing transitions */
    .mirvo-part,
    .mirvo-housing {
      transition:
        opacity 0.48s cubic-bezier(0.22, 1, 0.36, 1),
        filter 0.48s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, filter;
    }

    .mirvo-part {
      cursor: pointer;
    }

    .mirvo-housing {
      cursor: default;
    }

    /* Spotlight dimming for non-focused assemblies */
    .mirvo-part.is-dimmed,
    .mirvo-housing.is-dimmed {
      opacity: 0.22;
      filter: blur(1.2px) saturate(0.45);
    }

    /* Crisp spotlight lift for the active focused assembly */
    .mirvo-part.is-focused {
      opacity: 1;
      filter: drop-shadow(0 6px 16px rgba(2, 132, 199, 0.22));
    }

    /* Accessibility: disable stage zoom transitions under reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .mirvo-stage {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

          <linearGradient id="grad-drum-blue" x1="18%" y1="0%" x2="82%" y2="100%">

          </linearGradient>

          <!-- Emerald-to-cerulean condensation transition inside radiator fins -->
          <linearGradient id="grad-condense-band" x1="100%" y1="0%" x2="0%" y2="100%">

          <!-- Dark-slate insulated casing -->

        </defs>

        <!-- =================================================================
             EXACT PAINTER'S ORDER LAYER STACK (BACK -> FRONT)
             Each group wraps an inner `.mirvo-explode-wrap` so JS exploded
             offsets never collide with CSS spotlight opacity/filter effects.
             ================================================================= -->

        <!-- 0A. Back geological base plinth, strata & carved bore trenches -->
        <g id="part-housing-back" class="mirvo-housing" data-part="housing">
          <g class="mirvo-explode-wrap" data-explode="housing_back"></g>
        </g>

        <!-- 3. Upper-right axial organic turbine + coaxial copper generator -->
        <g id="part-organic_turbine" class="mirvo-part" data-part="organic_turbine">

        </g>

        <!-- 5. Far-right cooled brine reinjection well descending into rock -->
        <g id="part-injection_well" class="mirvo-part" data-part="injection_well">
          <g class="mirvo-explode-wrap" data-explode="injection_well"></g>
        </g>

        <!-- 2. Center-left horizontal shell-and-tube binary heat exchanger -->
        <g id="part-heat_exchanger" class="mirvo-part" data-part="heat_exchanger">
          <g class="mirvo-explode-wrap" data-explode="heat_exchanger"></g>
        </g>

        <!-- 4. Front-center-right finned aluminum condenser & blue drum/pump -->
        <g id="part-condenser" class="mirvo-part" data-part="condenser">
          <g class="mirvo-explode-wrap" data-explode="condenser"></g>
        </g>

        <!-- 1. Left deep hot brine production well, riser, handwheel & arch -->
        <g id="part-production_well" class="mirvo-part" data-part="production_well">
          <g class="mirvo-explode-wrap" data-explode="production_well"></g>
        </g>

        <!-- 0B. Front geological rim lip details framing well entry edges -->
        <g id="part-housing-front" class="mirvo-housing" data-part="housing">
          <g class="mirvo-explode-wrap" data-explode="housing_front"></g>
        </g>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      /* =====================================================================
         1. DEVICE METADATA, ISOMETRIC PROJECTION & TECHNICAL STYLING CONSTANTS
         ===================================================================== */
      const DEVICE_ID = "geothermal_plant";

      const PART_NAMES_UZ = {
        production_well: "Issiq geotermal suv qazib olish qudug‘i",
        heat_exchanger: "Issiqlik almashinuvchisi (ikkilamchi bug‘latkich)",
        organic_turbine: "Organik ishchi jism turbinasi va generatori",
        condenser: "Kondensator (sovutish va kondensatsiya bloki)",
        injection_well: "Sovigan suvni yerga qaytarish (injeksiya) qudug‘i"
      };

      const TOUR_SEQUENCE = [
        "full",
        "production_well",
        "heat_exchanger",
        "organic_turbine",
        "condenser",
        "injection_well"
      ];

      // Clean 30-degree isometric separation offsets for Exploded View (amount 0..1)
      const EXPLODE_VECTORS = {
        housing_back: [0, 32],
        housing_front: [0, 32],
        production_well: [-78, -26],
        heat_exchanger: [-28, -56],
        organic_turbine: [38, -74],
        condenser: [48, 22],
        injection_well: [82, 18]
      };

      const INK = "#222933";
      const SVG_NS = "http://www.w3.org/2000/svg";

      // 30-degree isometric basis:
      // +u -> down-right (+cos30, +sin30) : heat exchanger axis & front-left rock wall
      // +v -> up-right   (+cos30, -sin30) : turbine/generator axis, condenser fins & front-right rock wall
      // +z -> straight up (0, -1)
      const COS30 = Math.cos(Math.PI / 6); // 0.8660254
      const SIN30 = 0.5;
      const SCALE = 48.0;
      const ORIGIN_X = 240.0;
      const ORIGIN_Y = 374.0;

      /**
       * Projects a 3D isometric coordinate (u, v, z) into 2D SVG viewport space.
       */
      function iso(u, v, z) {
        const sx = ORIGIN_X + (u + v) * COS30 * SCALE;
        const sy = ORIGIN_Y + (u - v) * SIN30 * SCALE - z * SCALE;
        return [sx, sy];
      }

      /**
       * Formats an array of 3D or 2D coordinates into an SVG polygon points string.
       */
      function pts(list) {
        return list
          .map(function (p) {
            const c = p.length === 3 ? iso(p[0], p[1], p[2]) : p;
            return c[0].toFixed(1) + "," + c[1].toFixed(1);
          })
          .join(" ");
      }

      /**
       * Creates an SVG element with attributes and appends it to parent.
       */
      function el(tag, attrs, parent) {
        const node = document.createElementNS(SVG_NS, tag);
        if (attrs) {
          for (const k in attrs) {
            if (Object.prototype.hasOwnProperty.call(attrs, k) && attrs[k] !== undefined && attrs[k] !== null) {
              node.setAttribute(k, String(attrs[k]));
            }
          }
        }
        if (parent) parent.appendChild(node);
        return node;
      }

      /**
       * Renders a crisp technical polygon from 3D coordinates with non-scaling stroke.
       */
      function isoPoly(parent, coords, fill, stroke, sw, extra) {
        const attrs = Object.assign(
          {
            points: pts(coords),
            fill: fill,
            stroke: stroke === undefined ? INK : stroke,
            "stroke-width": sw === undefined ? 1.3 : sw,
            "stroke-linejoin": "round",
            "stroke-linecap": "round",
            "vector-effect": "non-scaling-stroke"
          },
          extra || {}
        );
        return el("polygon", attrs, parent);
      }

      /**
       * Renders an isometric axis-aligned box [u0..u1, v0..v1, z0..z1].
       * Visible outer faces: front-left (v = v0), front-right (u = u1), top (z = z1).
       */
      function isoBox(parent, u0, v0, z0, u1, v1, z1, colors, opts) {
        const o = opts || {};
        const sw = o.sw !== undefined ? o.sw : 1.25;
        const stroke = o.stroke !== undefined ? o.stroke : INK;
        const g = el("g", o.groupAttrs || null, parent);

        if (o.left !== false) {
          isoPoly(
            g,
            [
              [u0, v0, z0],
              [u1, v0, z0],
              [u1, v0, z1],
              [u0, v0, z1]
            ],
            colors.left,
            stroke,
            sw
          );
        }
        if (o.right !== false) {
          isoPoly(
            g,
            [
              [u1, v0, z0],
              [u1, v1, z0],
              [u1, v1, z1],
              [u1, v0, z1]
            ],
            colors.right,
            stroke,
            sw
          );
        }
        if (o.top !== false) {
          isoPoly(
            g,
            [
              [u0, v0, z1],
              [u1, v0, z1],
              [u1, v1, z1],
              [u0, v1, z1]
            ],
            colors.top,
            stroke,
            sw
          );
        }
        return g;
      }

      /**
       * Renders a vertical isometric cylinder centered at (cu, cv) from z0 to z1.
       * Supports optional front angular cutaway (`cutOpen = true`) for well bores.
       */
      function isoCylZ(parent, cu, cv, z0, z1, r, colors, opts) {
        const o = opts || {};
        const sw = o.sw !== undefined ? o.sw : 1.25;
        const g = el("g", null, parent);
        const steps = 22;

        // Visible silhouette angles for vertical cylinder in (+u down-right, +v up-right):
        // Left silhouette: du + dv = -1, du - dv = 0 => du = -1, dv = +1 => angle = 3pi/4 (135 deg)
        // Right silhouette: du = +1, dv = -1 => angle = -pi/4 (-45 deg)
        // Front center faces (+u, -v) -> wait: front-left is -v, front-right is +u, so front center is angle = -pi/4?
        // Let's verify screen X of (cos a, sin a): X = (cos a + sin a)*COS30.
        // Extreme left X: cos a + sin a = -sqrt(2) => a = -3pi/4 (225 deg).
        // Extreme right X: cos a + sin a = +sqrt(2) => a = +pi/4 (45 deg).
        // Front center (max screen Y = (cos a - sin a)*SIN30): cos a - sin a = +sqrt(2) => a = -pi/4 (-45 deg)!
        // Awesome! So the visible front half sweeps from aStart = -3pi/4 (left) through -pi/4 (front) to aEnd = +pi/4 (right)!
        const aStart = -(3 * Math.PI) / 4;
        const aEnd = Math.PI / 4;

        const body = [];
        for (let i = 0; i <= steps; i++) {
          const a = aStart + (aEnd - aStart) * (i / steps);
          body.push([cu + r * Math.cos(a), cv + r * Math.sin(a), z0]);
        }
        for (let i = steps; i >= 0; i--) {
          const a = aStart + (aEnd - aStart) * (i / steps);
          body.push([cu + r * Math.cos(a), cv + r * Math.sin(a), z1]);
        }
        isoPoly(g, body, colors.side, INK, sw);

        if (colors.shade) {
          const shade = [];
          const aMid = -Math.PI / 6;
          for (let i = 0; i <= 10; i++) {
            const a = aMid + (aEnd - aMid) * (i / 10);
            shade.push([cu + r * Math.cos(a), cv + r * Math.sin(a), z0]);
          }
          for (let i = 10; i >= 0; i--) {
            const a = aMid + (aEnd - aMid) * (i / 10);
            shade.push([cu + r * Math.cos(a), cv + r * Math.sin(a), z1]);
          }
          isoPoly(g, shade, colors.shade, "none", 0, { opacity: 0.45 });
        }

        if (o.top !== false) {
          const topRing = [];
          for (let i = 0; i < 28; i++) {
            const a = (i / 28) * Math.PI * 2;
            topRing.push([cu + r * Math.cos(a), cv + r * Math.sin(a), z1]);
          }
          isoPoly(g, topRing, colors.top, INK, sw);
        }
        return g;
      }

      /**
       * Renders a horizontal isometric cylinder aligned along the +u axis (down-right).
       * Cross-section lies in the (v, z) plane. Front cap sits at u = u1.
       */
      function isoCylU(parent, u0, u1, cv, cz, r, colors, opts) {
        const o = opts || {};
        const sw = o.sw !== undefined ? o.sw : 1.25;
        const g = el("g", null, parent);
        const steps = 22;
        // Cross-section point: (u, cv + r*cos(a), cz + r*sin(a))
        // Axis direction in screen space: (COS30, SIN30).
        // Perpendicular screen normal: (-SIN30, COS30).
        // Projection onto normal: (r*cos a)*(-COS30*SIN30 - SIN30*COS30) + (r*sin a)*(-COS30)
        // = -r*COS30 * (cos a * 1 + sin a * 1) -> extremes at a = 3pi/4 (upper-right) and -pi/4 (lower-left).
        const aTop = (2 * Math.PI) / 3;  // upper-back silhouette
        const aBot = -Math.PI / 3;       // lower-front silhouette

        const body = [];
        for (let i = 0; i <= steps; i++) {
          const a = aTop + (aBot - aTop) * (i / steps);
          body.push([u0, cv + r * Math.cos(a), cz + r * Math.sin(a)]);
        }
        for (let i = steps; i >= 0; i--) {
          const a = aTop + (aBot - aTop) * (i / steps);
          body.push([u1, cv + r * Math.cos(a), cz + r * Math.sin(a)]);
        }
        isoPoly(g, body, colors.side, INK, sw);

        if (o.cap !== false) {
          const cap = [];
          for (let i = 0; i < 28; i++) {
            const a = (i / 28) * Math.PI * 2;
            cap.push([u1, cv + r * Math.cos(a), cz + r * Math.sin(a)]);
          }
          isoPoly(g, cap, colors.cap, INK, sw);
        }
        return g;
      }

      /**
       * Renders a horizontal isometric cylinder aligned along the +v axis (up-right).
       * Cross-section lies in the (u, z) plane. Front-facing cap sits at v = v0!
       */
      function isoCylV(parent, cu, v0, v1, cz, r, colors, opts) {
        const o = opts || {};
        const sw = o.sw !== undefined ? o.sw : 1.25;
        const g = el("g", null, parent);
        const steps = 22;
        // Cross-section point: (cu + r*cos a, v, cz + r*sin a)
        // Axis direction (+v) in screen space: (COS30, -SIN30).
        // Extreme silhouettes perpendicular to axis:
        const aTop = Math.PI / 3;         // upper-left silhouette
        const aBot = -(2 * Math.PI) / 3;  // lower-right silhouette

        const body = [];
        for (let i = 0; i <= steps; i++) {
          const a = aTop + (aBot - aTop) * (i / steps);
          body.push([cu + r * Math.cos(a), v1, cz + r * Math.sin(a)]);
        }
        for (let i = steps; i >= 0; i--) {
          const a = aTop + (aBot - aTop) * (i / steps);
          body.push([cu + r * Math.cos(a), v0, cz + r * Math.sin(a)]);
        }
        isoPoly(g, body, colors.side, INK, sw);

        if (o.cap !== false) {
          const cap = [];
          for (let i = 0; i < 28; i++) {
            const a = (i / 28) * Math.PI * 2;
            cap.push([cu + r * Math.cos(a), v0, cz + r * Math.sin(a)]);
          }
          isoPoly(g, cap, colors.cap, INK, sw);
        }
        return g;
      }

      /**
       * Generates a smooth rounded-corner SVG path string from 3D isometric points.
       */
      function buildRoundedPath3D(points3D, cornerRadiusPx) {
        const p2 = points3D.map(function (p) {
          return iso(p[0], p[1], p[2]);
        });
        if (p2.length < 2) return "";
        if (p2.length === 2 || !cornerRadiusPx) {
          return (
            "M " +
            p2
              .map(function (c) {
                return c[0].toFixed(1) + " " + c[1].toFixed(1);
              })
              .join(" L ")
          );
        }

        let d = "M " + p2[0][0].toFixed(1) + " " + p2[0][1].toFixed(1);
        for (let i = 1; i < p2.length - 1; i++) {
          const prev = p2[i - 1];
          const curr = p2[i];
          const next = p2[i + 1];

          const v1x = prev[0] - curr[0];
          const v1y = prev[1] - curr[1];
          const len1 = Math.hypot(v1x, v1y) || 1;

          const v2x = next[0] - curr[0];
          const v2y = next[1] - curr[1];
          const len2 = Math.hypot(v2x, v2y) || 1;

          const r = Math.min(cornerRadiusPx, len1 * 0.44, len2 * 0.44);
          const a1x = curr[0] + (v1x / len1) * r;
          const a1y = curr[1] + (v1y / len1) * r;
          const a2x = curr[0] + (v2x / len2) * r;
          const a2y = curr[1] + (v2y / len2) * r;

          d +=
            " L " +
            a1x.toFixed(1) +
            " " +
            a1y.toFixed(1) +
            " Q " +
            curr[0].toFixed(1) +
            " " +
            curr[1].toFixed(1) +
            " " +
            a2x.toFixed(1) +
            " " +
            a2y.toFixed(1);
        }
        const last = p2[p2.length - 1];
        d += " L " + last[0].toFixed(1) + " " + last[1].toFixed(1);
        return d;
      }

      /**
       * Renders a shaded multi-tone cylindrical cutaway pipe along a 3D polyline.
       */
      function isoTube(parent, points3D, diameterPx, colors, cornerRadiusPx) {
        const d = buildRoundedPath3D(points3D, cornerRadiusPx !== undefined ? cornerRadiusPx : 16);
        const g = el("g", null, parent);

        // Dark-slate silhouette border
        el(
          "path",
          {
            d: d,
            fill: "none",
            stroke: INK,
            "stroke-width": diameterPx + 3.0,
            "stroke-linecap": "round",
            "stroke-linejoin": "round"
          },
          g
        );
        // Outer casing / wall shadow tone
        el(
          "path",
          {
            d: d,
            fill: "none",
            stroke: colors.outer || colors.dark,
            "stroke-width": diameterPx,
            "stroke-linecap": "round",
            "stroke-linejoin": "round"
          },
          g
        );
        // Inner fluid core tone
        el(
          "path",
          {
            d: d,
            fill: "none",
            stroke: colors.mid,
            "stroke-width": diameterPx * 0.68,
            "stroke-linecap": "round",
            "stroke-linejoin": "round"
          },
          g
        );
        // Crisp bright specular highlight shifted toward light source
        el(
          "path",
          {
            d: d,
            fill: "none",
            stroke: colors.light,
            "stroke-width": diameterPx * 0.24,
            "stroke-linecap": "round",
            "stroke-linejoin": "round",
            opacity: 0.86,
            transform: "translate(-1.8, -1.8)"
          },
          g
        );
        return { group: g, d: d };
      }

      /* =====================================================================
         2. 60 FPS LIVE PHYSICS ANIMATION REGISTRIES
         ===================================================================== */
      const animStreamPaths = [];     // Animated glowing fluid dash paths
      const animChevrons = [];        // Directional flow chevrons tracking exact SVG paths
      const animBubbles = [];         // Boiling vapor & thermal buoyancy bubbles
      const animTurbineWheel = {      // Dynamic 3D isometric spinning rotor wheel
        group: null,
        cu: 7.45,
        cv: 7.72,
        cz: 1.92,
        rHub: 0.28,
        rTip: 0.86,
        bladeCount: 16,
        angle: 0
      };
      const animGenPulses = [];       // Electromagnetic induction pulses on copper windings
      const animFinShimmers = [];     // Thermal cooling shimmer bars on condenser radiator
      const animPumpRotor = { el: null, cx: 0, cy: 0, angle: 0 };
      const animThermalAuras = [];    // Subtle breathing geothermal & chilled reservoir glows

      /**
       * Registers an animated fluid streamline + smooth directional chevrons along `pathD`.
       */
      function registerFlowStream(parent, pathD, opts) {
        const o = opts || {};
        const dashEl = el(
          "path",
          {
            d: pathD,
            fill: "none",
            stroke: o.dashColor || "#FEF3C7",
            "stroke-width": o.dashWidth || 3.2,
            "stroke-linecap": "round",
            "stroke-linejoin": "round",
            "stroke-dasharray": o.dashArray || "12 24",
            opacity: o.opacity !== undefined ? o.opacity : 0.88,
            filter: "url(#fluid-glow)"
          },
          parent
        );

        animStreamPaths.push({
          el: dashEl,
          speed: o.speed || 42,
          dir: o.dir || 1,
          offset: Math.random() * 36,
          channel: o.channel || "brine" // "brine" | "vapor" | "cool"
        });

        const arrowCount = o.arrows || 0;
        if (arrowCount > 0) {
          const totalLen = dashEl.getTotalLength();
          const sz = o.arrowSize || 6.5;
          for (let i = 0; i < arrowCount; i++) {
            const chev = el(
              "path",
              {
                d:
                  "M " +
                  (-sz * 0.9).toFixed(1) +
                  " " +
                  (-sz * 0.72).toFixed(1) +
                  " L " +
                  (sz * 0.55).toFixed(1) +
                  " 0 L " +
                  (-sz * 0.9).toFixed(1) +
                  " " +
                  (sz * 0.72).toFixed(1),
                fill: "none",
                stroke: o.arrowColor || "#FEF08A",
                "stroke-width": o.arrowStroke || 2.3,
                "stroke-linecap": "round",
                "stroke-linejoin": "round",
                filter: "url(#fluid-glow)"
              },
              parent
            );
            animChevrons.push({
              el: chev,
              pathEl: dashEl,
              length: totalLen,
              t: (i + 0.35) / arrowCount,
              speed: (o.arrowSpeed || 0.24) * (o.dir || 1),
              channel: o.channel || "brine"
            });
          }
        }
      }

      /* =====================================================================
         3. LAYER WRAPPER REFERENCES
         ===================================================================== */
      const wHousingBack = document.querySelector('[data-explode="housing_back"]');
      const wHousingFront = document.querySelector('[data-explode="housing_front"]');
      const wProdWell = document.querySelector('[data-explode="production_well"]');
      const wHeatEx = document.querySelector('[data-explode="heat_exchanger"]');
      const wTurbine = document.querySelector('[data-explode="organic_turbine"]');
      const wCondenser = document.querySelector('[data-explode="condenser"]');
      const wInjWell = document.querySelector('[data-explode="injection_well"]');

      // Platform dimensional envelope matching reference chamfered silhouette
      const U_MAX = 14.55;
      const V_MAX = 12.25;
      const SLAB_THICK = 0.24;
      const ROCK_BOTTOM = -2.68;

      // Exact well center coordinates on the front cutaway walls
      const PROD_U = 2.68;
      const PROD_V = 0.14;
      const INJ_U = U_MAX - 0.14;
      const INJ_V = 8.42;

      /* ---------------------------------------------------------------------
         3.0A. HOUSING BACK: Grounded Shadow, Chamfered Slab & Geological Strata
         --------------------------------------------------------------------- */
      function buildHousingBack() {
        // Soft grounded elliptical contact shadow on pure #FFFFFF
        const shadowBase = [
          [-0.55, -0.45, ROCK_BOTTOM - 0.16],
          [U_MAX + 0.55, -0.45, ROCK_BOTTOM - 0.16],
          [U_MAX + 0.55, V_MAX + 0.45, ROCK_BOTTOM - 0.16],
          [3.60, V_MAX + 0.45, ROCK_BOTTOM - 0.16],
          [-0.55, 6.20, ROCK_BOTTOM - 0.16]
        ];
        isoPoly(wHousingBack, shadowBase, "rgba(15, 23, 42, 0.14)", "none", 0, {
          filter: "url(#ground-shadow)"
        });

        // Tighter contact rim shadow immediately beneath base
        isoPoly(
          wHousingBack,
          [
            [-0.18, -0.18, ROCK_BOTTOM - 0.08],
            [U_MAX + 0.18, -0.18, ROCK_BOTTOM - 0.08],
            [U_MAX + 0.18, V_MAX + 0.18, ROCK_BOTTOM - 0.08],
            [3.90, V_MAX + 0.18, ROCK_BOTTOM - 0.08],
            [-0.18, 6.20, ROCK_BOTTOM - 0.08]
          ],
          "rgba(15, 23, 42, 0.16)",
          "none",
          0,
          { filter: "url(#ground-shadow)" }
        );

        // --- FRONT-LEFT GEOLOGICAL CUTAWAY WALL (v = 0, u = 0..U_MAX) ---
        // Build 4 smooth wavy sedimentary strata layers matching warm terracotta/ochre tones
        const leftStrataColors = ["#E5A965", "#D4884E", "#BE6B3F", "#9F5333"];
        const leftStrataDepths = [
          -SLAB_THICK,
          -0.88,
          -1.46,
          -2.08,
          ROCK_BOTTOM
        ];
        const leftSamples = 26;

        function waveLeft(layerIdx, u) {
          if (layerIdx === 0) return -SLAB_THICK;
          if (layerIdx === 4) return ROCK_BOTTOM;
          const base = leftStrataDepths[layerIdx];
          return (
            base +
            0.13 * Math.sin(u * 0.48 + layerIdx * 1.15) +
            0.06 * Math.cos(u * 1.05 - layerIdx * 0.8)
          );
        }

        for (let s = 0; s < 4; s++) {
          const polyPts = [];
          for (let i = 0; i <= leftSamples; i++) {
            const u = (U_MAX * i) / leftSamples;
            polyPts.push([u, 0, waveLeft(s, u)]);
          }
          for (let i = leftSamples; i >= 0; i--) {
            const u = (U_MAX * i) / leftSamples;
            polyPts.push([u, 0, waveLeft(s + 1, u)]);
          }
          isoPoly(wHousingBack, polyPts, leftStrataColors[s], "#6D3A1F", 0.85);
        }

        // Warm geothermal radiant heat aura glowing inside rock around left production well
        const hotAuraPos = iso(PROD_U + 0.55, 0, -1.65);
        const hotAura = el(
          "ellipse",
          {
            cx: hotAuraPos[0].toFixed(1),
            cy: hotAuraPos[1].toFixed(1),
            rx: 138,
            ry: 112,
            fill: "url(#grad-geo-heat)",
            opacity: 0.86
          },
          wHousingBack
        );
        animThermalAuras.push({ el: hotAura, baseOp: 0.84, amp: 0.14, channel: "brine", phase: 0 });

        // Crisp dark outline framing front-left geological cutaway face
        isoPoly(
          wHousingBack,
          [
            [0, 0, -SLAB_THICK],
            [U_MAX, 0, -SLAB_THICK],
            [U_MAX, 0, ROCK_BOTTOM],
            [0, 0, ROCK_BOTTOM]
          ],
          "none",
          INK,
          1.35
        );

        // --- FRONT-RIGHT GEOLOGICAL CUTAWAY WALL (u = U_MAX, v = 0..V_MAX) ---
        const rightStrataColors = ["#C98C4E", "#B66F3B", "#9D542E", "#7E3E22"];
        const rightSamples = 22;

        function waveRight(layerIdx, v) {
          if (layerIdx === 0) return -SLAB_THICK;
          if (layerIdx === 4) return ROCK_BOTTOM;
          const base = leftStrataDepths[layerIdx];
          return (
            base +
            0.13 * Math.sin(U_MAX * 0.48 + layerIdx * 1.15 - v * 0.42) +
            0.06 * Math.cos(U_MAX * 1.05 - layerIdx * 0.8 + v * 0.9)
          );
        }

        for (let s = 0; s < 4; s++) {
          const polyPts = [];
          for (let i = 0; i <= rightSamples; i++) {
            const v = (V_MAX * i) / rightSamples;
            polyPts.push([U_MAX, v, waveRight(s, v)]);
          }
          for (let i = rightSamples; i >= 0; i--) {
            const v = (V_MAX * i) / rightSamples;
            polyPts.push([U_MAX, v, waveRight(s + 1, v)]);
          }
          isoPoly(wHousingBack, polyPts, rightStrataColors[s], "#5B2F18", 0.85);
        }

        // Cool slate-blue chilled thermal reservoir zone glowing around right injection well
        const coolAuraPos = iso(U_MAX, INJ_V - 0.15, -1.85);
        const coolAura = el(
          "ellipse",
          {
            cx: coolAuraPos[0].toFixed(1),
            cy: coolAuraPos[1].toFixed(1),
            rx: 126,
            ry: 108,
            fill: "url(#grad-geo-cool)",
            opacity: 0.85
          },
          wHousingBack
        );
        animThermalAuras.push({ el: coolAura, baseOp: 0.82, amp: 0.14, channel: "cool", phase: 2.1 });

        // Crisp dark outline framing front-right geological cutaway face
        isoPoly(
          wHousingBack,
          [
            [U_MAX, 0, -SLAB_THICK],
            [U_MAX, V_MAX, -SLAB_THICK],
            [U_MAX, V_MAX, ROCK_BOTTOM],
            [U_MAX, 0, ROCK_BOTTOM]
          ],
          "none",
          INK,
          1.35
        );

        // --- SEMI-CYLINDRICAL CARVED ROCK TRENCHES FOR BOTH DEEP WELLS ---
        // Left trench carved into front-left rock face at u = PROD_U
        isoPoly(
          wHousingBack,
          [
            [PROD_U - 0.56, 0, -SLAB_THICK],
            [PROD_U + 0.56, 0, -SLAB_THICK],
            [PROD_U + 0.44, 0, ROCK_BOTTOM - 0.04],
            [PROD_U - 0.44, 0, ROCK_BOTTOM - 0.04]
          ],
          "#2C2523",
          INK,
          1.15
        );
        // Right trench carved into front-right rock face at v = INJ_V
        isoPoly(
          wHousingBack,
          [
            [U_MAX, INJ_V - 0.52, -SLAB_THICK],
            [U_MAX, INJ_V + 0.52, -SLAB_THICK],
            [U_MAX, INJ_V + 0.42, ROCK_BOTTOM - 0.04],
            [U_MAX, INJ_V - 0.42, ROCK_BOTTOM - 0.04]
          ],
          "#1B2636",
          INK,
          1.15
        );

        // --- CHARCOAL-SLATE TOP DECK SLAB WITH CLEAN BACK-LEFT CHAMFER ---
        // Left-front slab edge rim
        isoPoly(
          wHousingBack,
          [
            [0, 0, 0],
            [U_MAX, 0, 0],
            [U_MAX, 0, -SLAB_THICK],
            [0, 0, -SLAB_THICK]
          ],
          "#3C4654",
          INK,
          1.3
        );
        // Right-front slab edge rim
        isoPoly(
          wHousingBack,
          [
            [U_MAX, 0, 0],
            [U_MAX, V_MAX, 0],
            [U_MAX, V_MAX, -SLAB_THICK],
            [U_MAX, 0, -SLAB_THICK]
          ],
          "#2F3845",
          INK,
          1.3
        );

        // Main chamfered dark charcoal-slate top surface
        const topDeckVerts = [
          [0, 0, 0],
          [0, 6.25, 0],
          [3.95, 10.20, 0],
          [3.95, V_MAX, 0],
          [U_MAX, V_MAX, 0],
          [U_MAX, 0, 0]
        ];
        isoPoly(wHousingBack, topDeckVerts, "url(#grad-slab-top)", INK, 1.35);

        // Crisp beveled top-rim highlight line around the dark slate deck
        const bevelPts = topDeckVerts.map(function (p) {
          return iso(p[0], p[1], p[2] + 0.02);
        });
        el(
          "polyline",
          {
            points: bevelPts
              .map(function (c) {
                return c[0].toFixed(1) + "," + c[1].toFixed(1);
              })
              .join(" "),
            fill: "none",
            stroke: "#7A8696",
            "stroke-width": 1.4,
            opacity: 0.72,
            "stroke-linejoin": "round"
          },
          wHousingBack
        );

        // Subtle recessed dark circular sockets on top slab where wells descend
        const prodHole = [];
        const injHole = [];
        for (let i = 0; i < 24; i++) {
          const a = (i / 24) * Math.PI * 2;
          prodHole.push([PROD_U + 0.66 * Math.cos(a), PROD_V + 0.66 * Math.sin(a), 0.01]);
          injHole.push([INJ_U + 0.60 * Math.cos(a), INJ_V + 0.60 * Math.sin(a), 0.01]);
        }
        isoPoly(wHousingBack, prodHole, "#1E2530", INK, 1.15);
        isoPoly(wHousingBack, injHole, "#1E2530", INK, 1.15);
      }

      /* ---------------------------------------------------------------------
         3.0B. HOUSING FRONT: Clean Rock-Edge Lip Accents Framing Well Cutaways
         --------------------------------------------------------------------- */

        isoPoly(
